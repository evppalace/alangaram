function initFirebase(){
  if(!CONFIG_SET){render();return;}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    DB=firebase.database();
    // Real-time listeners - instant sync between all users
    DB.ref('leads').on('value',function(snap){
      DATA.leads=[];
      if(snap.val()){Object.keys(snap.val()).forEach(function(k){DATA.leads.push(Object.assign({},snap.val()[k],{id:k}));});}
      syncCateringFromLeads();
      if(!LOADING)render();
    },function(err){console.error('Leads sync error:',err);});
    DB.ref('bookings').on('value',function(snap){
      DATA.bookings=[];
      if(snap.val()){Object.keys(snap.val()).forEach(function(k){DATA.bookings.push(Object.assign({},snap.val()[k],{id:k}));});}
      LOADING=false;render();
    },function(err){console.error('Bookings sync error:',err);LOADING=false;render();});
    DB.ref('decors').on('value',function(snap){
      DATA.decors=[];
      if(snap.val()){Object.keys(snap.val()).forEach(function(k){DATA.decors.push(Object.assign({},snap.val()[k],{id:k}));});}
      if(!LOADING)render();
    },function(err){console.error('Decors sync error:',err);});

      DATA.photo.sort(function(a,b){return new Date(a.eventDate||'2099-01-01')-new Date(b.eventDate||'2099-01-01');});

function cloudSaveLead(lead){
  if(!DB)return;
  // Track edit history
  if(AUTH){var log=(lead.editLog||[]).slice();log.push({by:AUTH.display,at:new Date().toISOString(),note:'Updated lead'});if(log.length>20)log=log.slice(-20);lead=Object.assign({},lead,{editLog:log});}
  DB.ref('leads/'+lead.id).set(lead).catch(function(e){alert('Save failed. Check internet connection.');console.error(e);});
}
function cloudSaveBooking(bkg){
  if(!DB)return;
  // Track edit history
  if(AUTH){var log=(bkg.editLog||[]).slice();log.push({by:AUTH.display,at:new Date().toISOString(),note:'Updated booking'});if(log.length>30)log=log.slice(-30);bkg=Object.assign({},bkg,{editLog:log});}
  DB.ref('bookings/'+bkg.id).set(bkg).catch(function(e){alert('Save failed. Check internet connection.');console.error(e);});
}
function cloudDeleteLead(id){if(!DB)return;DB.ref('leads/'+id).remove().catch(function(e){console.error(e);});}
function cloudSaveDecor(dec){if(!DB)return;DB.ref('decors/'+dec.id).set(dec).catch(function(e){alert('Save failed. Check internet.');console.error(e);});}
function cloudDeleteDecor(id){if(!DB)return;DB.ref('decors/'+id).remove().catch(function(e){console.error(e);});}

function parseCSVLine(line){
  var result=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){inQ=!inQ;}
    else if(c===','&&!inQ){result.push(cur.trim());cur='';}
    else{cur+=c;}
  }
  result.push(cur.trim());
  return result;
}

// ── IN-APP DOCUMENT OVERLAY (keeps PDFs/summaries inside the PWA so Back always works) ──
function showAppOverlay(html){
  var old=document.getElementById('_docOverlay');if(old)old.remove();
  var wrap=document.createElement('div');
  wrap.id='_docOverlay';
  wrap.setAttribute('style','position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:99999;');
  var closeBtn=document.createElement('button');
  closeBtn.textContent='\u2715 Close';
  closeBtn.setAttribute('style','position:fixed;top:12px;right:12px;background:#c8922a;color:#fff;border:none;border-radius:20px;padding:9px 18px;font-size:13px;font-weight:700;z-index:100000;box-shadow:0 2px 12px rgba(0,0,0,.35);cursor:pointer');
  closeBtn.onclick=function(){wrap.remove();};
  var iframe=document.createElement('iframe');
  iframe.setAttribute('style','position:absolute;top:0;left:0;width:100%;height:100%;border:none;background:#fff');
  wrap.appendChild(iframe);
  wrap.appendChild(closeBtn);
  document.body.appendChild(wrap);
  var doc=iframe.contentWindow.document;
  doc.open();doc.write(html);doc.close();
}
function openPDFQuote(src,type){
  try{
    var html=buildPDFQuote(src,type);
    showAppOverlay(html);
  }catch(e){alert('Error: '+e.message);}
}

    var bk=bizKeyForRoute(page,UI.hall);

      alert("You don't have access to this section. Ask your admin or manager to grant it.");
      return;
    }
  }
  if(!NAV_BACK&&UI.page&&UI.page!==page){NAV_HISTORY.push({page:UI.page,bid:UI.bid});}

  UI.page=page;UI.bid=bid||null;UI.sf='all';UI.q='';UI.cq='';OV=null;EDIT_ID=null;FORM={};window.scrollTo(0,0);render();
}
function goBack(){

  go(prev.page,prev.bid);
}

STE_API_KEY_HERE</strong> → Replace all 7 placeholder values including <strong>PASTE_DATABASE_URL_HERE</strong> with your Firebase config → Save the file</div></div></div><div class="setup-step"><div class="step-num">5</div><div><div style="font-weight:700;margin-bottom:3px">Host on Netlify (Free Permanent Link)</div><div style="font-size:12px;color:var(--mu)">Go to <strong style="color:var(--gold)">netlify.com</strong> → Sign up free → "Deploy manually" → Drag & drop this HTML file → Get your permanent link instantly!</div></div></div><div style="background:var(--goldF);border:1px solid var(--bdr);border-radius:8px;padding:12px;margin-top:10px;font-size:12px;color:var(--c2r)"><strong style="color:var(--gold)">✓ After setup:</strong> Both Yokesh & Bose open the same Netlify link → Log in → All data syncs instantly between phones in real time!</div><a href="https://console.firebase.google.com" target="_blank" class="btn bp bl" style="margin-top:14px;text-decoration:none">Open Firebase Console →</a></div></div>';
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  var root=document.getElementById('app');
  if(!CONFIG_SET){root.innerHTML=renderSetup();return;}
  if(LOADING){root.innerHTML='<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px"><div class="spinner"></div><div style="color:var(--gold);font-size:14px">Connecting to cloud...</div></div>';return;}
  if(!AUTH){root.innerHTML=renderLogin();attachEvents();return;}
  var h=renderTopbar()+'<div class="pg">';
  if(UI.page==='dashboard')h+=renderDash();
  else if(UI.page==='switcher')h+=renderBizSwitcher();
  else if(UI.page==='staffAccess')h+=renderStaffAccess();
  else if(UI.page==='leads')h+=renderLeads();
  else if(UI.page==='catering')h+=renderCatering();
  else if(UI.page==='biryani')h+=renderBiryani();
  else if(UI.page==='decorHub')h+=renderDecorHub();
  else if(UI.page==='decorEVP')h+=renderDecorEVP();
  else if(UI.page==='decorOther')h+=renderDecorOther();
  else if(UI.page==='bookings')h+=renderBkgs();
  else if(UI.page==='booking')h+=renderBkg();
  else if(UI.page==='calendar')h+=renderCal();
  else if(UI.page==='payments')h+=renderPays();
  else if(UI.page==='ledger')h+=renderLedger();
  h+='</div>'+renderBotnav();
  if(OV)h+=renderOv();
  root.innerHTML=h;
  attachEvents();
}

// ── LOGIN ─────────────────────────────────────────────────────────────────────
function renderLogin(){return '<div class="lwrap"><div class="lcard"><div style="text-align:center;margin-bottom:20px"><div style="display:inline-block;background:#FBF6EE;border-radius:18px;padding:18px 24px;box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 1px rgba(122,27,38,.15)">'+logo(90)+'</div></div><div style="text-align:center;font-size:18px;font-weight:800;margin-bottom:4px">Welcome Back</div><div style="text-align:center;font-size:11px;color:var(--mu);margin-bottom:6px">Alangaram Group</div><div style="text-align:center;margin-bottom:20px"><span class="sync-dot"></span><span style="font-size:11px;color:var(--gr)">Live sync active — Cloud connected</span></div><div id="lerr" style="display:none;background:var(--rF);border:1px solid rgba(200,64,48,.35);border-radius:7px;padding:9px 13px;color:var(--rd);font-size:12px;text-align:center;margin-bottom:13px">Incorrect Employee ID or password</div><div class="fg"><label class="fl">Employee ID</label><input class="inp" id="lu" placeholder="e.g. 0001" autocomplete="username" inputmode="numeric"></div><div class="fg"><label class="fl">Password</label><input class="inp" id="lp" type="password" placeholder="Enter password"></div><button class="btn bp bl lg" onclick="doLogin()" style="margin-top:8px">Login</button></div></div>';}
function doLogin(){
  var u=(document.getElementById('lu')||{}).value||'';
  var p=(document.getElementById('lp')||{}).value||'';
  var k=u.trim();var usr=allUsers()[k];
  if(usr&&usr.pass===p){
    AUTH={key:k,role:usr.role,display:usr.display,biz:usr.biz||'all'};
    saveAuth();
    setTimeout(function(){syncCateringFromLeads();},1500);
    initialRouteForAuth();
    // Save last login info to Firebase
    if(DB){
      var _now=new Date().toISOString();
      var _ua=navigator.userAgent||'';
      var _dev=_ua.indexOf('Android')>-1?'Android':_ua.indexOf('iPhone')>-1?'iPhone':'Browser';
      // Read previous login before overwriting
      DB.ref('lastLogin/'+k).once('value',function(snap){
        if(snap.val()) LAST_LOGIN=snap.val();
        DB.ref('lastLogin/'+k).set({at:_now,device:_dev,display:usr.display});
      });
    }
    requestNotifPermission();
    // Load FCM keys from Firebase (shared across all phones)
    if(DB)DB.ref('config/fcm').once('value',function(snap){
      if(snap.val()){
        var cfg=snap.val();
        if(cfg.sk){FCM_SERVER_KEY=cfg.sk;localStorage.setItem('evp_fcm_sk',cfg.sk);}
        if(cfg.vk){FCM_VAPID_KEY=cfg.vk;localStorage.setItem('evp_fcm_vk',cfg.vk);}
      }
      initFCM();
    });
    setTimeout(showPWABanner,3000);
    render();
    loadNotifs();
  }else{
    var el=document.getElementById('lerr');if(el)el.style.display='block';
  }
}

  else{
    if(NAV_HISTORY.length>0&&UI.page!=='dashboard'){h+='<button class="btn bg sm" data-action="go-back" title="Back">&larr;</button>';}
    h+='<button class="btn bg sm" data-action="go-switcher" style="padding:4px 8px;background:#FBF6EE;border:none;border-radius:9px" title="Switch Business">'+logo(26)+'</button>';
    h+='<div class="tbt">Alangaram Group<span class="tbs">'+xe(AUTH.display)+' &bull; <span style="padding:1px 6px;border-radius:3px;font-size:9px;font-weight:700;'+(isAdmin()?'background:rgba(200,146,42,.2);color:var(--gold)':isManager()?'background:rgba(90,158,111,.15);color:var(--gr)':'background:rgba(88,128,200,.15);color:var(--bl)')+'">'+(isAdmin()?'ADMIN':isManager()?'MANAGER':'STAFF')+'</span> &nbsp;<span class="sync-dot" title="Cloud synced"></span></span></div>';
  }

function staffEdit(id){

function svvDays(d){
  if(!d)return null;
  var t=new Date(d+'T00:00:00');if(isNaN(t))return null;
  var now=new Date();now.setHours(0,0,0,0);
  return Math.round((t-now)/86400000);
}

function svvParseLinks(t){
  if(!t)return [];
  var out=[],seen={};
  String(t).split(/[\s,]+/).forEach(function(u){
    u=u.trim().replace(/[)\]]+$/,'');
    if(!u)return;
    if(!/^https?:\/\//i.test(u))u='https://'+u.replace(/^\/+/,'');
    if(!/^https?:\/\/[^\s\/]+\.[a-z]{2,}([\/?#]|$)/i.test(u))return;
    if(/^https?:\/\/[^\s\/]*\.(jpe?g|png|webp|gif|bmp|pdf)$/i.test(u))return;
    if(seen[u])return;seen[u]=1;out.push(u);
  });
  return out.slice(0,12);
}

  var l=(DATA.photo||[]).filter(function(x){return x.id===id;})[0];if(!l)return;
  if(WTC_PENDING&&WTC_PENDING.id===id){
    var f=WTC_PENDING.file;WTC_PENDING=null;
    navigator.share({files:[f],text:wtcMsg(l)}).catch(function(){});
    render();return;
  }
  if(btn){btn.textContent='Preparing...';btn.disabled=true;}
  fetch(SITE_BASE+'/wtc-poster.jpg').then(function(r){return r.blob();}).then(function(bl){
    var file=new File([bl],'WTC-Weddings.jpg',{type:'image/jpeg'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      WTC_PENDING={id:id,file:file};
      render();
    }else{
      wtcWA(id);
    }
  }).catch(function(){wtcWA(id);});
}

// Shared list/card renderer for both new decor modules (kept as one function so
// SVV Hall / EVP Hall / Other Venue decor all look and behave identically)
function renderVenueDecorList(dataKey,title,formOn,F,fieldFn,newFn,editFn,cancelFn,saveFn,statusFn,deleteFn,waFn,prefix,showVenueField){
  F=F||{};
  var q=(UI[prefix+'Q']||'').toLowerCase().trim();
  var all=(DATA[dataKey]||[]).slice();
  var list=all.filter(function(l){
    if(UI[prefix+'Filt']&&UI[prefix+'Filt']!=='all'&&l.status!==UI[prefix+'Filt'])return false;
    if(!q)return true;
    return ((l.name||'')+' '+(l.phone||'')+' '+(l.notes||'')+' '+(l.venueName||'')).toLowerCase().indexOf(q)>=0;
  });
  var open=all.filter(function(l){return l.status!=='confirmed'&&l.status!=='lost';}).length;
  var conv=all.filter(function(l){return l.status==='confirmed';}).length;

  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">';
  h+='<div><h2 style="font-size:17px">'+title+'</h2><div style="font-size:10px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-top:2px">Decor pipeline</div></div>';
  h+=(isAdminOrManager()?'<button class="btn bp sm" onclick="'+newFn.name+'()">+ Lead</button>':'')+'</div>';

  h+='<div style="display:flex;gap:8px;margin-bottom:12px">';
  [['Open',open,'var(--gold)'],['Confirmed',conv,'#5A9E6F'],['Total',all.length,'var(--mu)']].forEach(function(x){
    h+='<div class="card" style="flex:1;margin:0;text-align:center;padding:11px"><div style="font-size:19px;font-weight:800;color:'+x[2]+'">'+x[1]+'</div>'+
       '<div style="font-size:9px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em;margin-top:2px">'+x[0]+'</div></div>';
  });
  h+='</div>';

  if(formOn){
    h+='<div class="card"><div class="stit">'+(F.id?'Edit Lead':'New Lead')+'</div>';
    h+='<div class="fg"><label class="fl">Client Name <span class="rq">*</span></label><input class="inp" value="'+xe(F.n||'')+'" oninput="'+fieldFn.name+'(\'n\',this.value)"></div>';
    h+='<div class="fg"><label class="fl">Phone <span class="rq">*</span></label><input class="inp" type="tel" inputmode="numeric" placeholder="10 digit number" value="'+xe(F.p||'')+'" oninput="'+fieldFn.name+'(\'p\',this.value)"></div>';
    if(showVenueField){
      h+='<div class="fg"><label class="fl">Venue Name</label><input class="inp" placeholder="e.g. Grand Palace, Chennai" value="'+xe(F.venue||'')+'" oninput="'+fieldFn.name+'(\'venue\',this.value)"></div>';
    }
    h+='<div class="fg"><label class="fl">Occasion</label><select class="inp" onchange="'+fieldFn.name+'(\'f\',this.value)">'+
       KS_OCCASIONS.map(function(o){return '<option'+(o===(F.f||'Wedding')?' selected':'')+'>'+xe(o)+'</option>';}).join('')+'</select></div>';
    h+='<div style="display:flex;gap:8px">';
    h+='<div class="fg" style="flex:1"><label class="fl">Event Date</label><input class="inp" type="date" value="'+xe(F.d||'')+'" oninput="'+fieldFn.name+'(\'d\',this.value)"></div>';
    h+='<div class="fg" style="flex:1"><label class="fl">End Date (if 2 days)</label><input class="inp" type="date" value="'+xe(F.d2||'')+'" oninput="'+fieldFn.name+'(\'d2\',this.value)"></div>';
    h+='</div>';
    h+='<div class="fg"><label class="fl">Guests</label><input class="inp" type="number" inputmode="numeric" value="'+xe(F.g||'')+'" oninput="'+fieldFn.name+'(\'g\',this.value)"></div>';
    h+='<div class="fg"><label class="fl">Notes</label><textarea class="inp" rows="2" oninput="'+fieldFn.name+'(\'note\',this.value)">'+xe(F.note||'')+'</textarea></div>';
    h+='<div style="display:flex;gap:8px"><button class="btn bp" style="flex:1" onclick="'+saveFn.name+'()">Save lead</button>';
    h+='<button class="btn bg" onclick="'+cancelFn.name+'()">Cancel</button></div></div>';
  }

  h+='<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:9px">';
  h+='<button class="btn '+(!UI[prefix+'Filt']||UI[prefix+'Filt']==='all'?'bp':'bg')+' sm" onclick="UI.'+prefix+'Filt=\'all\';render()">All ('+all.length+')</button>';
  STATS.forEach(function(st){
    var n=all.filter(function(l){return l.status===st.k;}).length;
    if(n)h+='<button class="btn '+(UI[prefix+'Filt']===st.k?'bp':'bg')+' sm" onclick="UI.'+prefix+'Filt=\''+st.k+'\';render()">'+st.l+' ('+n+')</button>';
  });
  h+='</div>';
  h+='<input class="srch" id="'+prefix+'srch" placeholder="Search name / phone / notes..." value="'+xe(UI[prefix+'Q']||'')+'">';

  if(!list.length){
    h+='<div style="text-align:center;padding:34px 12px;color:var(--mu)">';
    h+=all.length===0?'No leads yet<br><small>Add your first one with + Lead</small>':'No lead matches that filter';
    h+='</div>';
    return h;
  }

  list.forEach(function(l){
    var st=svvStat(l.status),dd=svvDays(l.eventDate);
    h+='<div class="card">';
    h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:7px">';
    h+='<div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:800">'+xe(l.name||'Unnamed')+'</div>';
    h+='<div style="font-size:11.5px;color:var(--mu);margin-top:2px">&#128222; '+xe(l.phone||'\u2014')+(l.fnType?' &bull; '+xe(l.fnType):'')+'</div>';
    h+='<div style="font-size:11px;color:var(--mu);margin-top:2px">'+(l.eventDate?xe(durlbl(l.eventDate,l.eventEndDate)):'Date not set')+
       (l.guests?' &bull; '+xe(l.guests)+' guests':'')+(dd!==null&&dd>=0?' &bull; '+dd+'d away':'')+'</div>';
    if(l.venueName)h+='<div style="font-size:11px;color:var(--mu);margin-top:2px">Venue: '+xe(l.venueName)+'</div>';
    h+='</div><span class="bdg" style="background:'+st.c+'22;color:'+st.c+';border:1px solid '+st.c+'40">'+st.l+'</span></div>';
    if(l.notes)h+='<div style="font-size:11.5px;color:var(--mu);background:var(--c2);border-radius:7px;padding:8px;margin-bottom:8px">'+xe(l.notes)+'</div>';
    h+='<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">';
    STATS.forEach(function(x){
      var on=l.status===x.k;
      h+='<button class="btn sm" style="background:'+(on?x.c+'22':'transparent')+';color:'+(on?x.c:'var(--mu)')+
         ';border:1px solid '+(on?x.c+'60':'var(--bdr)')+'" onclick="'+statusFn.name+'(\''+l.id+'\',\''+x.k+'\')">'+x.l+'</button>';
    });
    h+='</div>';
    h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
    h+='<button class="btn bwa sm" onclick="'+waFn.name+'(\''+l.id+'\')">&#128241; Pitch</button>';
    h+='<a class="btn bg sm" href="tel:'+xe(l.phone)+'" style="text-decoration:none">&#128222; Call</a>';
    h+='<button class="btn bg sm" onclick="'+editFn.name+'(\''+l.id+'\')">&#9998; Edit</button>';
    h+='<button class="btn bg sm" style="color:var(--rd)" onclick="'+deleteFn.name+'(\''+l.id+'\')">&#128465; Delete</button>';
    h+='</div></div>';
  });
  return h;
}

function wantsCatering(l){

// ── CROSS-PITCH DISTRIBUTION ─────────────────────────────────────────────────
// Every lead that arrives anywhere is offered to every other business.
var XFER=[
  {k:'KS', name:'Kalyana Sapadu', table:'catering_leads', data:function(){return DATA.catering;}},
  {k:'WTC',name:'WTC Photography',table:'photo_leads',    data:function(){return DATA.photo;}}
];
function xferSources(){
  return [
    {tag:'EVP', label:'EVP Rajeshwari', rows:DATA.leads||[], date:'startDate'},
    {tag:'SVV', label:'SVV Hall',       rows:DATA.svv||[],   date:'eventDate'}
  ];
}
function xferId(target,tag,srcId){
  if(target==='KS'&&tag==='EVP')return 'KSL'+srcId;   // original scheme, kept so nothing duplicates
  return target+tag+srcId;
}
function xferRecord(target,src,tag,label){
  var d=src[tag==='EVP'?'startDate':'eventDate']||'';
  var base={
    leadId:src.id,origin:tag,originName:label,
    name:src.name||'',phone:src.phone||'',eventDate:d,
    guests:Number(src.guests)||0,fnType:src.fnType||'',venue:tag==='SVV'?'SVV Hall':'',
    notes:src.notes||'',status:'lead',source:tag.toLowerCase()+'-lead',
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
  };
  if(target==='KS'){
    base.quoteId=xferId(target,tag,src.id);
    base.brand='KS';base.brandName='Kalyana Sapadu';base.total=0;
    base.cateringAsked=(tag==='EVP')?wantsCatering(src):false;
  }else{
    base.brand='WTC';base.brandName='WTC Photography';
    base.refLinks=src.refLinks||[];
  }
  return base;
}
var _xferTried={};
function distributeLeads(force){
  if(!DB||!AUTH)return;
  if(force)_xferTried={};
  XFER.forEach(function(t){
    var have={};
    (t.data()||[]).forEach(function(r){if(r.leadId)have[r.leadId]=1;});
    xferSources().forEach(function(sc){
      sc.rows.forEach(function(l){
        if(!l||!l.id)return;
        var key=t.k+'|'+l.id;
        if(have[l.id]||_xferTried[key])return;
        _xferTried[key]=1;
        var rid=xferId(t.k,sc.tag,l.id);
        DB.ref(t.table+'/'+rid).once('value',function(sn){
          if(sn.exists())return;
          DB.ref(t.table+'/'+rid).set(xferRecord(t.k,l,sc.tag,sc.label)).then(function(){
            CATSYNC.made++;CATSYNC.err='';
            if(UI.page==='catering'||UI.page==='leads')render();
          }).catch(function(e){
            CATSYNC.err=(e&&e.message)||String(e);
            if(UI.page==='catering'||UI.page==='leads')render();
          });
        },function(e){
          CATSYNC.err=(e&&e.message)||String(e);
          delete _xferTried[key];
        });
      });
    });
  });
}
function syncCateringFromLeads(force){distributeLeads(force);}
function xferCount(tag){
  var n=0;
  XFER.forEach(function(t){(t.data()||[]).forEach(function(r){if(r.origin===tag)n++;});});
  return n;
}
function pitchedTo(srcId){
  var out=[];
  XFER.forEach(function(t){
    var hit=(t.data()||[]).filter(function(r){return r.leadId===srcId;})[0];
    if(hit)out.push({k:t.k,name:t.name,status:hit.status,active:Number(hit.total)>0||hit.status!=='lead'});
  });
  return out;
}

    render();
  },2500);
}

function last10(s){return (s||'').replace(/\D/g,'').slice(-10);}
function connectGoogleDrive(){
  try{
    if(typeof google==='undefined'||!google.accounts){alert('Google sign-in didn\'t load. If you\'re using the installed app icon, try opening this site in Safari/Chrome directly instead — some browsers block sign-in popups inside installed apps.');return;}
    var tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:'https://www.googleapis.com/auth/drive.readonly',
      callback:function(resp){
        try{
          if(resp.error){alert('Google Drive connection failed: '+resp.error);return;}
          GDRIVE_TOKEN=resp.access_token;
          syncCallRecordings();
        }catch(e2){console.error(e2);alert('Drive sign-in error: '+e2.message);}
      }
    });
    tokenClient.requestAccessToken();
  }catch(e){console.error(e);alert('Could not start Google sign-in: '+e.message+'\nTry opening this site in your regular browser instead of the installed app icon.');}
}
function syncCallRecordings(){
  try{
    if(!GDRIVE_TOKEN){connectGoogleDrive();return;}
    showToast&&showToast('🔄 Scanning Google Drive for call recordings...','info');
    var url='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("mimeType contains 'audio/' and trashed=false")+'&fields='+encodeURIComponent('files(id,name,webViewLink,createdTime)')+'&pageSize=200&orderBy=createdTime desc';
    fetch(url,{headers:{Authorization:'Bearer '+GDRIVE_TOKEN}})
      .then(function(r){
        if(r.status===401){GDRIVE_TOKEN=null;alert('Google Drive session expired. Please tap Sync again to reconnect.');return null;}
        return r.json();
      })
      .then(function(data){
        try{
          if(!data||!data.files)return;
          var matchedCount=0;
          data.files.forEach(function(f){
            var digits=(f.name.match(/\d{10}/)||[])[0];
            if(!digits)return;
            DATA.leads.forEach(function(l){
              if(last10(l.phone)===digits){
                var recs=(l.callRecordings||[]).slice();
                if(!recs.some(function(r){return r.fileId===f.id;})){
                  recs.push({fileId:f.id,name:f.name,link:f.webViewLink,date:f.createdTime});
                  cloudSaveLead(Object.assign({},l,{callRecordings:recs}));
                  matchedCount++;
                }
              }
            });
            DATA.bookings.forEach(function(b){
              if(last10(b.phone)===digits){
                var recs2=(b.callRecordings||[]).slice();
                if(!recs2.some(function(r){return r.fileId===f.id;})){
                  recs2.push({fileId:f.id,name:f.name,link:f.webViewLink,date:f.createdTime});
                  cloudSaveBooking(Object.assign({},b,{callRecordings:recs2}));
                  matchedCount++;
                }
              }
            });
          });
          showToast&&showToast(matchedCount>0?('✅ Linked '+matchedCount+' recording(s) to clients'):'No new matching recordings found','success');
          setTimeout(render,600);
        }catch(e3){console.error(e3);alert('Error processing Drive files: '+e3.message);}
      })
      .catch(function(e){console.error(e);alert('Error syncing Drive: '+e.message);});
  }catch(e0){console.error(e0);alert('Sync failed to start: '+e0.message);}
}

function buildCRMContext(){
  var now=new Date(),todayStr=today();
  var ctx='You are EVP AI, the intelligent assistant for EVP Rajeshwari Marriage Palace CRM.\n';
  ctx+='You know everything about bookings, leads, payments, accounts and muhurtham dates.\n';
  ctx+='Answer in the same language the user asks (Tamil or English). Be concise and helpful.\n';
  ctx+='Today: '+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'\n\n';

  // Bookings
  ctx+='=== BOOKINGS ('+DATA.bookings.length+') ===\n';
  DATA.bookings.slice().sort(function(a,b){return(a.startDate||'').localeCompare(b.startDate||'');}).forEach(function(b){
    var p=calcp(b);
    var daysAway=b.startDate?Math.round((new Date(b.startDate+'T00:00:00')-now)/(86400000)):null;
    ctx+='• '+b.name+' | '+xe(b.fnType||'')+' | '+fd(b.startDate)+(daysAway!==null?' ('+( daysAway>0?'in '+daysAway+' days': daysAway===0?'TODAY':''+Math.abs(daysAway)+' days ago')+')':'')+'\n';
    ctx+='  Total: '+fm(p.grand)+' | Paid: '+fm(p.paid)+' | Balance: '+(p.bal>0?fm(p.bal)+' PENDING':'CLEARED')+'\n';
    if(b.decor&&b.decor.budget>0){var dp=decorPaid(b);ctx+='  Decor: Budget '+fm(Number(b.decor.budget))+' | Received '+fm(dp)+' | Due '+fm(Math.max(0,Number(b.decor.budget)-dp))+'\n';}
    if(b.deposit&&Number(b.depositAmount)>0){ctx+='  Deposit: '+fm(Number(b.depositAmount))+' (to refund after event)\n';}
  });

  // Upcoming muhurtham dates (next 6 months)
  ctx+='\n=== UPCOMING MUHURTHAM DATES ===\n';
  var upcomingMuh=Object.keys(MUH_INFO).filter(function(d){return d>=todayStr;}).sort().slice(0,15);
  upcomingMuh.forEach(function(d){
    var mi=MUH_INFO[d];var isBooked=!!MUH[d]&&DATA.bookings.some(function(b){return b.startDate===d;});
    ctx+='• '+fd(d)+': '+mi.star+', '+mi.t+', Nalla Neram '+mi.m+(isBooked?' [BOOKED]':' [AVAILABLE]')+'\n';
  });

  // Leads
  ctx+='\n=== LEADS ('+DATA.leads.length+') ===\n';
  DATA.leads.filter(function(l){return l.status!=='lost'&&l.status!=='confirmed';}).forEach(function(l){
    ctx+='• '+l.name+' | '+xe(l.status)+' | '+(l.startDate?fd(l.startDate):'No date')+' | '+(l.phone||'')+'\n';
  });

  // Financial summary
  var totalRev=DATA.bookings.reduce(function(s,b){return s+calcp(b).paid;},0);
  var totalPending=DATA.bookings.reduce(function(s,b){return s+calcp(b).bal;},0);
  var totalDeposit=DATA.bookings.reduce(function(s,b){return s+Number(b.depositAmount||0);},0);
  var venExp=DATA.ledger.filter(function(e){return e.scope!=='event'&&e.type!=='income';}).reduce(function(s,e){return s+Number(e.amount||0);},0);
  var venInc=DATA.ledger.filter(function(e){return e.scope!=='event'&&e.type==='income';}).reduce(function(s,e){return s+Number(e.amount||0);},0);
  var evtExp=DATA.ledger.filter(function(e){return e.scope==='event';}).reduce(function(s,e){return s+Number(e.amount||0);},0);
  ctx+='\n=== FINANCIAL SUMMARY ===\n';
  ctx+='Total Collected from Clients: '+fm(totalRev)+'\n';
  ctx+='Total Pending from Clients: '+fm(totalPending)+'\n';
  ctx+='Deposits Held: '+fm(totalDeposit)+' (to be refunded)\n';
  ctx+='Venue Expenses (historical): '+fm(venExp)+'\n';
  ctx+='Event Expenses: '+fm(evtExp)+'\n';
  ctx+='Net P&L: '+fm(totalRev-venExp-evtExp)+'\n';
  return ctx;
}

async function sendToAI(userMsg){
  var key=getAIKey();
  if(!key){
    AI_MSGS.push({role:'assistant',content:'⚙️ Please set your Anthropic API key first. Tap the ⚙️ Settings button above.'});
    renderAIChat();return;
  }
  AI_MSGS.push({role:'user',content:userMsg});
  AI_THINKING=true;renderAIChat();
  try{
    var res=await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        max_tokens:800,
        messages:[{role:'system',content:buildCRMContext()}].concat(AI_MSGS.map(function(m){return{role:m.role,content:m.content};}))
      })
    });
    var data=await res.json();
    if(data.choices&&data.choices[0]){
      var reply=data.choices[0].message.content||'';
      AI_MSGS.push({role:'assistant',content:reply});
      if(AI_VOICE_OUT)speakAI(reply);
    }else if(data.error){
      AI_MSGS.push({role:'assistant',content:'❌ Error: '+(data.error.message||'Check your Groq API key')});
    }
  }catch(e){
    AI_MSGS.push({role:'assistant',content:'❌ Connection error. Check internet and try again.'});
  }
  AI_THINKING=false;renderAIChat();
}

function speakAI(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text.replace(/[₹*_#]/g,' '));
  u.lang='en-IN';u.rate=0.95;u.pitch=1;
  window.speechSynthesis.speak(u);
}

function startVoiceInput(){
  var SpeechRec=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRec){alert('Voice not supported on this browser. Use Chrome.');return;}
  var rec=new SpeechRec();
  rec.lang='en-IN';rec.interimResults=false;rec.maxAlternatives=1;
  var micBtn=document.getElementById('ai-mic');
  if(micBtn){micBtn.style.background='var(--rd)';micBtn.textContent='🔴';}
  rec.start();
  rec.onresult=function(e){
    var transcript=e.results[0][0].transcript;
    var inp=document.getElementById('ai-inp');if(inp)inp.value=transcript;
    if(micBtn){micBtn.style.background='';micBtn.textContent='🎤';}
  };
  rec.onerror=function(){if(micBtn){micBtn.style.background='';micBtn.textContent='🎤';}};
  rec.onend=function(){if(micBtn){micBtn.style.background='';micBtn.textContent='🎤';}};
}

function _qrRender(text,label,sub){
  if(!text){alert('Nothing to generate a QR for.');return;}
  QR_LAST={text:text,label:label||'QR Code'};
  try{
    var typeNumber=0,ecLevel='M';
    var qr=qrcode(typeNumber,ecLevel);
    qr.addData(text);
    qr.make();
    var dataUrl=qr.createDataURL(8,4);
    var wrap=document.getElementById('qr-canvas-wrap');
    if(wrap)wrap.innerHTML='<img src="'+dataUrl+'" style="display:block;width:220px;height:220px" alt="QR Code">';
    var lbl=document.getElementById('qr-label');if(lbl)lbl.textContent=label||'QR Code';
    var subEl=document.getElementById('qr-sub');if(subEl)subEl.textContent=sub||text;
    var prev=document.getElementById('qr-preview');if(prev){prev.style.display='';prev.scrollIntoView({behavior:'smooth',block:'start'});}
  }catch(e){alert('Could not generate QR: '+e.message);}
}

function genPresetQR(k){
  var p=QR_PRESETS.filter(function(x){return x.k===k;})[0];
  if(!p)return;
  var url=p.url();
  if(!url){alert('This link is not configured yet.');return;}
  _qrRender(url,p.l,url);
}

function genCustomQR(){

function downloadQR(){
  var img=document.querySelector('#qr-canvas-wrap img');
  if(!img){alert('Generate a QR first.');return;}
  var a=document.createElement('a');
  a.href=img.src;
  a.download='evp-qr-'+(QR_LAST.label||'code').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.png';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}

function shareQR(){
  var img=document.querySelector('#qr-canvas-wrap img');
  if(!img){alert('Generate a QR first.');return;}
  if(navigator.share){
    fetch(img.src).then(function(r){return r.blob();}).then(function(blob){
      var file=new File([blob],'evp-qr.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:QR_LAST.label||'EVP QR Code',text:QR_LAST.text});
      }else{
        navigator.share({title:QR_LAST.label||'EVP QR Code',text:QR_LAST.text});
      }
    }).catch(function(){navigator.share({title:QR_LAST.label||'EVP QR Code',text:QR_LAST.text});});
  }else{
    if(navigator.clipboard)navigator.clipboard.writeText(QR_LAST.text);
    alert('Link copied to clipboard (share not supported on this browser).');
  }
}

function stripEmptyParams(url){
  try{var parts=url.split('?');if(parts.length<2)return url;var kept=parts[1].split('&').filter(function(p){var v=p.split('=')[1];return v&&v!=='0'&&v!=='';});return parts[0]+'?'+kept.join('&');}catch(e){return url;}
}
function parseWAPhone(raw){
  // Take first number if multiple separated by ; or ,
  var first=(raw||'').split(/[;,\/]/)[0].trim();
  var ph=first.replace(/[^0-9]/g,'');
  // Normalise to international format
  if(ph.length===12&&ph.indexOf('91')===0)return ph;          // already 91XXXXXXXXXX
  if(ph.length===11&&ph.charAt(0)==='0')return '91'+ph.slice(1); // 0XXXXXXXXXX
  if(ph.length===10)return '91'+ph;                            // XXXXXXXXXX
  if(ph.length>10)return ph;                                   // assume already intl
  return '91'+ph;                                              // best-effort
}
function buildQuoteURLShort(src,type){

function updDecorBalance(){
  var budget=Number((document.getElementById('bd-budget')||{}).value)||0;
  var fin=Number((document.getElementById('bd-pf')||{}).value)||0;// Agreed quote (info only)
  var p1=Number((document.getElementById('bd-p1')||{}).value)||0;
  var p2=Number((document.getElementById('bd-p2')||{}).value)||0;
  var paid=p1+p2;
  var bal=Math.max(0,(budget||fin)-paid);// use budget field; fallback to agreed quote
  var ef=document.getElementById('db-fin'),ep1=document.getElementById('db-p1'),ep2=document.getElementById('db-p2'),eb=document.getElementById('db-bal');
  if(ef)ef.textContent=fm(budget||fin);

  if(ep2)ep2.textContent='— '+fm(p2);
  if(eb){eb.textContent=fm(bal);eb.style.color=bal>0?'var(--rd)':'var(--gr)';}
  var bc=document.getElementById('decor-balance-card');
  if(bc){var bt=bc.querySelector('span:last-child');if(bt)bt.style.color=bal>0?'var(--rd)':'var(--gr)';}
}

function recordBkgPayment(bid){
  var amt=Number((document.getElementById('pamt')||{}).value)||0;
  if(!amt||amt<=0){alert('Enter a valid amount.');return;}
  var bk=fbkg(bid);if(!bk){alert('Booking not found.');return;}
  var px={id:uid(),amount:amt,
    date:(document.getElementById('pdate')||{}).value||today(),
    method:(document.getElementById('pmeth')||{}).value||PMETH[0],
    stage:(document.getElementById('pstage')||{}).value||PSTAGE[0],
    note:(document.getElementById('pnote')||{}).value||'',
    approvedBy:null};
  var pays=(bk.payments||[]).slice();pays.push(px);
  cloudSaveBooking(Object.assign({},bk,{payments:pays}));
  pushNotif('0001','💰 New payment '+fm(px.amount)+' from '+bk.name,'payment');if(AUTH&&AUTH.key!=='0002')pushNotif('0002','💰 New payment '+fm(px.amount)+' from '+bk.name,'payment');
  var pa=document.getElementById('pamt');if(pa)pa.value='';
  alert('Payment of '+fm(amt)+' recorded!');
}

function editBkg(id){
  var bk=fbkg(id);if(!bk)return;
  EDIT_ID=id;
  FORM={};
  FORM.services=(bk.services||[]).slice();
  FORM.pkgId=bk.pkgId||'half';
  FORM.ddItems=(bk.depositDeductions&&bk.depositDeductions.items)?bk.depositDeductions.items.map(function(i){return Object.assign({},i);}):[];
  FORM.maintItems=(bk.maintItems&&bk.maintItems.length)?bk.maintItems.map(function(m){return Object.assign({},m);}):convertOldMaint(bk.extraCharges||bk.addCharges||{});
  FORM.vendorServices=(bk.vendorServices||[]).map(function(vs){
    var obj=Object.assign({},vs);
    if(!obj.clientPayments||!obj.clientPayments.length){obj.clientPayments=[{stage:'1st Payment',amount:obj.totalRecvd||obj.advanceRecvd||'',date:''}];}
    return obj;
  });
  FORM.bkgNewPays=[{stage:'Advance',amount:'',date:new Date().toISOString().slice(0,10),method:'Cash'}];
  OV='booking';
  render();
}

function loadAcctFile(input){
  var file=input.files[0];if(!file)return;
  var preview=document.getElementById('acct-preview');
  if(preview)preview.innerHTML='<div style="text-align:center;padding:16px;color:var(--mu)"><div class="spinner" style="margin:0 auto 8px"></div>Reading file...</div>';
  var ext=file.name.split('.').pop().toLowerCase();
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var rows=[];
      if(ext==='csv'){
        // Parse CSV
        var txt=e.target.result;
        var lines=txt.split(/\r?\n/).filter(function(l){return l.trim();});
        rows=lines.map(function(l){
          var cols=[],cur='',inQ=false;
          for(var i=0;i<l.length;i++){var c=l[i];if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){cols.push(cur.trim());cur='';}else cur+=c;}
          cols.push(cur.trim());return cols;
        });
      }else{
        // Parse Excel using SheetJS
        if(typeof XLSX==='undefined'){if(preview)preview.innerHTML='<div style="color:var(--rd);padding:12px">SheetJS library not loaded. Check internet connection.</div>';return;}
        var wb=XLSX.read(e.target.result,{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      }
      if(!rows.length){if(preview)preview.innerHTML='<div style="color:var(--or);padding:12px">No data found in file.</div>';return;}
      // Render table
      var th='<table style="width:100%;border-collapse:collapse;font-size:11px;min-width:400px">';
      rows.slice(0,200).forEach(function(row,ri){
        var isHead=ri===0;
        th+='<tr style="background:'+(ri%2===0?'var(--c2)':'transparent')+';border-bottom:1px solid var(--b2)">';
        row.forEach(function(cell){
          th+=(isHead?'<th style="padding:6px 8px;text-align:left;font-size:9px;color:var(--gold);font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-bottom:2px solid var(--bdr);white-space:nowrap">':'<td style="padding:5px 8px;color:var(--cr);white-space:nowrap">')+xe(String(cell||''))+(isHead?'</th>':'</td>');
        });
        th+='</tr>';
      });
      th+='</table>';
      if(preview)preview.innerHTML='<div style="margin-bottom:8px;font-size:11px;color:var(--gr)">&#10003; Loaded: <b>'+file.name+'</b> &mdash; '+rows.length+' rows'+(rows.length>200?' (showing first 200)':'')+'</div>'+th;
    }catch(err){
      if(preview)preview.innerHTML='<div style="color:var(--rd);padding:12px">Error reading file: '+err.message+'</div>';
    }
  };
  if(ext==='csv'){reader.readAsText(file);}
  else{reader.readAsArrayBuffer(file);}
}

// ── PREVENT PULL-TO-REFRESH ────────────────────────────────────────────────────
(function(){
  // Layer 1: CSS overscroll-behavior handles Chrome browser
  // Layer 2: JS touch guard
  var _ty=0;
  document.addEventListener('touchstart',function(e){_ty=e.touches[0].clientY;},{passive:true});
  document.addEventListener('touchmove',function(e){
    if(document.documentElement.scrollTop===0&&document.body.scrollTop===0&&e.touches[0].clientY>_ty){
      var t=e.target;
      var inScroll=false;
      while(t&&t!==document.body){
        if(t.scrollHeight>t.clientHeight){
          var ov=window.getComputedStyle(t).overflowY;
          if(ov==='scroll'||ov==='auto'){inScroll=true;break;}
        }
        t=t.parentElement;
      }
      if(!inScroll)e.preventDefault();
    }
  },{passive:false});
  // Layer 3: WebView/SwipeRefreshLayout trick — keep scrollTop at 1px so
  // native Android pull-to-refresh never gets scrollTop===0 to fire
  function _noPtr(){
    if(window.pageYOffset===0)window.scrollTo(0,1);
  }
  window.addEventListener('load',function(){setTimeout(_noPtr,300);});
  document.addEventListener('scroll',_noPtr,{passive:true});
})();
