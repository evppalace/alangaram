<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office — Quote Queue — Alangaram Events</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
body{margin:0;padding:0;font-family:"Segoe UI",Arial,sans-serif;color:#333;background:#faf8f6;}
.header{background:linear-gradient(135deg,#faf8f6,#f3ede8);border-bottom:1px solid #e8ddd3;padding:24px 20px;text-align:center;}
.header img{max-width:180px;width:50%;height:auto;margin-bottom:10px;}
.header h1{margin:4px 0 0 0;font-size:16px;font-weight:700;letter-spacing:0.5px;color:#333;}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
.locked{text-align:center;padding:100px 20px;color:#999;}
.locked button{background:#C0166E;color:#fff;border:none;padding:12px 28px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;margin-top:14px;}
.summary{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
.summary .stat{background:#fff;border:1px solid #eee;border-radius:8px;padding:14px 18px;flex:1;min-width:120px;text-align:center;}
.summary .stat .num{font-size:22px;font-weight:800;color:#6b1a1a;}
.summary .stat .lbl{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;}
.card{background:#fff;border:1px solid #eee;border-radius:8px;padding:18px;margin-bottom:14px;}
.card.pending{border-left:4px solid #C0166E;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.card-name{font-size:15px;font-weight:700;color:#333;}
.card-meta{font-size:11px;color:#999;margin-top:3px;}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:4px 10px;border-radius:20px;white-space:nowrap;}
.badge.pending{background:#fdecf3;color:#C0166E;}
.badge.sent{background:#e8f3e8;color:#2d5016;}
.badge.nobudget{background:#f0f0f0;color:#999;}
.card-budget{margin-top:10px;font-size:13px;color:#333;}
.card-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}
.btn-sm{font-size:11px;font-weight:700;padding:8px 14px;border-radius:5px;border:none;cursor:pointer;text-decoration:none;display:inline-block;}
.btn-view{background:#f0f0f0;color:#333;}
.btn-edit{background:#2d5016;color:#fff;}
.btn-danger{background:#fdeaea;color:#a83232;}
.btn-send{background:#25D366;color:#fff;}
.search-box{width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid #ddd;border-radius:8px;font-size:13px;margin-bottom:16px;font-family:inherit;}
.notes-wrap{margin-top:14px;padding-top:14px;border-top:1px dashed #eee;}
.notes-wrap label{display:block;font-size:10px;color:#999;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:6px;}
.notes-wrap textarea{width:100%;box-sizing:border-box;min-height:50px;padding:8px 10px;border:1px solid #ddd;border-radius:5px;font-size:12px;font-family:inherit;margin-bottom:8px;resize:vertical;}
.edit-panel{margin-top:14px;padding:14px;background:#fffbea;border:1px solid #e8d9a0;border-radius:8px;display:none;}
.edit-panel.show{display:block;}
.edit-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px;}
.edit-row span{font-size:12px;color:#555;flex:1;}
.edit-row input{width:90px;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:12px;text-align:right;}
.empty{text-align:center;padding:60px 20px;color:#999;font-size:13px;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:10px;padding:22px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-box h3{margin:0 0 4px 0;font-size:15px;color:#333;}
.modal-box .sub{font-size:11.5px;color:#999;margin-bottom:16px;}
.field-label{display:block;font-size:11px;color:#999;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin:12px 0 5px;}
.field-input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;}
.field-textarea{width:100%;box-sizing:border-box;min-height:140px;padding:9px 11px;border:1px solid #ddd;border-radius:6px;font-size:12px;font-family:inherit;resize:vertical;}
.preview-box{margin-top:12px;padding:10px 12px;background:#faf6f2;border:1px solid #eee;border-radius:6px;font-size:11.5px;color:#666;max-height:140px;overflow-y:auto;}
.preview-box .pv-sec{font-weight:700;color:#8a6d00;margin-top:6px;}
.modal-actions{display:flex;gap:8px;margin-top:18px;}
</style>
</head>
<body>

<div class="modal-overlay" id="manualAddOverlay">
  <div class="modal-box">
    <h3>➕ Add Client Manually</h3>
    <div class="sub">For selections received as a plain WhatsApp message instead of through the portal — paste the text below and it'll pull out the design codes automatically.</div>
    <label class="field-label">Client Name</label>
    <input type="text" class="field-input" id="maName" placeholder="e.g. Premi &amp; Vignesh">
    <label class="field-label">Phone</label>
    <input type="tel" class="field-input" id="maPhone" placeholder="10-digit number">
    <label class="field-label">Paste their WhatsApp message (or type codes manually)</label>
    <textarea class="field-textarea" id="maText" placeholder="Entrance Arch:
- EA-04 (Entrance Arch Reference #3)
- EA-12 (Entrance Arch Reference #11)
..." oninput="previewManualParse()"></textarea>
    <div id="maImgStatus" style="font-size:11px;color:#999;margin-top:6px;"></div>
    <div class="preview-box" id="maPreview" style="display:none"></div>
    <div id="maError" style="display:none;color:#C0166E;font-size:11.5px;margin-top:8px;"></div>
    <div class="modal-actions">
      <button type="button" class="btn-sm btn-view" style="flex:1" onclick="closeManualAddModal()">Cancel</button>
      <button type="button" class="btn-sm btn-edit" style="flex:1" id="maSaveBtn" onclick="saveManualMoodboard()">Save &amp; Add to Queue</button>
    </div>
  </div>
</div>
<iframe id="portfolioSyncFrame" style="display:none" title="gallery sync (hidden)"></iframe>

function esc(s){ return (s||'').toString().replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toArray(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === 'object') return Object.keys(x).sort().map(function(k){ return x[k]; });
  return [];
}
function normalizeMoodboard(mb){
  mb.designs = toArray(mb.designs);
  mb.pins = toArray(mb.pins);
  if(mb.quote) mb.quote.items = toArray(mb.quote.items);
  return mb;
}
function fmtMoney(v){ return v ? ('₹' + Number(v).toLocaleString('en-IN')) : '—'; }

function unlock(){
  var input = document.getElementById('lockPinInput');
  var pin = input ? input.value : '';
  if(pin !== OFFICE_PIN){
    var err = document.getElementById('lockPinError');
    if(err) err.style.display = 'block';
    if(input){ input.value = ''; input.focus(); }
    return;
  }
  loadQueue();
}

function quoteLabelsFor(mb){
  var sectionSet = {};
  (mb.designs||[]).forEach(function(d){ sectionSet[d.section] = true; });
  var labels = Object.keys(sectionSet).map(function(s){ return s + ' Decor'; });
  if(!labels.length) labels.push('Wedding Decor Package');
  labels.push('Catering (optional — ask us)');
  labels.push('Photography & Videography (optional — ask us)');
  return labels;
}

function loadQueue(){
  db.ref('moodboards').once('value').then(function(snap){
    var val = snap.val() || {};
    var entries = Object.keys(val).map(function(id){ return normalizeMoodboard(Object.assign({ _id:id }, val[id])); });

    // Pending (budget submitted, quote not yet sent) first, then rest by date desc
    entries.sort(function(a,b){
      var aPending = a.budget && (!a.quote || a.quote.status !== 'sent');
      var bPending = b.budget && (!b.quote || b.quote.status !== 'sent');
      if(aPending !== bPending) return aPending ? -1 : 1;
      return new Date(b.createdAt||0) - new Date(a.createdAt||0);
    });

    var pendingCount = entries.filter(function(e){ return e.budget && (!e.quote || e.quote.status !== 'sent'); }).length;
    var sentCount = entries.filter(function(e){ return e.quote && e.quote.status === 'sent'; }).length;
    var noBudgetCount = entries.filter(function(e){ return !e.budget; }).length;

    var summaryHtml = '<div class="summary">' +
      '<div class="stat"><div class="num">'+pendingCount+'</div><div class="lbl">Awaiting Quote</div></div>' +
      '<div class="stat"><div class="num">'+sentCount+'</div><div class="lbl">Quote Sent</div></div>' +
      '<div class="stat"><div class="num">'+noBudgetCount+'</div><div class="lbl">No Budget Yet</div></div>' +
      '<div class="stat"><div class="num">'+entries.length+'</div><div class="lbl">Total Moodboards</div></div>' +
      '</div>';

    var searchHtml = '<div style="display:flex;gap:8px;align-items:flex-start;">' +
      '<input type="text" id="searchBox" class="search-box" style="flex:1;margin-bottom:0;" placeholder="Search by name or phone…" oninput="filterCards()">' +
      '<button type="button" class="btn-sm btn-edit" style="white-space:nowrap;padding:11px 14px;" onclick="openManualAddModal()">➕ Add Client</button>' +
      '</div><div style="height:16px"></div>';

    window.__allEntries = entries;

    if(!entries.length){
      document.getElementById('app').innerHTML = summaryHtml + searchHtml + '<div class="empty">No moodboards created yet.</div>';
      return;
    }

    document.getElementById('app').innerHTML = summaryHtml + searchHtml + '<div id="cardsWrap"></div>';
    try { renderCards(entries); }
    catch(renderErr){ console.error('Queue render error:', renderErr); document.getElementById('cardsWrap').innerHTML = '<div class="empty">Some entries hit a display issue — check the browser console for details.</div>'; }
  }).catch(function(err){
    console.error('Queue load error:', err);
    document.getElementById('app').innerHTML = '<div class="empty">Could not load moodboards — check your connection.</div>';
  });
}


function filterCards(){
  var q = (document.getElementById('searchBox').value || '').toLowerCase().trim();
  var all = window.__allEntries || [];
  var filtered = !q ? all : all.filter(function(mb){
    return (mb.clientName||'').toLowerCase().indexOf(q) !== -1 || (mb.phone||'').indexOf(q) !== -1;
  });
  renderCards(filtered);
}

function waLink(phone, message){
  var digits = (phone||'').replace(/\D/g,'');
  if(digits && digits.length === 10) digits = '91' + digits;
  return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(message);
}

// Standard cover photo attached alongside the moodboard/quote WhatsApp message
var SVV_COVER_URL = (function(){
  var o = window.location.origin;
  var p = window.location.pathname.replace(/[^\/]*$/, '');
  return o + p + 'svv-cover.jpg';
})();
function sendWithPhoto(id, btn){
  var mb = (window.__allEntries||[]).filter(function(e){ return e._id === id; })[0];
  if(!mb){ alert('Could not find this client — please refresh and try again.'); return; }
  var isSent = mb.quote && mb.quote.status === 'sent';
  var link = 'https://evppalace.github.io/alangaram/svv-moodboard.html?id=' + mb._id;
  var waMsg = isSent
    ? ('Hi ' + (mb.clientName||'there') + '! Your Alangaram Events quote is ready — total estimate ₹' + Number(mb.quote.total).toLocaleString('en-IN') + '. View full details here: ' + link)
    : ('Hi ' + (mb.clientName||'there') + '! Here\'s your Alangaram Events moodboard: ' + link);
  var origLabel = btn ? btn.textContent : '';
  if(btn){ btn.textContent = 'Preparing…'; btn.style.pointerEvents = 'none'; }
  fetch(SVV_COVER_URL).then(function(r){ return r.blob(); }).then(function(bl){
    var file = new File([bl], 'Alangaram-Events-SVV.jpg', { type: 'image/jpeg' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      return navigator.share({ files: [file], text: waMsg });
    }else{
      window.open(waLink(mb.phone, waMsg), '_blank');
    }
  }).catch(function(){
    window.open(waLink(mb.phone, waMsg), '_blank');
  }).then(function(){
    if(btn){ btn.textContent = origLabel; btn.style.pointerEvents = ''; }
  });
}

// ── Manual Add: for selections that arrived as a plain WhatsApp text ─────────
// (client used the "Send via WhatsApp" shortcut instead of "Create Shareable
// Moodboard") — paste that text here and it gets parsed into the same
// moodboards/{id} structure the portal itself would have written.
function generateShortId(){
  return Date.now().toString(36) + Math.random().toString(36).substring(2,7);
}

// ── Live gallery sync: builds a code -> image URL map by loading the actual
// portfolio page in a hidden iframe and reading its (Drive-synced) design
// codes once assigned — the same source of truth the client sees when
// browsing, so manually-entered codes get matched to real photos. ──────────
window.__codeImageMap = null;
window.__codeImageMapLoading = false;
window.__codeImageMapWaiters = [];
function ensureGalleryImageMap(statusEl, onReady){
  if(window.__codeImageMap){
    if(statusEl) statusEl.textContent = '🖼️ Gallery images ready (' + Object.keys(window.__codeImageMap).length + ' codes).';
    if(onReady) onReady();
    return;
  }
  if(onReady) window.__codeImageMapWaiters.push(onReady);
  if(window.__codeImageMapLoading){ return; }
  window.__codeImageMapLoading = true;
  if(statusEl) statusEl.textContent = '🔄 Matching codes to gallery photos… (can take up to 15s)';
  var frame = document.getElementById('portfolioSyncFrame');
  var attempts = 0;
  var maxAttempts = 40; // ~ up to 20s at 500ms
  function finish(map){
    window.__codeImageMap = map;
    window.__codeImageMapLoading = false;
    var waiters = window.__codeImageMapWaiters; window.__codeImageMapWaiters = [];
    waiters.forEach(function(fn){ fn(); });
  }
  function poll(){
    attempts++;
    var doc;
    try{ doc = frame.contentDocument || frame.contentWindow.document; }catch(e){ doc = null; }
    var nodes = doc ? doc.querySelectorAll('.gc[data-code]') : [];
    if(nodes.length){
      var map = {};
      nodes.forEach(function(el){
        var code = el.getAttribute('data-code');
        var img = el.querySelector('img');
        if(code && img && img.src) map[code] = img.src;
      });
      if(statusEl) statusEl.textContent = '🖼️ Gallery images ready (' + Object.keys(map).length + ' codes).';
      finish(map);
      previewManualParse();
      return;
    }
    if(attempts >= maxAttempts){
      if(statusEl) statusEl.textContent = '⚠️ Could not load gallery images in time — designs will save without photos (text still saves fine).';
      finish({}); // give up — save proceeds without images
      return;
    }
    setTimeout(poll, 500);
  }
  frame.onload = function(){ setTimeout(poll, 500); };
  frame.src = 'svv-portfolio.html';
}

function parsePastedSelections(text){
  var lines = (text||'').split('\n');
  var designs = [];
  var pins = [];
  var currentSection = 'Design';
  lines.forEach(function(raw){
    var line = raw.trim();
    if(!line) return;
    var stripped = line.replace(/^[-•]\s*/, '');
    if(/^https?:\/\//i.test(stripped)){ pins.push(stripped); return; }
    var codeMatch = line.match(/^[-•]?\s*([A-Za-z]{2,3}-\d+)\s*\(([^)]+)\)/);
    if(codeMatch){
      var code = codeMatch[1].toUpperCase();
      var img = (window.__codeImageMap && window.__codeImageMap[code]) || '';
      designs.push({ code: code, caption: codeMatch[2].trim(), section: currentSection, img: img });
      return;
    }
    if(/:$/.test(line) && line.length < 40 && !/^(please|contact|hi|hello|vanakkam)/i.test(line)){
      currentSection = line.replace(/:$/, '').trim();
    }
    // otherwise: greeting/closing lines etc — ignored
  });
  return { designs: designs, pins: pins };
}
function previewManualParse(){
  var text = (document.getElementById('maText')||{}).value || '';
  var box = document.getElementById('maPreview');
  if(!box) return;
  var parsed = parsePastedSelections(text);
  if(!parsed.designs.length && !parsed.pins.length){ box.style.display = 'none'; return; }
  var bySection = {};
  var matched = 0;
  parsed.designs.forEach(function(d){
    if(!bySection[d.section]) bySection[d.section] = [];
    if(d.img) matched++;
    bySection[d.section].push(d.code + ' — ' + d.caption + (d.img ? ' 🖼️' : ''));
  });
  var html = '<strong>' + parsed.designs.length + ' design(s) found' + (window.__codeImageMap ? ' (' + matched + ' matched to photos)' : '') + ':</strong>';
  Object.keys(bySection).forEach(function(sec){
    html += '<div class="pv-sec">' + esc(sec) + '</div>' + bySection[sec].map(esc).join('<br>');
  });
  if(parsed.pins.length) html += '<div class="pv-sec">Pinterest (' + parsed.pins.length + ')</div>';
  box.innerHTML = html;
  box.style.display = 'block';
}
function openManualAddModal(){
  document.getElementById('maName').value = '';
  document.getElementById('maPhone').value = '';
  document.getElementById('maText').value = '';
  document.getElementById('maPreview').style.display = 'none';
  document.getElementById('maError').style.display = 'none';
  document.getElementById('manualAddOverlay').classList.add('show');
  ensureGalleryImageMap(document.getElementById('maImgStatus'));
}
function closeManualAddModal(){
  document.getElementById('manualAddOverlay').classList.remove('show');
}
function fixMoodboardImages(id, btn){
  var mb = (window.__allEntries||[]).filter(function(e){ return e._id === id; })[0];
  if(!mb){ alert('Could not find this client — please refresh and try again.'); return; }
  var origLabel = btn ? btn.textContent : '';
  if(btn){ btn.textContent = 'Matching…'; btn.disabled = true; }
  ensureGalleryImageMap(null, function(){
    var map = window.__codeImageMap || {};
    var updated = (mb.designs||[]).map(function(d){
      if(!d.img && map[d.code]) return Object.assign({}, d, { img: map[d.code] });
      return d;
    });
    var fixedCount = updated.filter(function(d, i){ return d.img && !(mb.designs[i]||{}).img; }).length;
    db.ref('moodboards/' + id).update({ designs: updated, updatedAt: new Date().toISOString() }).then(function(){
      if(btn){ btn.textContent = origLabel; btn.disabled = false; }
      loadQueue();
      alert(fixedCount ? ('Matched ' + fixedCount + ' image(s) from the gallery.') : 'No matching photos found in the current gallery for the remaining codes — they may have shifted or been removed from Drive.');
    }).catch(function(){
      if(btn){ btn.textContent = origLabel; btn.disabled = false; }
      alert('Could not update — please check your connection and try again.');
    });
  });
}
function saveManualMoodboard(){
  var name = (document.getElementById('maName').value || '').trim();
  var phone = (document.getElementById('maPhone').value || '').replace(/\D/g, '');
  var text = document.getElementById('maText').value || '';
  var errBox = document.getElementById('maError');
  errBox.style.display = 'none';
  if(!name){ errBox.textContent = 'Please enter the client name.'; errBox.style.display = 'block'; return; }
  if(phone.length < 10){ errBox.textContent = 'Please enter a valid 10-digit phone number.'; errBox.style.display = 'block'; return; }
  var preParsed = parsePastedSelections(text);
  if(!preParsed.designs.length && !preParsed.pins.length){ errBox.textContent = 'No designs found in the pasted text — check it matches the "CODE (caption)" format, or add lines manually.'; errBox.style.display = 'block'; return; }

  var btn = document.getElementById('maSaveBtn');
  var origLabel = btn.textContent;
  btn.textContent = 'Matching photos…'; btn.disabled = true;

  // Make sure the gallery image map has finished loading (or given up) before
  // building the final designs list, so images aren't missed just because
  // save was clicked before the background sync finished.
  ensureGalleryImageMap(document.getElementById('maImgStatus'), function(){
    var parsed = parsePastedSelections(text); // re-parse now that __codeImageMap is settled
    btn.textContent = 'Saving…';
    var phone10 = phone.length > 10 ? phone.slice(-10) : phone;
    db.ref('svv_leads').orderByChild('phone').equalTo(phone10).once('value').then(function(snap){
      var leadId = '';
      snap.forEach(function(c){ leadId = c.key; });
      var id = generateShortId();
      var now = new Date().toISOString();
      var moodboard = {
        id: id, clientName: name, phone: phone10, leadId: leadId,
        designs: parsed.designs, pins: parsed.pins,
        preferredColors: '', dressColor: '',
        createdAt: now, updatedAt: now, source: 'manual-office-entry'
      };
      var link = 'https://evppalace.github.io/alangaram/svv-moodboard.html?id=' + id;
      db.ref('moodboards/' + id).set(moodboard).then(function(){
        if(leadId){
          db.ref('svv_leads/' + leadId).update({ moodboardId: id, moodboardLink: link, moodboardCreatedAt: now });
        }
        btn.textContent = origLabel; btn.disabled = false;
        var withImg = parsed.designs.filter(function(d){ return d.img; }).length;
        closeManualAddModal();
        loadQueue();
        alert('Saved! ' + name + ' now appears in the queue below' + (leadId ? ' and is linked to their existing lead.' : ' (no matching lead found by phone — moodboard was still saved).') + '\n' + withImg + ' of ' + parsed.designs.length + ' designs matched to gallery photos.');
      }).catch(function(){
        btn.textContent = origLabel; btn.disabled = false;
        errBox.textContent = 'Could not save — please check your connection and try again.';
        errBox.style.display = 'block';
      });
    }).catch(function(){
      btn.textContent = origLabel; btn.disabled = false;
      errBox.textContent = 'Could not save — please check your connection and try again.';
      errBox.style.display = 'block';
    });
  });
}

function editClientName(id, currentName, leadId){
  var newName = prompt('Correct client name:', currentName || '');
  if(newName === null) return; // cancelled
  newName = newName.trim();
  if(!newName){ alert('Name cannot be empty.'); return; }
  if(newName === currentName) return; // no change
  var updates = {};
  updates['moodboards/' + id + '/clientName'] = newName;
  if(leadId) updates['svv_leads/' + leadId + '/name'] = newName;
  db.ref().update(updates).then(function(){
    loadQueue();
  }).catch(function(err){
    alert('Could not save the name change — please check your connection and try again.');
    console.error('editClientName failed:', err);
  });
}

function deleteMoodboard(id, name){
  if(!confirm('Delete the moodboard for "' + name + '"?\n\nThis removes this shareable link permanently — it will stop working immediately. Their CRM lead record is not affected, only this moodboard/quote.'))return;
  db.ref('moodboards/' + id).remove().then(function(){
    loadQueue();
  }).catch(function(err){
    alert('Could not delete — please check your connection and try again.');
    console.error('deleteMoodboard failed:', err);
  });
}

function renderCards(entries){
  var wrap = document.getElementById('cardsWrap');
  if(!wrap) return;
  if(!entries.length){
    wrap.innerHTML = '<div class="empty">No matching clients.</div>';
    return;
  }

  var cardsHtml = entries.map(function(mb){
      var statusBadge, cardClass = 'card';
      var isPending = mb.budget && (!mb.quote || mb.quote.status !== 'sent');
      var isSent = mb.quote && mb.quote.status === 'sent';
      if(isSent) statusBadge = '<span class="badge sent">Quote Sent</span>';
      else if(isPending){ statusBadge = '<span class="badge pending">Awaiting Quote</span>'; cardClass += ' pending'; }
      else statusBadge = '<span class="badge nobudget">No Budget Yet</span>';

      var dateStr = mb.createdAt ? new Date(mb.createdAt).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '';
      var link = 'https://evppalace.github.io/alangaram/svv-moodboard.html?id=' + mb._id;

      var labels = quoteLabelsFor(mb);
      var existing = (mb.quote && mb.quote.items) || null;
      var existingByLabel = {};
      if(existing){ existing.forEach(function(it){ if(it && it.label) existingByLabel[it.label] = it.amount; }); }
      var editRows = labels.map(function(label, i){
        var amt = existingByLabel.hasOwnProperty(label) ? existingByLabel[label] : '';
        return '<div class="edit-row"><span>'+esc(label)+'</span><input type="number" id="qamt_'+mb._id+'_'+i+'" value="'+esc(amt||'')+'" placeholder="0"></div>';
      }).join('');

      var waMsg = isSent
        ? ('Hi ' + (mb.clientName||'there') + '! Your Alangaram Events quote is ready — total estimate ₹' + Number(mb.quote.total).toLocaleString('en-IN') + '. View full details here: ' + link)
        : ('Hi ' + (mb.clientName||'there') + '! Here\'s your Alangaram Events moodboard: ' + link);

      var sendBtn = '<button type="button" class="btn-sm btn-send" onclick="sendWithPhoto(\''+mb._id+'\',this)">'+(isSent ? '📱 Send Quote' : '📱 Send Moodboard')+' + Photo</button>';
      var copyBtn = '<button type="button" class="btn-sm btn-view" onclick="copyLink(\''+link+'\')">Copy Link</button>';
      var callBtn = mb.phone ? '<a class="btn-sm btn-view" href="tel:'+esc(mb.phone)+'">Call</a>' : '';
      var missingImgCount = (mb.designs||[]).filter(function(d){ return !d.img; }).length;
      var fixImgBtn = missingImgCount ? '<button type="button" class="btn-sm btn-view" onclick="fixMoodboardImages(\''+mb._id+'\',this)">🖼️ Fix Images ('+missingImgCount+')</button>' : '';

      return '<div class="'+cardClass+'">' +
        '<div class="card-top">' +
        '<div><div class="card-name">'+esc(mb.clientName||'Unnamed')+' <button type="button" class="btn-sm btn-view" style="padding:2px 8px;font-size:10px;vertical-align:middle;" onclick="editClientName(\''+mb._id+'\', '+JSON.stringify(mb.clientName||'').replace(/"/g,'&quot;')+', '+JSON.stringify(mb.leadId||'').replace(/"/g,'&quot;')+')">✏️ Edit Name</button></div><div class="card-meta">'+esc(mb.phone||'')+' &middot; '+dateStr+'</div></div>' +
        statusBadge +
        '</div>' +
        '<div class="card-budget">Budget: <strong>'+fmtMoney(mb.budget)+'</strong>'+(isSent ? ' &middot; Quote Total: <strong>'+fmtMoney(mb.quote.total)+'</strong>' : '')+'</div>' +
        '<div class="card-actions">' +
        '<a class="btn-sm btn-view" href="'+link+'" target="_blank">View Client Page</a>' +
        copyBtn + callBtn + sendBtn + fixImgBtn +
        '<button class="btn-sm btn-edit" onclick="toggleEdit(\''+mb._id+'\')">'+(isSent ? 'Edit Quote' : 'Fill Quote')+'</button>' +
        '<button class="btn-sm btn-danger" onclick="deleteMoodboard(\''+mb._id+'\', '+JSON.stringify(mb.clientName||'this entry').replace(/"/g,'&quot;')+')">🗑️ Delete</button>' +
        '</div>' +
        '<div class="edit-panel" id="panel_'+mb._id+'">' +
        editRows +
        '<button class="btn-sm btn-edit" style="margin-top:8px;" onclick="saveQuote(\''+mb._id+'\', '+JSON.stringify(labels).replace(/"/g,'&quot;')+')">Save Quote</button>' +
        '</div>' +
        '<div class="notes-wrap">' +
        '<label>Office Notes</label>' +
        '<textarea id="notes_'+mb._id+'" placeholder="Internal notes — follow-ups, preferences, calls made…">'+esc(mb.officeNotes||'')+'</textarea>' +
        '<button type="button" class="btn-sm btn-view" onclick="saveNotes(\''+mb._id+'\')">Save Note</button>' +
        '</div>' +
        '</div>';
  }).join('');

  wrap.innerHTML = cardsHtml;
}

function copyLink(link){
  navigator.clipboard.writeText(link).then(function(){
    alert('Link copied.');
  }).catch(function(){
    prompt('Copy this link:', link);
  });
}

function saveNotes(id){
  var el = document.getElementById('notes_' + id);
  var val = el ? el.value : '';
  db.ref('moodboards/' + id).update({ officeNotes: val }).then(function(){
    var entry = (window.__allEntries||[]).find(function(e){ return e._id === id; });
    if(entry) entry.officeNotes = val;
  }).catch(function(){
    alert('Could not save the note — please check your connection and try again.');
  });
}

function toggleEdit(id){
  var panel = document.getElementById('panel_' + id);
  if(panel) panel.classList.toggle('show');
}

function saveQuote(id, labels){
  var items = labels.map(function(label, i){
    var input = document.getElementById('qamt_' + id + '_' + i);
    var amount = input ? input.value.trim() : '';
    return { label: label, amount: amount };
  });
  var total = items.reduce(function(sum, it){ return sum + (parseFloat(it.amount) || 0); }, 0);
  var quote = { items: items, total: total, status: 'sent', filledAt: new Date().toISOString() };
  db.ref('moodboards/' + id).once('value').then(function(snap){
    var mb = snap.val() || {};
    return db.ref('moodboards/' + id).update({ quote: quote }).then(function(){
      if(mb.leadId){
        db.ref('svv_leads/' + mb.leadId).update({ quoteSent:true, quoteTotal: total, quoteSentAt: quote.filledAt });
      }
    });
  }).then(function(){
    alert('Quote saved — the client\'s existing link now shows it.');
    loadQueue();
  }).catch(function(){
    alert('Could not save the quote — please check your connection and try again.');
  });
}
</script>
