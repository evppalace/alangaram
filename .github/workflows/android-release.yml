name: Build OneByte Production Play Store bundle (AAB)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and add Android platform
        working-directory: production-android
        run: |
          npm install
          if [ -f google-services.json ]; then
            echo "google-services.json found - enabling closed-app push"
            npm install @capacitor/push-notifications@^8.0.0
          else
            echo "No google-services.json - building without Firebase push (in-app and local alerts only)"
          fi
          mkdir -p www
          cp ../onebyte-production.html www/index.html
          npx cap add android
      - name: Permissions, icon, background tracking
        working-directory: production-android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms='''
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
          '''
          if 'ACCESS_BACKGROUND_LOCATION' not in s:
              s=s.replace('</manifest>',perms+'</manifest>')
          open(p,'w').write(s)
          PY
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          res='android/app/src/main/res'
          shutil.rmtree(res+'/mipmap-anydpi-v26', ignore_errors=True)
          im=Image.open('resources/icon.png').convert('RGBA')
          for d,sz in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              r=im.resize((sz,sz), Image.LANCZOS)
              for n in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  r.save(f'{res}/mipmap-{d}/{n}')
          PY
          npx cap sync android
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
      - name: Version number and release signing
        working-directory: production-android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error title=Missing secrets::Add ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD in GitHub > Settings > Secrets (see STORE_RELEASE.md step 1)"; exit 1; fi
          echo "$KS_B64" | base64 -d > android/app/upload.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
          python3 - <<'PY'
          p='android/app/build.gradle'
          s=open(p).read()
          sign="""
              signingConfigs {
                  release {
                      storeFile file('upload.keystore')
                      storePassword System.getenv('KS_PASS')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASS')
                  }
              }
          """
          s=s.replace("buildTypes {", sign+"    buildTypes {",1)
          s=s.replace("release {\n            minifyEnabled","release {\n            signingConfig signingConfigs.release\n            minifyEnabled",1)
          open(p,'w').write(s)
          PY
          grep -n "signingConfig" android/app/build.gradle
      - name: Build signed AAB
        working-directory: production-android/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OneByte-Production-PlayStore-AAB
          path: production-android/android/app/build/outputs/bundle/release/app-release.aab
