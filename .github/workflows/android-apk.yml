name: Build OneByte Production APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'onebyte-production.html'
      - 'production-android/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install and add Android platform
        working-directory: production-android
        run: |
          npm install
          mkdir -p www
          cp ../onebyte-production.html www/index.html
          npx cap add android
      - name: Permissions, icon, background tracking
        working-directory: production-android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms='''
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          '''
          if 'ACCESS_BACKGROUND_LOCATION' not in s:
              s=s.replace('</manifest>',perms+'</manifest>')
          open(p,'w').write(s)
          PY
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          res='android/app/src/main/res'
          shutil.rmtree(res+'/mipmap-anydpi-v26', ignore_errors=True)
          im=Image.open('resources/icon.png').convert('RGBA')
          for d,sz in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              r=im.resize((sz,sz), Image.LANCZOS)
              for n in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  r.save(f'{res}/mipmap-{d}/{n}')
          PY
          npx cap sync android
      - name: Build debug APK
        working-directory: production-android/android
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "error:|FAILED|What went wrong|Could not|wrong|Unresolved|cannot find" -A3 build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failed::$msg"
          fi
          exit $rc
      - name: Rename APK
        run: cp production-android/android/app/build/outputs/apk/debug/app-debug.apk OneByte-Production.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OneByte-Production-APK
          path: OneByte-Production.apk
      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: production-apk-latest
          name: OneByte Production APK (latest)
          body: Latest Android build of OneByte Production. Download OneByte-Production.apk and install.
          files: OneByte-Production.apk
