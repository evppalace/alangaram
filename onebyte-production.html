<title>OneByte Production</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --brand:#015B36; --brand-dark:#014228; --gold:#F59E0B; --ink:#0F2A1B; --paper:#FAFAF7; --card:#FFFFFF;
    --green:#1B6B34; --green-dark:#0B3D20; --orange:#F4791E;
    --line:#E4E7E1; --muted:#7C8579; --red:#A23B2E; --amber:#B9822E; --amber-soft:#FBEFDD; --ok-soft:#E4F2E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI','Noto Sans',system-ui,sans-serif;}
  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;background:radial-gradient(circle at 50% 0%,#02764a 0,var(--brand) 45%,var(--brand-dark) 100%);color:#fff;}
  #lock .wide{width:min(320px,82vw);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.28);}
  #lock h1{font-size:20px;margin:6px 0 0;letter-spacing:.3px;} #lock p{color:#CFE8D8;font-size:13.5px;margin:0;text-align:center;}
  .ksbadge{background:#fff;border-radius:16px;padding:8px 18px;box-shadow:0 6px 20px rgba(0,0,0,.22);} .ksbadge img{display:block;width:150px;height:auto;}
  .ksfoot{text-align:center;margin:22px 0 4px;color:var(--muted);font-size:11.5px;} .ksfoot img{width:110px;display:block;margin:0 auto 4px;opacity:.95;}
  .internal{display:flex;gap:9px;align-items:flex-start;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;max-width:320px;font-size:12px;line-height:1.45;color:#EAF6EE;}
  .internal b{color:var(--gold);}
  #lock .btn{background:var(--gold);color:#1b1200;}
  #pinErr{color:#FFB4A8!important;}
  #pin,#uname{font-size:17px;text-align:center;padding:13px;width:240px;max-width:80vw;border:1.5px solid rgba(255,255,255,.3);border-radius:12px;outline:none;background:rgba(255,255,255,.95);}
  #pin:focus,#uname:focus{border-color:var(--gold);}
  .btn{background:var(--green);color:#fff;border:none;padding:13px 28px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;}
  .btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--line);}
  #pinErr{color:var(--red);font-size:13px;min-height:16px;}
  #app{display:none;max-width:680px;margin:0 auto;padding-bottom:84px;}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--brand);color:#fff;position:sticky;top:0;z-index:10;}
  header img{width:40px;height:40px;border-radius:10px;}
  header .t{display:flex;flex-direction:column;line-height:1.2;} header .t b{font-size:16px;} header .t span{font-size:12px;color:#CFE8D8;}
  header .out{margin-left:auto;background:rgba(255,255,255,.14);border:none;color:#fff;font-size:12.5px;cursor:pointer;padding:7px 12px;border-radius:99px;}
  .strip{background:var(--amber-soft);color:#7A5516;font-size:11.5px;text-align:center;padding:5px 10px;border-bottom:1px solid #EBD6AE;}
  .hero{border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--brand);}
  .hero svg{display:block;width:100%;height:auto;}
  .hero .cap{padding:8px 12px 10px;color:#CFE8D8;font-size:12px;display:flex;justify-content:space-between;gap:8px;}
  .steam{animation:rise 2.6s ease-in infinite;} .steam.b{animation-delay:1.1s;}
  @keyframes rise{0%{transform:translateY(5px);opacity:0}30%{opacity:.95}100%{transform:translateY(-13px);opacity:0}}
  .truck{animation:drive 9s ease-in-out infinite;}
  @keyframes drive{0%{transform:translateX(0);opacity:0}8%{opacity:1}82%{transform:translateX(150px);opacity:1}100%{transform:translateX(150px);opacity:0}}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .road{stroke-dasharray:8 8;animation:dash 1s linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-16}}
  @media (prefers-reduced-motion:reduce){.steam,.truck,.wheel,.road{animation:none!important}.truck{opacity:1;transform:translateX(70px)}}
  .flow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;}
  .stg{flex:0 0 auto;text-align:center;font-size:11px;padding:8px 9px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);background:#fff;min-width:66px;}
  .stg i{display:block;font-style:normal;font-size:19px;margin-bottom:2px;filter:grayscale(1);opacity:.6;}
  .stg.live{border:1.5px solid var(--green);color:var(--green);background:var(--ok-soft);font-weight:700;} .stg.live i{filter:none;opacity:1;}
  .notice{border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;}
  .notice.alert{background:#FBE6E3;border:1px solid #EBB9B2;} .notice.note{background:var(--amber-soft);border:1px solid #EBD6AE;} .notice.info{background:var(--ok-soft);border:1px solid #BFDCC8;}
  .notice .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;} .kpi .card{margin:0;} .kpi .n{font-size:26px;font-weight:800;line-height:1.1;}
  .page{display:none;padding:14px 18px;} .page.active{display:block;}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom);}
  nav button{flex:1;border:none;background:none;padding:9px 2px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  nav button .i{font-size:19px;} nav button.active{color:var(--green);font-weight:700;}
  h2{font-size:15px;margin:18px 0 8px;} h2:first-child{margin-top:0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;}
  .row{display:flex;align-items:center;gap:10px;} .grow{flex:1;min-width:0;}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .qty{font-weight:800;font-size:17px;text-align:right;white-space:nowrap;} .qty small{font-weight:600;color:var(--muted);font-size:11px;}
  .low{background:var(--amber-soft);border-color:#E9CFA0;} .low .qty{color:var(--amber);}
  .neg .qty{color:var(--red);}
  label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--green);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .save{width:100%;margin-top:14px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
  .chip{padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;cursor:pointer;}
  .chip.active{background:var(--green);border-color:var(--green);color:#fff;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 8px;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--ok-soft);color:var(--green);margin-left:6px;vertical-align:middle;}
  .actions{display:flex;gap:8px;margin-top:10px;} .actions button{flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;}
  .toast.show{opacity:1;}
  .soon{background:#fff;border:1.5px dashed var(--line);border-radius:13px;padding:16px;color:var(--muted);font-size:13px;margin-bottom:10px;}
  @media print{ header,nav,.toast,#r_out~*,.card:has(#r_type),.two,.sub{display:none!important} .page{display:none!important} #p-reports{display:block!important} #p-reports .two,#p-reports>.card:first-child{display:none!important} }
</style>

<style id="v2">
#alarmBox{position:fixed;inset:0;z-index:99998;background:rgba(120,10,10,.72);display:none;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
#alarmBox.show{display:flex;animation:abFlash 1s infinite}
@keyframes abFlash{0%,100%{background:rgba(120,10,10,.72)}50%{background:rgba(200,40,20,.82)}}
#alarmBox .ab-card{background:#fff;color:#1a1a1a;border-radius:20px;padding:18px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#alarmBox .ab-ic{font-size:44px;text-align:center;animation:abShake .5s infinite}
@keyframes abShake{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
#alarmBox h3{margin:4px 0 10px;text-align:center;color:#b3261e}
#alarmBox .ab-row{padding:8px 0;border-top:1px solid #eee;font-size:14px}

/* ===== v2 modern theme ===== */
:root{
  --brand:#04704a; --brand-dark:#023a27; --accent:#ff8a1f; --accent2:#ffb703; --teal:#0aa88f; --violet:#6c5ce7;
  --paper:#EEF4F0; --card:#fff; --ink:#0d2a1d; --muted:#6b7b72; --line:rgba(13,42,29,.09);
  --shadow:0 8px 24px rgba(4,60,40,.08); --shadow2:0 14px 34px rgba(4,60,40,.16);
  --g1:linear-gradient(135deg,#04b27a 0%,#04704a 60%,#033f2c 100%); --g2:linear-gradient(135deg,#ffb703,#ff7a1a);
  --green:#04915f; --ok-soft:#DDF4E9; --amber-soft:#FFF1D6; --red:#d6453a;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#08140f; --card:#12241b; --ink:#e8f5ee; --muted:#8fa89a; --line:rgba(255,255,255,.09); --shadow:0 8px 24px rgba(0,0,0,.4); --shadow2:0 14px 34px rgba(0,0,0,.55); --ok-soft:#12372a; --amber-soft:#3a2d10; --red:#ff7b6e;}
  input,select,textarea{background:#0c1a13!important;color:var(--ink)!important;border-color:var(--line)!important}
  .btn.sec,.btn.danger,.chip,.stg,.actions button{background:var(--card)!important;color:var(--ink)!important}
  .btn.danger{color:var(--red)!important}
  nav,.sheet{background:rgba(18,36,27,.92)!important}
  .notice.alert{background:#3d1b17!important;border-color:#6b2c25!important}.notice.note{background:#3a2d10!important;border-color:#6b5420!important}.notice.info{background:#12372a!important;border-color:#1f5a43!important}
  .strip{background:#2a210c!important;color:#e9c46a!important;border-color:#4a3a14!important}
  #tt{background:#12241b!important;color:var(--ink)!important}
}
html,body{font-family:'Plus Jakarta Sans','Segoe UI','Noto Sans',system-ui,sans-serif;background:var(--paper);background-image:radial-gradient(1000px 420px at 85% -80px,rgba(4,178,122,.16),transparent),radial-gradient(800px 380px at -10% 20%,rgba(255,138,31,.10),transparent);background-attachment:fixed;color:var(--ink)}
#app{padding-bottom:104px}
/* login */
#lock{position:relative;overflow:hidden;background:var(--g1)}
#lock:before,#lock:after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 12s ease-in-out infinite}
#lock:before{width:320px;height:320px;background:#ffb703;top:-90px;right:-80px}
#lock:after{width:380px;height:380px;background:#0aa88f;bottom:-140px;left:-110px;animation-delay:-6s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,30px)}}
#lock>*{position:relative;z-index:1}
#lock .wide{box-shadow:0 18px 44px rgba(0,0,0,.35);animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.ksbadge{animation:pop .8s .1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
#pin,#uname{border:none!important;box-shadow:0 8px 22px rgba(0,0,0,.2);border-radius:16px!important;background:rgba(255,255,255,.96)!important;color:#0d2a1d!important}
#lock .btn{background:var(--g2);color:#2b1400;box-shadow:0 10px 24px rgba(255,122,26,.45);min-width:240px;border-radius:16px;font-size:16px}
.internal{backdrop-filter:blur(8px);background:rgba(255,255,255,.12)}
/* header */
header{background:var(--g1);padding:14px 16px 16px;border-radius:0 0 26px 26px;box-shadow:var(--shadow2);gap:12px}
header img{box-shadow:0 4px 12px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.35)}
header .t b{font-size:17px;letter-spacing:.2px}
header .out,#bell{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:99px;font-size:12.5px;padding:8px 13px;cursor:pointer}
#bell{position:relative;margin-left:auto;font-size:16px;padding:7px 11px}
#bell .bd{position:absolute;top:-4px;right:-4px;background:var(--accent);color:#2b1400;font-size:10px;font-weight:800;border-radius:99px;min-width:17px;height:17px;display:none;align-items:center;justify-content:center;padding:0 4px}
#bell.has .bd{display:flex}
#bell.has{animation:ring 2.4s ease-in-out infinite}
@keyframes ring{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(14deg)}94%{transform:rotate(-12deg)}97%{transform:rotate(8deg)}}
header .out{margin-left:0}
.strip{background:transparent;border:none;color:var(--muted);font-size:11px;padding:8px 10px 0}
/* pages */
.page{padding:16px 16px 6px}
.page.active{display:block;animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:15px;font-weight:800;margin:22px 2px 10px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
h2:after{content:"";flex:1;height:1px;background:var(--line)}
.card{border:none;border-radius:20px;box-shadow:var(--shadow);padding:15px 16px;transition:transform .15s ease,box-shadow .15s ease}
.card[data-trip]:active,.card[data-open]:active{transform:scale(.985)}
.card.low{background:linear-gradient(135deg,var(--amber-soft),var(--card));border-left:5px solid var(--accent2)}
.card.neg{border-left:5px solid var(--red)}
.hero{border-radius:24px;box-shadow:var(--shadow2);background:var(--g1)}
.btn{background:var(--g1);box-shadow:0 8px 18px rgba(4,112,74,.32);border-radius:14px;padding:13px 24px;transition:transform .12s,box-shadow .12s;letter-spacing:.2px}
.btn:active{transform:scale(.97);box-shadow:0 3px 8px rgba(4,112,74,.3)}
.btn.sec{background:var(--card);box-shadow:var(--shadow);border:none;color:var(--ink)}
.btn.danger{background:var(--card);box-shadow:var(--shadow);border:none;color:var(--red)}
.btn.gold{background:var(--g2);color:#2b1400;box-shadow:0 8px 18px rgba(255,122,26,.35)}
input,select,textarea{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.8);transition:box-shadow .15s,border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px rgba(4,145,95,.16)}
label{font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.2px}
.chips{gap:8px}
.chip{border:none;background:var(--card);box-shadow:var(--shadow);padding:8px 15px;border-radius:99px;font-weight:700;transition:transform .12s}
.chip.active{background:var(--g1);color:#fff;box-shadow:0 8px 16px rgba(4,112,74,.3)}
.chip:active{transform:scale(.95)}
.tag{background:var(--ok-soft);color:var(--green);padding:3px 9px;font-weight:800}
.actions button{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:10px}
.notice{border-radius:16px;box-shadow:var(--shadow);border:none!important;backdrop-filter:blur(4px)}
.notice.alert{background:linear-gradient(135deg,#FFE3DF,#FFF3F1)}.notice.note{background:linear-gradient(135deg,#FFEFCF,#FFF8E8)}.notice.info{background:linear-gradient(135deg,#D8F4E6,#F0FBF5)}
.empty{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:28px 12px}
.stg{border:none;box-shadow:var(--shadow);border-radius:16px;min-width:76px;padding:11px 8px}
.stg.live{background:linear-gradient(160deg,var(--ok-soft),var(--card));color:var(--green)}
.stg i{font-size:22px}
/* KPI */
.kpi{gap:12px}
.kpi .card{position:relative;overflow:hidden;color:#fff;padding:16px}
.kpi .card:nth-child(1){background:linear-gradient(135deg,#ffb703,#ff7a1a)}
.kpi .card:nth-child(2){background:linear-gradient(135deg,#ff6b6b,#d6453a)}
.kpi .card:nth-child(3){background:linear-gradient(135deg,#04b27a,#04704a)}
.kpi .card:nth-child(4){background:linear-gradient(135deg,#6c5ce7,#4834d4)}
.kpi .card:after{content:"";position:absolute;right:-26px;bottom:-26px;width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.18)}
.kpi .card .sub{color:rgba(255,255,255,.88)!important}.kpi .card .n{color:#fff!important;font-size:30px;font-weight:800}
/* greeting + quick actions */
.greet{background:var(--g1);color:#fff;border-radius:24px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.greet:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.greet small{opacity:.85;font-size:12px}.greet b{display:block;font-size:21px;margin:2px 0 4px}.greet .pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}
.greet .pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 6px}
.qa button{border:none;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:13px 4px 10px;font-size:11.5px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
.qa button:active{transform:scale(.93)}
.qa button i{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff}
.qa button:nth-child(4n+1) i{background:linear-gradient(135deg,#04b27a,#04704a)}.qa button:nth-child(4n+2) i{background:linear-gradient(135deg,#ffb703,#ff7a1a)}.qa button:nth-child(4n+3) i{background:linear-gradient(135deg,#6c5ce7,#4834d4)}.qa button:nth-child(4n+4) i{background:linear-gradient(135deg,#0aa8c9,#0476a3)}
/* floating nav */
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:660px;margin:0 auto;border:none;border-radius:26px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);box-shadow:0 12px 34px rgba(4,60,40,.28);padding:6px;gap:2px}
nav button{border-radius:20px;padding:8px 2px;font-weight:600;transition:all .2s}
nav button .i{font-size:20px;transition:transform .2s}
nav button.active{background:var(--g1);color:#fff;box-shadow:0 8px 16px rgba(4,112,74,.35)}
nav button.active .i{transform:translateY(-1px) scale(1.12)}
.toast{background:var(--g1);box-shadow:var(--shadow2);bottom:112px;font-weight:700}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.9,.3,1);max-width:680px;margin:0 auto;box-shadow:0 -14px 40px rgba(0,0,0,.3)}
.sheet.show{transform:none}.sheetbg.show{display:block}
.sheet .grab{width:44px;height:5px;background:var(--line);border-radius:9px;margin:-6px auto 12px}
.sheet h3{margin:4px 2px 12px;font-size:17px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sgrid button{border:none;background:var(--ok-soft);border-radius:18px;padding:14px 4px;font-weight:700;font-size:12px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.sgrid button .i{font-size:24px}
/* unit switch */
.uw{display:inline-flex;vertical-align:middle;margin-left:6px;background:var(--ok-soft);border-radius:99px;padding:2px;gap:2px}
.uw b{font-size:11.5px;padding:4px 9px;border-radius:99px;cursor:pointer;color:var(--muted);font-weight:800;user-select:none}
.uw b.on{background:var(--g1);color:#fff}
.uhint{font-size:11px;color:var(--green);font-weight:700;margin:3px 2px 0}
/* aggregator / client */
.stars{display:flex;gap:4px}.stars button{border:none;background:none;font-size:27px;line-height:1;cursor:pointer;color:#cfd8d2;padding:2px;transition:transform .12s}
.stars button.on{color:#ffb703;text-shadow:0 2px 8px rgba(255,183,3,.45)}.stars button:active{transform:scale(1.25)}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}.rrow:last-child{border:none}
.rrow span{font-size:13.5px;font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--green)}
.badge.amber{background:var(--amber-soft);color:#a8680a}.badge.red{background:#ffe0dc;color:#c0392b}.badge.blue{background:#e1e9ff;color:#3b4fc4}.badge.grey{background:#eceff1;color:#607d8b}
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 6px}
.score div{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px 6px;text-align:center}
.score b{display:block;font-size:22px;font-weight:800}.score small{font-size:11px;color:var(--muted);font-weight:700}
.tl{border-left:3px solid var(--ok-soft);margin:8px 0 0 6px;padding-left:12px;font-size:12px;color:var(--muted)}.tl div{margin:4px 0}
.progress{height:10px;border-radius:99px;background:var(--ok-soft);overflow:hidden;margin:8px 0 2px}.progress i{display:block;height:100%;background:var(--g1);border-radius:99px;transition:width .6s}
.sos{background:linear-gradient(135deg,#ff6b6b,#d6453a);color:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 24px rgba(214,69,58,.35);text-decoration:none;margin-bottom:10px}
.sos i{font-style:normal;font-size:26px}.sos b{font-size:15px}.sos span{font-size:12px;opacity:.9;display:block}
.callrow{display:flex;gap:8px;margin-top:8px}.callrow a{flex:1;text-align:center;text-decoration:none;font-weight:800;font-size:13px;padding:10px;border-radius:13px;background:var(--ok-soft);color:var(--green)}
.callrow a.wa{background:#dcf8c6;color:#0b6b2e}
.feed{display:flex;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}.feed:last-child{border:none}
.feed i{font-style:normal;font-size:20px;width:38px;height:38px;border-radius:13px;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;flex:none}
.feed.red i{background:#ffe0dc}.feed.amber i{background:var(--amber-soft)}
.feed b{font-size:13.5px}.feed .sub{margin-top:1px}
.mini{width:100%;height:auto;display:block}


/* native (Android app): keep clear of status bar & gesture bar */
html.native header{padding-top:calc(12px + max(env(safe-area-inset-top,0px), var(--safe-area-inset-top,0px), 30px))}
html.native nav{bottom:calc(8px + max(env(safe-area-inset-bottom,0px), var(--safe-area-inset-bottom,0px), 10px))}
html.native #lock{padding-top:calc(24px + max(env(safe-area-inset-top,0px), var(--safe-area-inset-top,0px), 30px));padding-bottom:calc(24px + max(env(safe-area-inset-bottom,0px), var(--safe-area-inset-bottom,0px), 10px))}
html.native #app{padding-bottom:calc(112px + max(env(safe-area-inset-bottom,0px), var(--safe-area-inset-bottom,0px), 10px))}
html.native .toast{bottom:calc(120px + max(env(safe-area-inset-bottom,0px), var(--safe-area-inset-bottom,0px), 10px))}

.kslogo-bg{background:var(--kslogo) center/contain no-repeat;width:min(250px,66vw);aspect-ratio:700/559;filter:drop-shadow(0 8px 16px rgba(0,0,0,.3))}
.ksseal{display:flex;justify-content:center;margin:20px auto 10px;background:var(--g1);border-radius:24px;padding:14px 16px;width:min(220px,62%);box-shadow:var(--shadow2)}
.ksseal .kslogo-bg{width:100%;filter:none}
#lock>.lockscene{position:absolute;left:0;right:0;bottom:0;height:46vh;z-index:0;pointer-events:none;opacity:.95;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 38%);mask-image:linear-gradient(180deg,transparent 0,#000 38%)}
.lockscene svg{width:100%;height:100%;display:block}
#lock:before{opacity:.35}
.hero.scene{background:#021f16;padding:0}.hero.scene svg{display:block;width:100%;height:auto}
.greet .art{position:absolute;right:0;bottom:0;width:78%;height:100%;opacity:.5;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%)}
.greet .art svg{width:100%;height:100%;display:block}
.greet .crest{position:absolute;right:16px;top:14px;width:70px;height:54px;background:var(--kscrest) center/contain no-repeat;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
.greet>*:not(.art):not(.crest){position:relative;z-index:1}
.van{animation:vanGo 13s linear infinite}
@keyframes vanGo{0%{transform:translateX(-6px);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translateX(404px);opacity:0}}
.tw{animation:tw 2.8s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.van,.tw{animation:none!important}.van{transform:translateX(160px)}}
/* ===== v3: login tabs, photos, chatbot ===== */
.lgtabs{display:flex;gap:6px;background:rgba(255,255,255,.14);padding:4px;border-radius:16px;margin:2px 0 10px;width:100%;max-width:360px}
.lgtabs button{flex:1;border:0;background:transparent;color:#fff;font-weight:800;font-size:13px;padding:10px 6px;border-radius:12px;font-family:inherit}
.lgtabs{position:relative;z-index:2}#lgHint{color:rgba(255,255,255,.92)!important;font-size:12.5px;padding:0 24px;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.lgtabs button.on{background:#fff;color:#04704a;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.phbox{margin:8px 0}
.phbox .phrow{display:flex;gap:6px;flex-wrap:wrap}
.phbox .phrow:empty{display:none}
.phth{width:62px;height:62px;object-fit:cover;border-radius:12px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}
.phadd{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:8px 13px;border-radius:99px;background:var(--ok-soft);color:var(--brand);font-weight:800;font-size:12.5px;cursor:pointer}
.phbox.ro{margin:6px 0}.phbox.ro.empty{display:none}
.phbox .phrow+.phadd{margin-top:6px}
.phtag{cursor:pointer}
#phView{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:100000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px}
#phView.show{display:flex}
#phView img{max-width:100%;max-height:70vh;border-radius:12px}
.phv-top{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-weight:800}
.phv-top button,.phv-act button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:99px;padding:10px 16px;font-size:16px;font-weight:800;font-family:inherit}
.phv-bot{color:#fff;margin-top:12px;text-align:center;font-size:13px}.phv-act{display:flex;gap:10px;justify-content:center;margin-top:10px}.phv-act .del{background:#d6453a}
#botFab{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;border:0;background:var(--g2);color:#2b1400;font-size:25px;box-shadow:0 10px 24px rgba(255,122,26,.45);z-index:60;display:none;align-items:center;justify-content:center}
#botFab.hide{display:none!important}
#bot{position:fixed;left:0;right:0;bottom:0;height:84vh;max-height:700px;background:var(--paper);border-radius:24px 24px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.35);z-index:200;display:none;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#bot.show{display:flex}
.bot-h{background:var(--g1);color:#fff;border-radius:24px 24px 0 0;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.bot-h b{display:block;font-size:16px}.bot-h small{opacity:.85;font-size:12px}
.bot-h button{background:rgba(255,255,255,.2);border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:15px}
.bot-m{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bm{max-width:86%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.4;word-wrap:break-word}
.bm.bot{background:#fff;align-self:flex-start;border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.bm.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.bm a{color:var(--brand);font-weight:800}.bm.me a{color:#fff}
.bm .rrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.bm .callrow{margin-top:6px}
.bot-c{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.bot-c button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-size:12.5px;font-weight:800;color:var(--brand);font-family:inherit}
.bot-c button.x{color:var(--red)}
.bot-i{display:flex;gap:8px;padding:8px 12px 12px}
.bot-i input{flex:1;margin:0;border-radius:99px}
.bot-i button{width:46px;border:0;border-radius:50%;background:var(--g1);color:#fff;font-size:17px}
/* ===== v4: stock groups, dishes, journey ===== */
.seg{display:flex;gap:6px;background:#fff;padding:5px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:14px;padding:10px 4px;font-weight:800;font-size:13px;color:var(--muted);font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-size:10.5px;opacity:.8}
.seg button.on{background:var(--g1);color:#fff;box-shadow:0 6px 14px rgba(4,112,74,.3)}
.card .ico{border:0;background:var(--ok-soft);width:38px;height:38px;border-radius:50%;font-size:15px;flex:none}
.jcard{overflow:hidden}
.jstrip{position:relative;height:84px;margin:12px 4px 4px}
.jroad{position:absolute;left:0;right:0;top:34px;height:12px;border-radius:99px;background:repeating-linear-gradient(90deg,#33443b 0 14px,#2a3a32 14px 28px);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.jroad i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#04b27a,#ffb703);border-radius:99px;transition:width 1.2s cubic-bezier(.3,.8,.3,1);animation:jgrow 1.4s cubic-bezier(.3,.8,.3,1)}
.jstrip.moving .jroad{background-size:28px 100%;animation:jdash .6s linear infinite}
.jst{position:absolute;top:58px;transform:translateX(-50%);text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;width:60px;margin-left:0}
.jst:first-of-type{transform:none}
.jst b{display:flex;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--line);align-items:center;justify-content:center;font-size:13px;margin:-30px auto 3px;position:relative;z-index:1}
.jst.on b{border-color:var(--green);background:var(--ok-soft)}
.jst small{display:block;font-size:10.5px}
.jvan{position:absolute;top:0;left:var(--p);transform:translateX(-50%);z-index:3;animation:jvin 1.4s cubic-bezier(.3,.8,.3,1);transition:left 1.2s cubic-bezier(.3,.8,.3,1)}
.jvan .vbody{position:relative;width:64px;height:35px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.jstrip.moving .jvan .vbody{animation:jbump .45s ease-in-out infinite}
.vlogo{position:absolute;left:5px;top:8px;width:30px;height:20px;background:var(--kscrest) center/contain no-repeat}
.jw{transform-box:fill-box;transform-origin:center}
.jstrip.moving .jw{animation:jspin .5s linear infinite}
.jtl{margin-top:14px;position:relative;padding-left:2px}
.jtl:before{content:"";position:absolute;left:15px;top:6px;bottom:10px;width:3px;border-radius:3px;background:var(--line)}
.jrow{position:relative;display:flex;gap:12px;padding:0 0 14px;animation:jrin .5s both;animation-delay:calc(var(--i)*70ms)}
.jdot{flex:none;width:30px;height:30px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--muted);z-index:1}
.jrow.done .jdot{background:var(--green);border-color:var(--green);color:#fff;animation:jpop .5s both;animation-delay:calc(var(--i)*70ms + 150ms)}
.jrow.bad .jdot{background:var(--red);border-color:var(--red);color:#fff}
.jrow.now .jdot{border-color:var(--accent);background:#fff3df;animation:jpulse 1.6s infinite}
.jrow.todo{opacity:.55}
.jbody{flex:1;min-width:0}.jl{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}.jl span{font-weight:800;color:var(--brand);white-space:nowrap}
.jbad{color:var(--red)!important;font-weight:700}
@keyframes jdash{to{background-position:28px 0}}
@keyframes jbump{50%{transform:translateY(-2px)}}
@keyframes jspin{to{transform:rotate(360deg)}}
@keyframes jgrow{from{width:0}}
@keyframes jvin{from{left:0}}
@keyframes jrin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes jpop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes jpulse{0%{box-shadow:0 0 0 0 rgba(255,138,31,.55)}70%{box-shadow:0 0 0 12px rgba(255,138,31,0)}100%{box-shadow:0 0 0 0 rgba(255,138,31,0)}}
@media (prefers-reduced-motion:reduce){.jroad,.jvan .vbody,.jw,.jrow,.jdot,.jvan,.jroad i{animation:none!important}}
</style>

  if (!me || !ROLES[me.role]) return false;

}

  const t = ROLES[me.role].tabs.filter(x=>can(x));

  const uname = ($('uname').value||'').trim().toLowerCase(), entered = $('pin').value.trim();
  authReady.then(()=>db.ref(P+'users').once('value')).then(snap=>{
    const u = snap.val() || {};
    let m = null;
    Object.entries(u).forEach(([id,x])=>{
      if (!ROLES[x.role]) return;
      const pw = x.password || x.pin;
      if (pw===entered && ((x.username||'').toLowerCase()===uname || !x.username) && ((loginMode==='client') === (x.role==='aggregator'))) m = Object.assign({id},x);
    });
    if (!m && loginMode==='staff' && Object.keys(u).length===0 && entered===SETUP_PIN && (!uname || uname==='admin')) m = { id:'setup', name:'Setup Admin', role:'admin', siteId:'all' };
    if (m){ me = m; try{ store.setItem('prod_user', JSON.stringify(m)); }catch(e){} enter(); }

  const r = ROLES[me.role], tabs = tabsFor();

  $('nav').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>go(b.dataset.t));

function go(t){

/* ============ LIVE DATA ============ */
function listen(){ authReady.then(listenNow); }
function listenNow(){
  const bind = (path, assign) => db.ref(P+path).on('value', s=>{ assign(s.val()||{}); renderAll(); });
  bind('users',  v=>{ users=v;
    if (me && me.id!=='setup' && users[me.id]){
      const u = users[me.id];
      me = Object.assign({id:me.id}, u);
      try{ store.setItem('prod_user', JSON.stringify(me)); }catch(e){}
      if (tabsFor().join(',')!==navKey){ const a=document.querySelector('.page.active'); buildNav(a && a.id.slice(2)); }
    }
  });
  bind('sites',  v=>sites=v);
  bind('items',  v=>items=v);
  bind('basins', v=>basins=v);
  bind('notices', v=>notices=v);
  bind('settings', v=>settings=v);
  bind('recipes', v=>recipes=v);
  bind('ratings', v=>ratings=v);

}

  const usedList = Object.entries(used).filter(([id,v])=>v>0 && items[id]);
  const nts = Object.entries(notices).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)).slice(0,5);

/* ============ STOCK ============ */
function usedOn(itemId, date){
  let t = 0; Object.values(ledger).forEach(e=>{ if (e.itemId===itemId && e.date===date && e.type==='issue' && !e.reversed) t += -(e.qty||0); });
  return t;
}
function recentLedger(n){
  const e = Object.entries(ledger).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)).slice(0,n||15);
  if (!e.length) return '<div class="empty">No movements yet.</div>';
  return e.map(([,x])=>{

/* ============ MEAL SESSIONS (production → dispatch → arrival → counter → sales/waste) ============ */
const REASONS = ['Unsold leftover','Spoilage','Spill / damage','Quality reject','Over-production','Other'];
const STEP_ROLES = {
  prod:['admin','prodmanager','kitchen','cook'], plan:['admin','prodmanager'], cookstart:['admin','prodmanager','kitchen','cook'], qc1:['admin','prodmanager'],
  dispatch:['admin','prodmanager','kitchen','cook'], depart:['admin','prodmanager','kitchen','driver'],
  arrive:['admin','prodmanager','driver','supervisor','counter'],
  qc2:['admin','prodmanager','supervisor','counter'], weigh:['admin','prodmanager','supervisor','counter'],
  close:['admin','prodmanager','supervisor','counter'], send:['admin','prodmanager','kitchen','cook','driver','supervisor','counter']
};
const canStep = k => me && STEP_ROLES[k].includes(me.role);
let mDate = todayKey(), openSid = null, tracker = null;

const sidOf = (d,site,meal) => d+'_'+site+'_'+meal;
const hm = ts => ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—';
function dur(a,b){ if(!a||!b) return '—'; const m = Math.round((b-a)/60000); return m>=60 ? Math.floor(m/60)+'h '+(m%60)+'m' : m+' min'; }
function visibleSites(){
  const all = Object.entries(sites);
  const r = ROLES[me.role];
  return r && (r.site || (r.siteOpt && me.siteId && me.siteId!=='all')) ? all.filter(([k])=>k===me.siteId) : all;
}
const T = (s,k) => s && s.times && s.times[k];
const MEAL_STAGES = [['prodDone','Cooked'],['qc1','QC'],['packed','Packed'],['loaded','Loaded'],['departed','Departed'],['arrived','Arrived'],['qc2','Arrival QC'],['counterLoaded','At counter'],['closed','Closed']];
function stageOf(s){
  if (!s) return { n:0, label:'Not started' };
  let n = 0, label = 'Not started';
  MEAL_STAGES.forEach(([k,l],i)=>{ const v = k==='qc1' ? (s.qc1&&s.qc1.ts) : k==='qc2' ? (s.qc2&&s.qc2.ts) : T(s,k); if (v){ n=i+1; label=l; } });
  if (!n){ if (T(s,'cookStart')) label = 'Cooking'; else if (T(s,'planned')) label = 'Plan sent to kitchen'; }
  return { n, label };
}
function sessionCalc(s){
  const tol = (settings.tolerance||3);
  const out = {}; const ids = new Set();
  Object.keys((s&&s.items)||{}).forEach(k=>ids.add(k));
  Object.keys((s&&s.weights)||{}).forEach(k=>ids.add(k));
  Object.keys((s&&s.close)||{}).forEach(k=>ids.add(k));
  ids.forEach(id=>{
    const it = (s.items||{})[id]||{}, c = (s.close||{})[id]||{};
    const di = items[id]; const dn = di && di.unit==='L' && di.density>0 ? di.density : 1;
    const loaded = Object.values((s.weights||{})[id]||{}).reduce((a,w)=>a+(w.net||0),0) / dn;
    const prepared = it.prepared||0, sold = c.sold||0, left = c.leftover||0, waste = c.waste||0;
    const hasClose = (s.close||{})[id]!=null;
    const variance = hasClose ? loaded - sold - left - waste : null;
    const pct = hasClose && loaded>0 ? variance/loaded*100 : null;
    out[id] = { prepared, loaded, sold, left, waste, reason:c.reason||'', soldPlates:c.soldPlates||null, variance, pct, flag: pct!=null && Math.abs(pct)>tol, transit: prepared>0 && loaded>0 ? prepared-loaded : null };
  });
  return out;
}

    ${!(prodDone&&prodDone.ts)&&canStep('prod')?`
      <div class="row" style="margin-top:8px"><select id="addDish" class="grow"><option value="">+ Add dish…</option>${(()=>{ const av = foods.filter(([id])=>!(s.items||{})[id]); const o = ([id,i])=>`<option value="${id}">${i.diet==='nonveg'?'🔴 ':i.diet==='veg'?'🟢 ':''}${esc(i.name)} (${esc(i.unit)})</option>`;
        const sug = av.filter(([,i])=>(i.meals||[]).includes(meal)), oth = av.filter(([,i])=>!(i.meals||[]).includes(meal));
        return (sug.length?`<optgroup label="Usual for ${meal}">${sug.map(o).join('')}</optgroup>`:'')+(oth.length?`<optgroup label="Other dishes">${oth.map(o).join('')}</optgroup>`:''); })()}</select>
      <input id="addPlan" type="number" inputmode="decimal" step="any" placeholder="planned" style="width:92px"></div>
      <button class="btn sec save" id="saveProd">Save quantities</button><button class="btn save" id="prodDoneBtn">Cooking complete</button>`:(prodDone&&prodDone.ts?lock('prodDone',1):'')}
    ${!foods.length?'<div class="sub" style="margin-top:6px">No cooked dishes in Masters yet — add them under Masters → Items (type: Cooked food).</div>':''}
  </div>

  <div class="card">${qcBlock('qc1','Production QC (before loading)',2,settings.minTempDispatch||65,'qc1')}${s.qc1&&s.qc1.ts?lock('qc1',1):''}</div>

  <div class="card">${stepHead(3,'Packed & loaded in vehicle',loaded&&loaded.ts||packed&&packed.ts)}
    <div class="row"><div class="grow">Packed</div><b>${hm(packed&&packed.ts)}</b>${lock('packed',packed&&packed.ts)}</div>
    <div class="row" style="margin-top:6px"><div class="grow">Loaded in vehicle</div><b>${hm(loaded&&loaded.ts)}</b>${lock('loaded',loaded&&loaded.ts)}</div>
    ${!(packed&&packed.ts)?btn('btnPacked','Mark packed','dispatch','sec'):''}
    ${packed&&packed.ts&&!(loaded&&loaded.ts)?btn('btnLoaded','Mark loaded in vehicle','dispatch'):''}
  </div>

  <div class="card">${stepHead(4,'Vehicle trip',dep&&dep.ts,' → '+(arr&&arr.ts?hm(arr.ts)+' ('+dur(dep.ts,arr.ts)+')':'on the way'))}
    ${(()=>{ const sc = ((site.sched||{})[meal])||{}; if (!sc.depart && !sc.arrive) return ''; const lt = (ts,pl)=>{ const m = lateMin(date,pl,ts); return ts && m!=null ? (m>0?` <b style="color:var(--red)">+${m} min late</b>`:` <b style="color:var(--green)">on time</b>`) : ''; };
      return `<div class="sub" style="margin-bottom:6px">${sc.depart?'Planned departure '+esc(sc.depart)+lt(dep&&dep.ts,sc.depart):''}${sc.depart&&sc.arrive?' · ':''}${sc.arrive?'Planned arrival '+esc(sc.arrive)+lt(arr&&arr.ts,sc.arrive):''}</div>`; })()}
    ${dep&&dep.ts?`<div class="sub">Vehicle ${esc(s.vehicle||'—')} · Driver ${esc(s.driver||'—')}${dep.loc?` · <a href="https://maps.google.com/?q=${dep.loc.lat},${dep.loc.lng}" target="_blank">start location</a>`:''}</div>`:''}
    ${!(dep&&dep.ts)&&canStep('depart')?`<div class="two"><div><label>Vehicle no.</label><input id="veh" value="${esc(s.vehicle||'')}" placeholder="TN 09 AB 1234"></div><div><label>Driver</label><input id="drv" value="${esc(s.driver||(me.role==='driver'?me.name:''))}"></div></div>
      <label>🛣️ Meter (odometer) reading at START — km</label><input id="odoS" type="number" inputmode="decimal" step="any" placeholder="e.g. 45210" value="${s.odo&&s.odo.start!=null?s.odo.start:''}">
      ${photoBox(sid+'_odoS','Meter photo (start)')}
      ${loaded&&loaded.ts?`<button class="btn save" id="btnDepart">🚚 Start trip (departed)</button>`:'<div class="sub" style="margin-top:8px">Mark the food loaded first.</div>'}`:''}
    ${dep&&dep.ts&&!(arr&&arr.ts)?`
      ${s.trackLast?`<div class="sub" style="margin-top:6px">Last position ${hm(s.trackLast.ts)}${s.trackLast.bg?' (background GPS)':''} · <a href="https://maps.google.com/?q=${s.trackLast.lat},${s.trackLast.lng}" target="_blank">open map</a></div>
      <iframe title="Vehicle position" loading="lazy" style="width:100%;height:190px;border:0;border-radius:10px;margin-top:6px" src="https://www.openstreetmap.org/export/embed.html?bbox=${s.trackLast.lng-0.012},${s.trackLast.lat-0.008},${s.trackLast.lng+0.012},${s.trackLast.lat+0.008}&layer=mapnik&marker=${s.trackLast.lat},${s.trackLast.lng}"></iframe>`:''}
      ${canStep('depart')?`<button class="btn sec save" id="btnTrack">${tracker?'⏸ Stop sharing location':'📍 Share live location'}</button>
      <div class="sub" style="margin-top:4px">${window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.BackgroundGeolocation?'Background GPS is available — tracking continues with the screen off.':'Browser mode: works while this screen stays open. Screen-off tracking needs the Android app with the background-location plugin and "Allow all the time" permission.'}</div>`:''}
      ${s.odo&&s.odo.start!=null?`<div class="sub" style="margin-top:6px">🛣️ Meter at start: <b>${fmt(s.odo.start)} km</b></div>`:''}
      ${canStep('arrive')?`<label>🛣️ Meter (odometer) reading now, at STOP — km</label><input id="odoE" type="number" inputmode="decimal" step="any" placeholder="e.g. ${s.odo&&s.odo.start!=null?fmt(s.odo.start+12):'45222'}">${photoBox(sid+'_odoE','Meter photo (stop)')}`:''}
      ${btn('btnArrive','📍 Arrived at site','arrive')}`:''}
    ${s.odo&&s.odo.start!=null&&dep&&dep.ts?`<div class="sub">🛣️ Meter ${fmt(s.odo.start)}${s.odo.end!=null?' → '+fmt(s.odo.end)+' km · <b>'+fmt(Math.round((s.odo.end-s.odo.start)*10)/10)+' km driven</b>':' km (start)'}</div>`:''}
    ${arr&&arr.ts?`<div class="sub">Arrived ${hm(arr.ts)} · trip ${dur(dep&&dep.ts,arr.ts)} · ${esc(arr.by||'')}${arr.loc?` · <a href="https://maps.google.com/?q=${arr.loc.lat},${arr.loc.lng}" target="_blank">arrival location</a>`:''}${lock('arrived',1)}</div>`:''}
    ${dep&&dep.ts?lock('departed',1):''}
  </div>

  <div class="card">${qcBlock('qc2','Arrival QC (at the counter)',5,settings.minTempArrival||60,'qc2')}${s.qc2&&s.qc2.ts?lock('qc2',1):''}</div>

  <div class="card">${stepHead(6,'Transfer to counter basins & weigh',cl&&cl.ts,' · '+esc((cl||{}).by||''))}
    ${!dishIds.length?'<div class="sub">Add dishes in step 1 first.</div>':dishIds.map(id=>{
      const d = items[id]||{name:'(deleted)',unit:'kg'}; const ws = Object.entries((s.weights||{})[id]||{});
      const tot = calc[id]?calc[id].loaded:0;
      return `<div style="margin-bottom:14px"><div class="row"><b class="grow">${esc(d.name)}</b><span class="qty" style="font-size:15px">${fmt(tot)} <small>${esc(d.unit)} at counter${calc[id]&&calc[id].prepared?' / '+fmt(calc[id].prepared)+' made':''}</small></span></div>
      ${ws.map(([wid,w])=>`<div class="sub" style="display:flex;justify-content:space-between;margin:3px 0">${esc(w.basinName||'basin')}: ${fmt(w.gross)} − ${fmt(w.tare)} = <b style="color:var(--ink)">${fmt(w.net)} ${esc(d.unit)}</b> · ${hm(w.ts)}${!(cl&&cl.ts)&&canStep('weigh')?` <a href="#" data-rmw="${id}|${wid}" style="color:var(--red)">remove</a>`:''}</div>`).join('')}
      ${!(cl&&cl.ts)&&canStep('weigh')&&d.unit==='nos'?`<div class="row" style="margin-top:6px"><div class="grow sub" style="margin:0">Count the pieces (no basin needed)</div><input class="wg" data-id="${id}" type="number" inputmode="numeric" step="1" placeholder="count" style="width:96px"><button class="btn" data-addw="${id}" style="padding:10px 12px">Add</button></div>`:''}
      ${!(cl&&cl.ts)&&canStep('weigh')&&d.unit!=='nos'?`<div class="row" style="margin-top:6px"><select class="wb grow" data-id="${id}"><option value="">Basin…</option>${Object.entries(basins).map(([k,b])=>`<option value="${k}">${esc(b.name)} (${fmt(b.tare)} kg)</option>`).join('')}</select>
        <input class="wg" data-id="${id}" type="number" inputmode="decimal" step="any" placeholder="scale kg" style="width:96px"><button class="btn" data-addw="${id}" style="padding:10px 12px">Add</button></div>`:''}</div>`; }).join('')}
    ${!Object.keys(basins).length?'<div class="sub">No basins yet — add each basin\'s empty weight in Masters → Basins.</div>':''}
    <div class="sub">Weigh the full basin on the scale; the app subtracts the basin weight. (Type the reading now — live smart-scale input can fill this box later.)</div>
    ${!(cl&&cl.ts)?btn('btnCounter','Loaded into food counter','weigh'):lock('counterLoaded',1)}
  </div>

  <div class="card">${stepHead(7,'Sales, leftover & wastage',closed&&closed.ts,' · '+esc((closed||{}).by||''))}
    ${!(cl&&cl.ts)?'<div class="sub">Opens after the food is loaded into the counter.</div>':dishIds.map(id=>{
      const d = items[id]||{name:'(deleted)',unit:'kg',portionG:null}; const c = (s.close||{})[id]||{}, k = calc[id]||{};
      const plate = d.portionG>0;
      const edit = !(closed&&closed.ts) && canStep('close');
      return `<div style="margin-bottom:14px"><b>${esc(d.name)}</b> <span class="sub">at counter ${fmt(k.loaded||0)} ${esc(d.unit)}</span>
        ${edit?`<div class="two"><div><label>Sold ${plate?'(plates)':'('+esc(d.unit)+')'} — aggregator report</label><input class="cs" data-id="${id}" type="number" inputmode="decimal" step="any" value="${plate?(c.soldPlates??''):(c.sold??'')}"></div>
          <div><label>Leftover (${esc(d.unit)})</label><input class="cl" data-id="${id}" type="number" inputmode="decimal" step="any" value="${c.leftover??''}"></div></div>
          <div class="two"><div><label>Wastage (${esc(d.unit)})</label><input class="cw" data-id="${id}" type="number" inputmode="decimal" step="any" value="${c.waste??''}"></div>
          <div><label>Reason</label><select class="cr" data-id="${id}"><option value="">—</option>${REASONS.map(r=>`<option ${c.reason===r?'selected':''}>${r}</option>`).join('')}</select></div></div>`
        :`<div class="sub">Sold ${fmt(k.sold||0)} ${esc(d.unit)}${k.soldPlates?' ('+fmt(k.soldPlates)+' plates)':''} · leftover ${fmt(k.left||0)} · wastage ${fmt(k.waste||0)}${k.reason?' ('+esc(k.reason)+')':''}</div>`}
        ${k.variance!=null?`<div class="notice ${k.flag?'alert':'info'}" style="margin:6px 0 0;padding:7px 10px;font-size:12.5px">${Math.abs(k.variance)<0.0005?'✓ Fully accounted for':(k.flag?'⚠ ':'')+(k.variance>0?'Shortage / unaccounted':'Excess')+': <b>'+fmt(Math.abs(k.variance))+' '+esc(d.unit)+'</b> ('+fmt(Math.round(Math.abs(k.pct||0)*10)/10)+'% of loaded)'}</div>`:''}</div>`; }).join('')}
    ${cl&&cl.ts&&!(closed&&closed.ts)?(canStep('close')?`<button class="btn sec save" id="saveClose">Save sales &amp; wastage</button><button class="btn save" id="btnClose">Close this meal</button>`:`<div class="sub">Needs: ${STEP_ROLES.close.filter(r=>r!=='admin').map(r=>ROLES[r].label).join(' / ')}</div>`):(closed&&closed.ts?lock('closed',1):'')}
  </div>

  <div class="card"><b>Report</b><div class="sub">Send this meal sheet to management${settings.reportEmails?' ('+esc(settings.reportEmails)+')':''}.${s.sentAt?' Last sent '+hm(s.sentAt)+' by '+esc(s.sentBy||''):''}</div>
    ${canStep('send')?`<div class="two" style="margin-top:10px"><button class="btn" id="rWA">WhatsApp</button><button class="btn sec" id="rMail">Email</button></div>
    <div class="two" style="margin-top:8px"><button class="btn sec" id="rCopy">Copy</button><button class="btn sec" id="rCsv">Export CSV</button></div>`:''}
  </div>`;

  const stamp = (k, extra) => db.ref(P+'sessions/'+sid).update(Object.assign({ date, siteId, meal }, { ['times/'+k]: Object.assign({ts:Date.now(), by:me.name}, extra||{}) }));
  const base = () => db.ref(P+'sessions/'+sid).update({ date, siteId, meal });
  const q = (sel, fn) => el.querySelectorAll(sel).forEach(fn);
  $('sBack').onclick = ()=>{ openSid = null; renderMeals(); };
  q('[data-reset]', a=>a.onclick=e=>{ e.preventDefault(); const k=a.dataset.reset; if(!confirm('Reset this step?')) return;
    if (k==='qc1'||k==='qc2') db.ref(P+'sessions/'+sid+'/'+k).remove(); else db.ref(P+'sessions/'+sid+'/times/'+k).remove(); });

  // 1 production
  const ad = $('addDish');
  if (ad) ad.onchange = ()=>{ const dv = ad.value; if (!dv) return; const pl = num($('addPlan').value); ad.blur(); base().then(()=>db.ref(P+'sessions/'+sid+'/items/'+dv).set({ planned: pl>0?pl:null, prepared: 0 })).then(()=>{ toast('Dish added'); renderAll(); }).catch(()=>alert('Could not add the dish. Check the internet and try again.')); };
  q('[data-rmdish]', b=>b.onclick=()=>db.ref(P+'sessions/'+sid+'/items/'+b.dataset.rmdish).remove());
  const sp = $('saveProd');
  const saveProd = () => { const ups = {}; el.querySelectorAll('.pq').forEach(i=>{ const v = num(i.value); if (v>=0){ const old=(s.items||{})[i.dataset.id]||{}; if ((old.prepared||0)!==v){ ups['items/'+i.dataset.id+'/prepared']=v; ups['items/'+i.dataset.id+'/preparedAt']=Date.now(); } } }); return Object.keys(ups).length ? db.ref(P+'sessions/'+sid).update(ups) : Promise.resolve(); };
  if (sp) sp.onclick = ()=>saveProd().then(()=>toast('Saved'));
  q('.pq', i=>i.onchange=()=>{ saveProd(); });
  const pd = $('prodDoneBtn'); if (pd) pd.onclick = ()=>{ saveProd().then(()=>{ const any = [...el.querySelectorAll('.pq')].some(i=>num(i.value)>0) || sItems.some(([,i])=>i.prepared>0); if (!any){ alert('Enter the quantity made for at least one dish.'); return; } stamp('prodDone'); }); };

  // QC
  ['qc1','qc2'].forEach(key=>{
    const go = ok => {
      const checks = [...el.querySelectorAll('.'+key+'_c')]; const labels = ['Taste & texture','Hygiene / labels','Packing sealed'];
      const fails = checks.map((c,i)=>c.checked?null:labels[i]).filter(Boolean);
      const te = $(key+'_t'); const temp = te ? num(te.value) : NaN;
      const min = key==='qc1' ? (settings.minTempDispatch||65) : (settings.minTempArrival||60);
      if (isFinite(temp) && temp<min) fails.push('Temp '+temp+'°C below '+min);
      if (!isFinite(temp)) fails.push('Temp not recorded');
      if (ok && fails.length && !confirm('Some checks are not OK: '+fails.join(', ')+'.\nPass anyway?')) return;
      base().then(()=>db.ref(P+'sessions/'+sid+'/'+key).set({ ok: !!ok, temp: isFinite(temp)?temp:null, fails, note:$(key+'_n').value.trim(), by:me.name, ts:Date.now() }));
    };
    const p = $(key+'_pass'), f = $(key+'_fail'); if (p) p.onclick = ()=>go(true); if (f) f.onclick = ()=>go(false);
  });

  // 3 dispatch
  const bp = $('btnPacked'); if (bp) bp.onclick = ()=>{ if (!(s.qc1&&s.qc1.ok) && !confirm('Production QC has not passed yet. Mark packed anyway?')) return; stamp('packed'); };
  const bl = $('btnLoaded'); if (bl) bl.onclick = ()=>stamp('loaded');

  // 4 trip
  const withLoc = cb => { if (!navigator.geolocation) return cb(null); navigator.geolocation.getCurrentPosition(p=>cb({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}), ()=>cb(null), {timeout:6000, maximumAge:30000}); };
  const bd = $('btnDepart'); if (bd) bd.onclick = ()=>{ const o1 = $('odoS').value.trim(); if (o1===''||!(num(o1)>=0)){ alert('Enter the meter (odometer) reading at start.'); return; } withLoc(loc=>{ db.ref(P+'sessions/'+sid).update({ ['odo/start']:num(o1), ['odo/startBy']:me.name, date, siteId, meal, vehicle:$('veh').value.trim(), driver:$('drv').value.trim(), ['times/departed']: {ts:Date.now(), by:me.name, loc:loc||null} }).then(()=>{ if (loc) startTracking(sid); }); }); };
  const ba = $('btnArrive'); if (ba) ba.onclick = ()=>{ const oe = $('odoE'); let o2 = null; if (oe){ if (oe.value.trim()===''||!(num(oe.value)>=0)){ alert('Enter the meter (odometer) reading at stop.'); return; } o2 = num(oe.value); if (s.odo&&s.odo.start!=null&&o2<s.odo.start){ alert('Stop meter ('+fmt(o2)+') is less than start meter ('+fmt(s.odo.start)+').'); return; } }
    withLoc(loc=>{ stopTracking(); const up = { ['times/arrived']: {ts:Date.now(), by:me.name, loc:loc||null} }; if (o2!=null){ up['odo/end']=o2; up['odo/endBy']=me.name; } db.ref(P+'sessions/'+sid).update(up); }); };
  const bt = $('btnTrack'); if (bt) bt.onclick = ()=>{ if (tracker) stopTracking(); else startTracking(sid); renderMeals(); };

  // 6 weigh
  q('[data-addw]', b=>b.onclick=()=>{ const id=b.dataset.addw; const isN = (items[id]||{}).unit==='nos'; const wbEl = el.querySelector('.wb[data-id="'+id+'"]'); const bs = isN ? 'count' : wbEl.value, g = num(el.querySelector('.wg[data-id="'+id+'"]').value);
    if (isN){ if (!(g>0)){ alert('Enter the count.'); return; } base().then(()=>db.ref(P+'sessions/'+sid+'/weights/'+id).push({ basinId:'count', basinName:'count', gross:g, tare:0, net:g, ts:Date.now(), by:me.name })); return; }
    if (!bs){ alert('Choose the basin.'); return; } if (!(g>0)){ alert('Enter the scale reading in kg.'); return; }
    const tare = basins[bs].tare||0, net = Math.round((g-tare)*1000)/1000; if (net<=0){ alert('Scale reading is not more than the basin weight ('+fmt(tare)+' kg).'); return; }
    base().then(()=>db.ref(P+'sessions/'+sid+'/weights/'+id).push({ basinId:bs, basinName:basins[bs].name, gross:g, tare, net, ts:Date.now(), by:me.name })); });
  q('[data-rmw]', a=>a.onclick=e=>{ e.preventDefault(); const [id,wid]=a.dataset.rmw.split('|'); db.ref(P+'sessions/'+sid+'/weights/'+id+'/'+wid).remove(); });
  const bc = $('btnCounter'); if (bc) bc.onclick = ()=>{ if (!Object.keys(s.weights||{}).length){ alert('Weigh at least one dish into the counter first.'); return; } if (!(s.qc2&&s.qc2.ts) && !confirm('Arrival QC is not recorded. Continue?')) return; stamp('counterLoaded'); };

  // 7 close
  const collect = () => { const ups = {}; dishIds.forEach(id=>{ const d = items[id]||{}; const plate = d.portionG>0;
      const sv = num(el.querySelector('.cs[data-id="'+id+'"]').value), lv = num(el.querySelector('.cl[data-id="'+id+'"]').value), wv = num(el.querySelector('.cw[data-id="'+id+'"]').value);
      const reason = el.querySelector('.cr[data-id="'+id+'"]').value;
      const soldKg = isFinite(sv) ? (plate ? Math.round(sv*d.portionG)/1000 : sv) : 0;
      ups['close/'+id] = { sold:soldKg, soldPlates: plate&&isFinite(sv)?sv:null, leftover:isFinite(lv)?lv:0, waste:isFinite(wv)?wv:0, reason }; });
    return ups; };
  const sc = $('saveClose'); if (sc) sc.onclick = ()=>db.ref(P+'sessions/'+sid).update(collect()).then(()=>toast('Saved'));
  const bcl = $('btnClose'); if (bcl) bcl.onclick = ()=>{ const ups = collect(); const bad = Object.entries(ups).filter(([,v])=>v.waste>0&&!v.reason); if (bad.length){ alert('Add a reason for every wastage entry.'); return; }
    db.ref(P+'sessions/'+sid).update(Object.assign(ups,{ ['times/closed']:{ts:Date.now(), by:me.name} })).then(()=>toast('Meal closed — send the report')); };

  // report
  const rp = () => buildReport({ type:'meals', from:date, to:date, site:siteId, meal, cat:'', item:'' });
  const logSend = () => db.ref(P+'sessions/'+sid).update({ sentAt:Date.now(), sentBy:me.name });
  const w = $('rWA'); if (w) w.onclick = ()=>{ const t = rp().text; logSend(); const url='https://wa.me/?text='+encodeURIComponent(t); const x=window.open(url,'_blank'); if(!x) location.href=url; };
  const m = $('rMail'); if (m) m.onclick = ()=>{ const r = rp(); logSend(); location.href = 'mailto:'+encodeURIComponent((settings.reportEmails||'').replace(/\s/g,''))+'?subject='+encodeURIComponent('OneByte '+r.title+' '+site.name+' '+meal+' '+date)+'&body='+encodeURIComponent(r.text.replace(/\*/g,'')); };
  const cp = $('rCopy'); if (cp) cp.onclick = ()=>copyText(rp().text);
  const cv = $('rCsv'); if (cv) cv.onclick = ()=>downloadCsv(rp());
}

/* live location: native background service when the Android plugin exists, else the browser (screen must stay open) */
let nativeWatcher = null, trackSid = null;
function startTracking(sid){
  if (tracker) return;
  const BG = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BackgroundGeolocation;
  let last = 0; trackSid = sid;
  const post = (lat,lng) => { const now = Date.now(); if (now-last < 30000) return; last = now;
    const pt = { lat:+lat.toFixed(6), lng:+lng.toFixed(6), ts:now, bg:!!BG };
    db.ref(P+'sessions/'+sid+'/trackLast').set(pt); db.ref(P+'trips/'+sid).push(pt); };
  if (BG && BG.addWatcher){
    tracker = 'native';
    BG.addWatcher({ backgroundTitle:'Trip in progress', backgroundMessage:'OneByte is sharing this trip with the kitchen team', requestPermissions:true, stale:false, distanceFilter:25 },
      (loc, err) => { if (err){ if (err.code==='NOT_AUTHORIZED' && BG.openSettings) BG.openSettings(); return; } post(loc.latitude, loc.longitude); })
      .then(id => { nativeWatcher = id; });
    toast('Live tracking on (works with screen off)'); return;
  }
  if (!navigator.geolocation) return;
  tracker = navigator.geolocation.watchPosition(p=>post(p.coords.latitude, p.coords.longitude), ()=>{}, {enableHighAccuracy:true, maximumAge:10000});
  toast('Sharing live location (keep this screen open)');
}
function stopTracking(){
  if (tracker==='native'){ const BG = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BackgroundGeolocation; if (BG && nativeWatcher!=null) BG.removeWatcher({id:nativeWatcher}); nativeWatcher = null; }
  else if (tracker!=null && navigator.geolocation){ navigator.geolocation.clearWatch(tracker); }
  tracker = null; trackSid = null;
}

function resumeTracking(){
  if (!me || me.role!=='driver' || tracker) return;
  const t = todayKey();
  const e = Object.entries(sessions).find(([,x])=>x.date===t && T(x,'departed') && !T(x,'arrived') && (!x.driver || x.driver===me.name));
  if (e) startTracking(e[0]);
}
const lateMin = (date, hhmm, ts) => { if (!hhmm || !ts) return null; return Math.round((ts - new Date(date+'T'+hhmm+':00').getTime())/60000); };
/* vehicles currently on the road, with alerts */
function onRoad(){
  const t = todayKey(), now = Date.now(), stale = settings.staleMin||10, maxM = settings.tripMaxMin||90;
  return Object.entries(sessions).filter(([,x])=>x.date===t && T(x,'departed') && !T(x,'arrived')).map(([sid,x])=>{
    const dep = T(x,'departed').ts, en = Math.round((now-dep)/60000), ping = x.trackLast ? Math.round((now-x.trackLast.ts)/60000) : null;
    const alerts = [];
    if ((ping==null && en>stale) || (ping!=null && ping>stale)) alerts.push(ping==null ? 'No GPS signal received' : 'No GPS for '+ping+' min');
    if (en>maxM) alerts.push('Trip longer than '+maxM+' min');
    return { sid, x, en, ping, alerts, site:(sites[x.siteId]||{}).name||x.siteId };
  });
}

const keyOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function tomorrowKey(){ const d = new Date(); d.setDate(d.getDate()+1); return keyOf(d); }
let planSt = { date: tomorrowKey(), site:'', meal:'' }, planOv = {};
const roundQty = (v,unit) => unit==='nos' ? Math.ceil(v/5)*5 : Math.ceil(v*2)/2;
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;

function suggestFor(siteId, meal, dateKey){
  const w = new Date(dateKey+'T00:00:00').getDay();
  const nSamp = settings.samples || 6, buf = (settings.buffer!=null ? settings.buffer : 5)/100;
  const hist = Object.values(sessions).filter(x=>x.siteId===siteId && x.meal===meal && x.date && x.date<dateKey && x.close);
  const desc = (a,b) => b.date.localeCompare(a.date);
  const same = hist.filter(x=>new Date(x.date+'T00:00:00').getDay()===w).sort(desc).slice(0,nSamp);
  const use = same.length ? same : hist.slice().sort(desc).slice(0,nSamp);
  const per = {};
  use.forEach(x=>{ const calc = sessionCalc(x);
    Object.entries(calc).forEach(([id,k])=>{ if (!items[id] || !x.close[id]) return; const o = (per[id] = per[id]||{sold:[],waste:[],loaded:[],dates:[]}); o.sold.push(k.sold); o.waste.push(k.waste); o.loaded.push(k.loaded); o.dates.push(x.date); }); });
  const dishes = Object.entries(per).filter(([,o])=>o.sold.length/use.length >= 0.5).map(([id,o])=>{
    const a = avg(o.sold); const it = items[id];
    const trend = o.sold.length>=4 ? (()=>{ const r = avg(o.sold.slice(0,2)), p = avg(o.sold.slice(2)); return p>0 ? (r-p)/p*100 : 0; })() : null;
    const lw = sum0(o.loaded), wp = lw>0 ? sum0(o.waste)/lw*100 : 0;
    return { id, avg:a, sug: roundQty(a*(1+buf), it.unit), n:o.sold.length, trend, wastePct:wp };
  }).sort((a,b)=>b.avg-a.avg);
  return { dishes, n:use.length, basis: same.length ? 'same weekday' : (use.length?'all days (no '+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][w]+' history yet)':'') };
}
const sum0 = a => a.reduce((x,y)=>x+y,0);

function planModel(){
  const rows = [];   // {siteId, meal, label, sug, dishes:[{...,qty}]}
  visibleSites().forEach(([siteId,site])=>{
    MEALS.filter(m=>(site.meals||[]).includes(m) && (!planSt.site||planSt.site===siteId) && (!planSt.meal||planSt.meal===m)).forEach(meal=>{
      const sg = suggestFor(siteId, meal, planSt.date);
      const dishes = sg.dishes.map(d=>({ ...d, qty: planOv[siteId+'|'+meal+'|'+d.id] != null ? planOv[siteId+'|'+meal+'|'+d.id] : d.sug }));
      rows.push({ siteId, meal, label: site.name+' — '+meal, sg, dishes });
    });
  });
  // raw-material requirement
  const need = {}, missing = new Set();
  rows.forEach(r=>r.dishes.forEach(d=>{ const rc = recipes[d.id]; if (!rc || !rc.lines || !Object.keys(rc.lines).length){ if (d.qty>0) missing.add(items[d.id].name); return; }
    Object.entries(rc.lines).forEach(([raw,q])=>{ if (items[raw]) need[raw] = (need[raw]||0) + q*d.qty; }); }));
  const req = Object.entries(need).map(([id,n])=>({ id, item:items[id], need:n, stock:stockOf(id), buy:Math.max(0, n-stockOf(id)) })).sort((a,b)=>b.buy-a.buy||a.item.name.localeCompare(b.item.name));
  return { rows, req, missing:[...missing] };
}

function planReport(m){
  const wd = new Date(planSt.date+'T00:00:00').toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'});
  const sections = m.rows.map(r=>({ h:r.label, cols:['Dish','Make','Unit','Avg sold','Based on'], rows:r.dishes.filter(d=>d.qty>0).map(d=>[items[d.id].name, fmt(d.qty), items[d.id].unit, fmt1(d.avg), d.n+' meals']),
    note:'No history yet.', line:x=>'• '+x[0]+': *'+x[1]+' '+x[2]+'*  (avg sold '+x[3]+')' }));
  sections.push({ h:'Raw material needed (from recipes)', cols:['Item','Need','In stock','To buy','Unit'], rows:m.req.map(q=>[q.item.name, fmt1(q.need), fmt1(q.stock), q.buy>0?fmt1(q.buy):'OK', q.item.unit]),
    note:'No recipes set up yet — add them in Masters → Recipes.', line:x=>'• '+x[0]+': need '+x[1]+' '+x[4]+' | stock '+x[2]+' | '+(x[3]==='OK'?'OK':'*BUY '+x[3]+'*') });
  if (m.missing.length) sections.push({ h:'Recipe missing for', cols:['Dish'], rows:m.missing.map(n=>[n]), line:x=>'• '+x[0] });
  const L = ['*OneByte Production — Plan for '+wd+'*'];
  sections.forEach(sec=>{ L.push('', '*'+sec.h+'*'); if (!sec.rows.length) L.push('_'+(sec.note||'—')+'_'); else sec.rows.forEach(r=>L.push(sec.line(r))); });
  L.push('', '_Suggested from past sales + '+(settings.buffer!=null?settings.buffer:5)+'% buffer · Internal — Kalyana Sapadu Production Unit_');
  return { title:'Production plan', period:planSt.date, filt:'', sections, text:L.join('\n') };
}

const REPORT_TYPES = [['master','Daily master (lifecycle)'],['meals','Meal sheets — per meal / day / week'],['stock','Stock & usage'],['purchase','Purchases'],['issue','Kitchen issue']];
const rep0 = ()=>({ type:'master', from:todayKey(), to:todayKey(), site:'', meal:'', cat:'', item:'' });

function inRange(e){ return e.date && e.date>=rep.from && e.date<=rep.to; }

function mealSections(R){
  const order = m => MEALS.indexOf(m);
  const list = Object.entries(sessions).map(([id,x])=>Object.assign({id},x)).filter(x=>x.date && x.date>=R.from && x.date<=R.to && (!R.site||x.siteId===R.site) && (!R.meal||x.meal===R.meal) && (!me || visibleSites().some(([k])=>k===x.siteId)))
    .sort((a,b)=>a.date.localeCompare(b.date)||String(a.siteId).localeCompare(String(b.siteId))||order(a.meal)-order(b.meal));
  const sn = x => (sites[x.siteId]||{name:x.siteId}).name;
  const qcs = q => q&&q.ts ? (q.ok?'Pass':'FAIL') : '—';
  const hmL = (x,k,pk)=>{ const t = T(x,k)&&T(x,k).ts; if (!t) return '—'; const sc = (((sites[x.siteId]||{}).sched||{})[x.meal]||{})[pk]; const l = sc ? lateMin(x.date, sc, t) : null; return hm(t)+(l>0?' (+'+l+'m late)':''); };
  const pend = (h)=>({ h, cols:[], rows:[], note:'No meal sheets recorded for this period / filter yet.' });
  if (!list.length) return [pend('Meal timeline'), pend('Dish-wise production, sales & wastage')];
  const timeline = { h:'Meal timeline', cols:['Date','Counter','Meal','Cooked','QC','Packed','Loaded','Departed','Arrived','Trip','Arr. QC','At counter','Closed','Km'],
    rows:list.map(x=>[x.date, sn(x), x.meal, hm(T(x,'prodDone')&&T(x,'prodDone').ts), qcs(x.qc1), hm(T(x,'packed')&&T(x,'packed').ts), hm(T(x,'loaded')&&T(x,'loaded').ts), hmL(x,'departed','depart'), hmL(x,'arrived','arrive'), dur(T(x,'departed')&&T(x,'departed').ts, T(x,'arrived')&&T(x,'arrived').ts), qcs(x.qc2), hm(T(x,'counterLoaded')&&T(x,'counterLoaded').ts), hm(T(x,'closed')&&T(x,'closed').ts), (x.odo&&x.odo.start!=null&&x.odo.end!=null)?fmt(Math.round((x.odo.end-x.odo.start)*10)/10):'—']),
    line:r=>'• '+r[1]+' '+r[2]+(r[0]!==R.from||R.from!==R.to?' ('+r[0]+')':'')+': cooked '+r[3]+' · QC '+r[4]+' · packed '+r[5]+' · loaded '+r[6]+' · departed '+r[7]+' · arrived '+r[8]+(r[9]!=='—'?' ('+r[9]+')':'')+' · arrival QC '+r[10]+' · at counter '+r[11]+' · closed '+r[12]+(r[13]&&r[13]!=='—'?' · '+r[13]+' km':'') };
  const vtxt = v => v==null ? '—' : Math.abs(v)<0.0005 ? '0' : v>0 ? fmt(v)+' short' : fmt(-v)+' excess';
  const dishRows = [], tot = {}, daily = {}, waste = {};
  list.forEach(x=>{
    const calc = sessionCalc(x);
    Object.entries(calc).forEach(([id,k])=>{
      if (R.item && R.item!==id) return;
      const it = items[id]||{name:'(deleted)',unit:''};
      dishRows.push({ r:[x.date, sn(x), x.meal, it.name, fmt(k.prepared), fmt(k.loaded), fmt(k.sold), fmt(k.left), fmt(k.waste), vtxt(k.variance)+(k.flag?' ⚠':''), it.unit], k });
      const t = tot[id] = tot[id]||{name:it.name,unit:it.unit,p:0,l:0,s:0,le:0,w:0,v:0,hasV:false}; t.p+=k.prepared; t.l+=k.loaded; t.s+=k.sold; t.le+=k.left; t.w+=k.waste; if (k.variance!=null){ t.v+=k.variance; t.hasV=true; }
      if (it.unit!=='nos'){ const d = daily[x.date] = daily[x.date]||{p:0,l:0,s:0,w:0,v:0}; d.p+=k.prepared; d.l+=k.loaded; d.s+=k.sold; d.w+=k.waste; if (k.variance!=null) d.v+=k.variance; }
      if (k.waste>0){ const key = (k.reason||'No reason')+'||'+it.name+'||'+it.unit; waste[key]=(waste[key]||0)+k.waste; }
    });
  });
  const dish = { h:'Dish-wise production, sales & wastage', cols:['Date','Counter','Meal','Dish','Made','At counter','Sold','Leftover','Wastage','Variance','Unit'], rows:dishRows.map(d=>d.r),
    line:r=>'• '+r[1]+' '+r[2]+(R.from!==R.to?' ('+r[0]+')':'')+' — '+r[3]+': made '+r[4]+' | counter '+r[5]+' | sold '+r[6]+' | left '+r[7]+' | waste '+r[8]+' | '+r[9]+' '+r[10] };
  const out = [timeline, dish];
  if (R.from!==R.to){
    out.push({ h:'Daily totals (kg / L — counted pieces excluded)', cols:['Date','Made','At counter','Sold','Wastage','Variance'], rows:Object.entries(daily).sort().map(([d,v])=>[d,fmt(v.p),fmt(v.l),fmt(v.s),fmt(v.w),vtxt(v.v)]),
      line:r=>'• '+r[0]+': made '+r[1]+' | counter '+r[2]+' | sold '+r[3]+' | waste '+r[4]+' | '+r[5] });
    out.push({ h:'Dish totals for the period', cols:['Dish','Unit','Made','At counter','Sold','Leftover','Wastage','Waste %','Variance'],
      rows:Object.values(tot).sort((a,b)=>b.s-a.s).map(t=>[t.name,t.unit,fmt(t.p),fmt(t.l),fmt(t.s),fmt(t.le),fmt(t.w), t.l>0?fmt(Math.round(t.w/t.l*1000)/10)+'%':'—', t.hasV?vtxt(t.v):'—']),
      line:r=>'• '+r[0]+': made '+r[2]+' | counter '+r[3]+' | sold '+r[4]+' | left '+r[5]+' | waste '+r[6]+' ('+r[7]+') '+r[1]+' | '+r[8] });
  }
  const wr = Object.entries(waste).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{ const [reason,name,unit]=k.split('||'); return [reason,name,fmt(v)+' '+unit]; });
  out.push({ h:'Wastage by reason', cols:['Reason','Dish','Quantity'], rows:wr, note:wr.length?'':'No wastage recorded.', line:r=>'• '+r[0]+' — '+r[1]+': '+r[2] });
  return out;
}
function buildReport(f){
  const R = f;
  const inR = e => e.date && e.date>=R.from && e.date<=R.to;
  const itemOk = ([id,i]) => i.type==='raw' && i.active!==false && (!R.cat || (i.category||'')===R.cat) && (!R.item || R.item===id);
  const rawItems = Object.entries(items).filter(itemOk).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const entries = Object.entries(ledger).map(([id,e])=>Object.assign({id},e));
  const sections = [];

  // 1. Stock & usage
  const stockRows = rawItems.map(([id,i])=>{
    let open=0, pur=0, used=0, adj=0;
    entries.forEach(e=>{
      if (e.itemId!==id) return;
      if (e.date < R.from) open += e.qty||0;
      else if (e.date <= R.to){
        if (e.type==='purchase') pur += e.qty;
        else if (e.type==='issue' || e.type==='issue-reversal') used += -e.qty;
        else adj += e.qty;
      }
    });
    const close = open + pur - used + adj;
    return [i.name, i.unit, fmt(open), fmt(pur), fmt(used), fmt(adj), fmt(close)+((i.minStock>0&&close<=i.minStock)?' ⚠ LOW':'')];
  });
  const stockSec = sectionTable('Raw material stock & usage', ['Item','Unit','Opening','Purchased','Used','Adjust','Closing'], stockRows, stockRows.length?'':'No raw materials match the filters.');

  // 2. Purchases
  const purEntries = entries.filter(e=>e.type==='purchase' && inR(e) && rawItems.some(([id])=>id===e.itemId)).sort((a,b)=>(a.ts||0)-(b.ts||0));
  let total = 0;
  const purRows = purEntries.map(e=>{ const it=items[e.itemId]; const amt = e.rate!=null ? e.qty*e.rate : null; if (amt!=null) total+=amt;
    return [e.date, it.name, fmt(e.qty)+' '+it.unit, e.rate!=null?'₹'+fmt(e.rate):'—', amt!=null?'₹'+fmt(amt):'—', e.supplier||'—', e.expiry||'—']; });
  if (purRows.length && purEntries.some(e=>e.rate!=null)) purRows.push(['','TOTAL','','','₹'+fmt(total),'','']);
  const purSec = sectionTable('Purchases (goods received)', ['Date','Item','Qty','Rate','Amount','Supplier','Expiry'], purRows, purRows.length?'':'No purchases in this period.');

  // 3. Kitchen issue by counter/meal
  const agg = {};
  entries.filter(e=>(e.type==='issue'||e.type==='issue-reversal') && inR(e) && rawItems.some(([id])=>id===e.itemId)
      && (!R.site || e.siteId===R.site) && (!R.meal || e.meal===R.meal)).forEach(e=>{
    const tgt = e.siteId && sites[e.siteId] ? sites[e.siteId].name+' — '+(e.meal||'') : 'General kitchen use';
    const k = tgt+'||'+e.itemId; agg[k] = (agg[k]||0) + (-e.qty);
  });
  const issRows = Object.entries(agg).filter(([,v])=>Math.abs(v)>0.0005).map(([k,v])=>{ const [t,id]=k.split('||'); return [t, items[id].name, fmt(v)+' '+items[id].unit]; }).sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1]));
  const issSec = sectionTable('Issued to kitchen', ['Counter / meal','Item','Quantity'], issRows, issRows.length?'':'Nothing issued in this period / filter.');

  const later = mealSections(R);

  let title, secs;
  if (R.type==='stock') { title='Stock & usage report'; secs=[stockSec]; }
  else if (R.type==='purchase') { title='Purchase report'; secs=[purSec]; }
  else if (R.type==='issue') { title='Kitchen issue report'; secs=[issSec]; }
  else if (R.type==='meals') { title = R.from===R.to ? 'Meal sheet' : 'Meal report'; secs = later; }
  else { title='Daily master report'; secs=[stockSec, purSec, issSec].concat(later); }

  const period = R.from===R.to ? R.from : R.from+' to '+R.to;
  const filt = [R.site&&sites[R.site]?'Counter: '+sites[R.site].name:'', R.meal?'Meal: '+R.meal:'', R.cat?'Category: '+R.cat:'', R.item&&items[R.item]?'Item: '+items[R.item].name:''].filter(Boolean).join(' · ');

  // WhatsApp / copy text
  const L = ['*OneByte Production — '+title+'*', '📅 '+period];
  if (filt) L.push(filt);
  secs.forEach(sec=>{
    L.push('', '*'+sec.h+'*');
    if (!sec.rows.length){ L.push('_'+sec.note+'_'); return; }
    sec.rows.forEach(r=>{
      if (sec.line) L.push(sec.line(r));
      else if (sec.cols[0]==='Item') L.push('• '+r[0]+': open '+r[2]+' | +'+r[3]+' | used '+r[4]+(r[5]!=='0'?' | adj '+r[5]:'')+' | *close '+r[6]+'* '+r[1]);
      else L.push('• '+r.filter(x=>x!=='').join(' · '));
    });
  });
  L.push('', '_Internal — Kalyana Sapadu Production Unit_', '_Generated by '+(me?me.name:'')+' · '+new Date().toLocaleString()+'_');
  return { title, period, filt, sections:secs, text:L.join('\n') };
}

function downloadCsv(r){

const SERIES_COL = ['#2a78d6','#eb6834','#1baf7a','#eda100','#8a8f87'];
const fmt1 = n => (Math.round(n*10)/10).toString();
let tr = { days:14, site:'', meal:'', item:'' };

function dayKeys(n){
  const out = [], d = new Date();
  for (let i=n-1;i>=0;i--){ const x = new Date(d); x.setDate(x.getDate()-i); out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')); }
  return out;
}
const shortDay = k => { const d = new Date(k+'T00:00:00'); return d.toLocaleDateString([], {day:'numeric', month:'short'}); };

function chartFrame(id, labels, maxV, inner, W, H, ml, mb, mt){
  const iw = W-ml-10, ih = H-mt-mb;
  const ticks = [0,1,2,3,4].map(i=>maxV*i/4);
  const grid = ticks.map(v=>{ const y = mt+ih-(v/maxV)*ih; return `<line x1="${ml}" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fmt1(v)}</text>`; }).join('');
  const step = Math.max(1, Math.ceil(labels.length/7));
  const xl = labels.map((l,i)=> i%step===0 || i===labels.length-1 ? `<text x="${ml+(labels.length===1?iw/2:i*iw/(labels.length-1))}" y="${H-6}" text-anchor="${i===labels.length-1&&labels.length>1?'end':'middle'}" font-size="10.5" fill="var(--muted)">${esc(shortDay(l))}</text>` : '').join('');
  return { iw, ih, svgOpen:`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:pan-y" role="img">${grid}${xl}`, svgClose:'</svg>' };
}
const chartData = {};
function niceMax(v){ if (v<=0) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v/p; const n = f<=1?1:f<=2?2:f<=4?4:f<=5?5:10; return n*p; }

function lineChart(id, labels, series, unit){
  const W = 640, H = 230, ml = 42, mb = 24, mt = 12;
  const maxV = niceMax(Math.max(0, ...series.flatMap(s=>s.vals)));
  const f = chartFrame(id, labels, maxV, '', W, H, ml, mb, mt);
  const X = i => ml + (labels.length===1 ? f.iw/2 : i*f.iw/(labels.length-1)), Y = v => mt + f.ih - (v/maxV)*f.ih;
  let body = '';
  series.forEach(s=>{
    const pts = s.vals.map((v,i)=>X(i)+','+Y(v)).join(' ');
    body += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (labels.length<=16) body += s.vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`).join('');
  });
  // direct labels at the right end (de-collided)
  const ends = series.map(s=>({s, y:Y(s.vals[s.vals.length-1])})).sort((a,b)=>a.y-b.y);
  for (let i=1;i<ends.length;i++) if (ends[i].y-ends[i-1].y<12) ends[i].y = ends[i-1].y+12;
  const lab = ends.map(e=>`<text x="${W-10}" y="${e.y-6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${esc(e.s.name)}</text>`).join('');
  // hover columns
  const colw = labels.length===1 ? f.iw : f.iw/(labels.length-1);
  const hits = labels.map((l,i)=>`<rect class="hit" data-ch="${id}" data-i="${i}" x="${X(i)-colw/2}" y="${mt}" width="${colw}" height="${f.ih}" fill="transparent"/>`).join('');
  chartData[id] = { labels, series, unit };
  return `<div class="chart">${f.svgOpen}${body}${lab}${hits}${f.svgClose}${legend(series)}</div>`;
}
function barChart(id, labels, series, unit){
  const W = 640, H = 210, ml = 42, mb = 24, mt = 12; const s = series[0];
  const maxV = niceMax(Math.max(0, ...s.vals));
  const f = chartFrame(id, labels, maxV, '', W, H, ml, mb, mt);
  const slot = f.iw/labels.length, bw = Math.min(26, slot*0.62);
  let body = '', hits = '';
  s.vals.forEach((v,i)=>{ const x = ml + slot*i + (slot-bw)/2, h = (v/maxV)*f.ih, y = mt+f.ih-h;
    if (h>0.5) body += `<path d="M${x},${mt+f.ih} V${y+Math.min(4,h)} Q${x},${y} ${x+Math.min(4,bw/2)},${y} H${x+bw-Math.min(4,bw/2)} Q${x+bw},${y} ${x+bw},${y+Math.min(4,h)} V${mt+f.ih} Z" fill="${s.color}"/>`;
    hits += `<rect class="hit" data-ch="${id}" data-i="${i}" x="${ml+slot*i}" y="${mt}" width="${slot}" height="${f.ih}" fill="transparent"/>`; });
  chartData[id] = { labels, series, unit };
  return `<div class="chart">${f.svgOpen}${body}${hits}${f.svgClose}</div>`;
}
