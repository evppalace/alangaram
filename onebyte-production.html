function importSeed(){
  const have = new Set(Object.values(items).map(i=>i.name.toLowerCase()));
  const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const upd = {};
  SEED.forEach(x=>{ if (!have.has(x.n.toLowerCase())) upd[slug(x.n)] = { name:x.n, ta:x.t, type:'raw', unit:x.u, category:x.c, minStock:0, active:true }; });
  SEED_DISHES.forEach(x=>{ if (!have.has(x.n.toLowerCase())) upd['dish-'+slug(x.n)] = { name:x.n, type:'food', unit:x.u, category:x.c, diet:x.d, meals:x.m, portionG:x.g||null, minStock:0, active:true }; });
  const n = Object.keys(upd).length; if (!n){ toast('Nothing new to add'); return; }
  db.ref(P+'items').update(upd).then(()=>toast(n+' items added — set minimum stock for the ones you track'));
}
function itemForm(id){
  const i = id ? items[id] : { name:'', type:'raw', unit:'kg', category:'', minStock:0 };
  $('mf').innerHTML = formShell(id?'Edit item':'New item', `
    <label>Name</label><input id="i_name" value="${esc(i.name)}" placeholder="e.g. Ponni rice / Veg biryani">
    <div class="two"><div><label>Type</label><select id="i_type"><option value="raw" ${i.type==='raw'?'selected':''}>Raw material</option><option value="food" ${i.type==='food'?'selected':''}>Cooked food</option></select></div>
    <div><label>Unit</label><select id="i_unit">${unitOpts(i.unit)}</select></div></div>
    <div class="two"><div><label>Category</label><input id="i_cat" value="${esc(i.category||'')}" placeholder="Rice / Veg / Dal / Oil…"></div>
    <div><label>Minimum stock (raw only)</label><input id="i_min" type="number" inputmode="decimal" step="any" value="${i.minStock||0}"></div></div>
    <div class="two"><div><label>Tamil name (optional)</label><input id="i_ta" value="${esc(i.ta||'')}"></div>
    <div><label>Plate size in grams (cooked, optional)</label><input id="i_portion" type="number" inputmode="decimal" step="any" value="${i.portionG||''}" placeholder="to enter sales as plates"></div></div>
    <label>Density — kg per 1 litre (for the kg ⇄ L switch)</label><input id="i_dens" type="number" inputmode="decimal" step="any" value="${i.density||1}" placeholder="1 = water-like. Sambar ≈ 1.03, oil ≈ 0.92, milk ≈ 1.03">
    <div class="sub">Every kg/L item shows a kg ⇄ L switch when you enter quantities. This number is used to convert between them.</div>`, 'i_save');
  $('i_save').onclick = ()=>{
    const name = $('i_name').value.trim(); if (!name){ alert('Enter a name.'); return; }
    const dup = Object.entries(items).some(([k,x])=>k!==id && x.name.toLowerCase()===name.toLowerCase());
    if (dup){ alert('An item with this name already exists.'); return; }
    const rec = { name, type:$('i_type').value, unit:$('i_unit').value, category:$('i_cat').value.trim(), minStock:Math.max(0,num($('i_min').value)||0), ta:$('i_ta').value.trim()||null, portionG:num($('i_portion').value)>0?num($('i_portion').value):null, density:num($('i_dens').value)>0?num($('i_dens').value):1, active:true };
    const ref = id ? db.ref(P+'items/'+id) : db.ref(P+'items').push();
    ref.update(rec).then(()=>{ toast('Saved'); $('mf').innerHTML=''; });
  };
}

function mSites(){
  const rows = Object.entries(sites);
  $('mBody').innerHTML = `<button class="btn save" id="addSite" style="margin:0 0 12px">+ Add counter</button><div id="mf"></div>` +
    (rows.length ? rows.map(([id,s])=>`<div class="card"><b>${esc(s.name)}</b><div class="sub">Meals: ${(s.meals||[]).map(esc).join(', ')||'—'}${s.company?' · '+esc(s.company):''}</div>
      <div class="actions"><button data-e="${id}">Edit</button></div></div>`).join('') : '<div class="empty">No counters yet. Add Teleperformance and HDFC.</div>');
  $('addSite').onclick = ()=>siteForm(null);
  $('mBody').querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>siteForm(b.dataset.e));
}
function siteForm(id){
  const s = id ? sites[id] : { name:'', company:'', meals:['breakfast','lunch','dinner'] };
  const m = s.meals||[];
  $('mf').innerHTML = formShell(id?'Edit counter':'New counter', `
    <label>Counter name</label><input id="s_name" value="${esc(s.name)}" placeholder="e.g. Teleperformance">
    <label>Company / site note</label><input id="s_co" value="${esc(s.company||'')}" placeholder="optional">
    <label>Meals served</label>
    <div class="chips">${MEALS.map(x=>`<label style="margin:0"><input type="checkbox" class="s_meal" value="${x}" ${m.includes(x)?'checked':''} style="width:auto;margin-right:5px;">${x}</label>`).join('')}</div>
    <label>Planned schedule (optional — late trips get flagged)</label>
    ${MEALS.map(x=>{ const sc = ((s.sched||{})[x])||{}; return `<div class="row" style="margin-bottom:6px"><div style="width:78px;font-size:13px">${MEAL_ICON[x]} ${x}</div><input type="time" class="s_dep" data-m="${x}" value="${esc(sc.depart||'')}" title="leave kitchen"><input type="time" class="s_arr" data-m="${x}" value="${esc(sc.arrive||'')}" title="arrive at site"></div>`; }).join('')}
    <div class="sub">Left box: leaves kitchen by · Right box: reaches the counter by</div>`, 's_save');
  $('s_save').onclick = ()=>{
    const name = $('s_name').value.trim(); if (!name){ alert('Enter a counter name.'); return; }
    const meals = [...document.querySelectorAll('.s_meal:checked')].map(x=>x.value);
    if (!meals.length){ alert('Pick at least one meal.'); return; }
    const key = id || name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    if (!id && sites[key]){ alert('This counter already exists.'); return; }
    const sched = {}; MEALS.forEach(x=>{ const dp = document.querySelector('.s_dep[data-m="'+x+'"]').value, ar = document.querySelector('.s_arr[data-m="'+x+'"]').value; if (meals.includes(x) && (dp||ar)) sched[x] = { depart:dp||null, arrive:ar||null }; });
    db.ref(P+'sites/'+key).update({ name, company:$('s_co').value.trim(), meals, sched:Object.keys(sched).length?sched:null }).then(()=>{ toast('Saved'); $('mf').innerHTML=''; });
  };
}

/* ---------- kg <-> L switch on every quantity box ---------- */
const KGL = u => u==='kg' || u==='L';
const dens = it => it && it.density>0 ? it.density : 1;
function convQty(q, from, to, it){ if (from===to) return q; return from==='kg' ? q/dens(it) : q*dens(it); }
function altText(it, q){ if (!it || !KGL(it.unit) || !isFinite(q)) return ''; const to = it.unit==='kg'?'L':'kg'; return '≈ '+fmt(Math.round(convQty(q,it.unit,to,it)*100)/100)+' '+to; }
const UW_SPECS = [
  { sel:'#pu_qty',  item:()=>($('pu_item')||{}).value },
  { sel:'#ad_qty',  item:()=>($('ad_item')||{}).value },
  { sel:'.is_qty',  item:el=>(document.querySelector('.is_item[data-n="'+el.dataset.n+'"]')||{}).value },
  { sel:'.pq',      item:el=>el.dataset.id },
  { sel:'#addPlan', item:()=>($('addDish')||{}).value },
  { sel:'.cs',      item:el=>el.dataset.id, skip:it=>it.portionG>0 },
  { sel:'.cl',      item:el=>el.dataset.id },
  { sel:'.cw',      item:el=>el.dataset.id }
];
function uwItem(el){ const sp = el._sp; const id = sp.item(el); const it = items[id]; return it && KGL(it.unit) && !(sp.skip && sp.skip(it)) ? it : null; }
function uwPaint(el){
  const it = uwItem(el), box = el._uw; if (!box) return;
  if (!it){ box.style.display='none'; el._u = null; if (el._hint.textContent) el._hint.textContent=''; return; }
  box.style.display='';
  if (!el._u || !KGL(el._u)) el._u = it.unit;
  box.querySelectorAll('b').forEach(b=>b.classList.toggle('on', b.dataset.u===el._u));
  const v = num(el.value);
  const ht = el._u!==it.unit && isFinite(v) ? '= '+fmt(Math.round(convQty(v,el._u,it.unit,it)*1000)/1000)+' '+it.unit+' will be recorded' : ''; if (el._hint.textContent!==ht) el._hint.textContent = ht;
}
function uwAttach(){
  UW_SPECS.forEach(sp=>document.querySelectorAll(sp.sel).forEach(el=>{
    if (el._uw) { uwPaint(el); return; }
    el._sp = sp;
    const wrap = document.createElement('div'); wrap.className='uwf'; wrap.style.cssText = 'display:block;'+(el.style.width?'width:'+el.style.width+';flex:none':'');
    el.parentNode.insertBefore(wrap, el); wrap.appendChild(el); if (el.style.width) el.style.width='100%';
    const box = document.createElement('div'); box.className='uw'; box.style.marginLeft='0'; box.style.marginTop='5px';
    box.innerHTML = '<b data-u="kg">kg</b><b data-u="L">L</b>';
    const hint = document.createElement('div'); hint.className='uhint';
    wrap.appendChild(box); wrap.appendChild(hint); el._uw = box; el._hint = hint;
    box.onclick = e=>{ const b = e.target.closest('b'); if (!b) return; const it = uwItem(el); if (!it) return; const to = b.dataset.u; if (to===el._u) return;
      const v = num(el.value); if (isFinite(v)) el.value = Math.round(convQty(v, el._u, to, it)*1000)/1000; el._u = to; uwPaint(el); };
    el.addEventListener('input', ()=>uwPaint(el));
    uwPaint(el);
  }));
}
function uwNormalize(){ // before any action reads the boxes, bring every box back to the item's own unit
  UW_SPECS.forEach(sp=>document.querySelectorAll(sp.sel).forEach(el=>{
    if (!el._uw || !el._u) return; const it = uwItem(el); if (!it || el._u===it.unit) return;
    const v = num(el.value); if (isFinite(v)){ el.value = Math.round(convQty(v, el._u, it.unit, it)*1000)/1000; el.dispatchEvent(new Event('input',{bubbles:true})); }
    el._u = it.unit; uwPaint(el);
  }));
}
document.addEventListener('click', e=>{ const b = e.target.closest && e.target.closest('button'); if (b && !b.closest('.uw')) uwNormalize(); }, true);
document.addEventListener('change', e=>{ if (e.target && e.target.tagName==='SELECT'){ uwNormalize(); setTimeout(uwAttach,0); } }, true);
(function(){ let q=0; const mo = new MutationObserver(()=>{ if(q) return; q=1; requestAnimationFrame(()=>{ q=0; try{ uwAttach(); }catch(e){} }); }); const a=document.getElementById('app'); if (a) mo.observe(a,{childList:true,subtree:true}); })();

const ALERT_PREFS = [['dep','🚚 Vehicle left kitchen'],['arr','📍 Vehicle arrived'],['late','⏱️ Late departure / arrival'],['qc','⚠️ Quality-check failures'],['waste','♻️ Wastage update after each meal'],['gps','📡 Tracking problems'],['esc','🚨 Escalation & feedback updates']];

function feedEvents(){
  if (!me) return [];
  const ev = [], days = [todayKey(), keyOf(new Date(Date.now()-864e5))], vs = new Set(visibleSites().map(([k])=>k));
  Object.entries(sessions).forEach(([sid,x])=>{
    if (!x.date || !days.includes(x.date) || !vs.has(x.siteId)) return;
    const nm = (sites[x.siteId]||{}).name || x.siteId, ml = x.meal, tag = nm+' · '+ml, sc = (((sites[x.siteId]||{}).sched||{})[ml])||{};
    const t = k => T(x,k) && T(x,k).ts;
    if (t('departed')){ const lm = sc.depart ? lateMin(x.date, sc.depart, t('departed')) : null;
      ev.push({id:'dep:'+sid, ts:t('departed'), k:'dep', icon:'🚚', title:'Left kitchen — '+tag, text:(x.vehicle||'Vehicle')+(x.driver?' · '+x.driver:'')+(lm>0?' · '+lm+' min late':(lm!=null?' · on time':''))});
      if (lm>0) ev.push({id:'ld:'+sid, ts:t('departed')+1, k:'late', icon:'⏱️', lvl:'amber', title:'Departure delayed — '+tag, text:lm+' min after the planned '+sc.depart}); }
    if (t('arrived')){ const lm = sc.arrive ? lateMin(x.date, sc.arrive, t('arrived')) : null;
      ev.push({id:'arr:'+sid, ts:t('arrived'), k:'arr', icon:'📍', title:'Arrived at counter — '+tag, text:'Trip '+dur(t('departed'),t('arrived'))+(lm>0?' · '+lm+' min late':(lm!=null?' · on time':''))});
      if (lm>0) ev.push({id:'la:'+sid, ts:t('arrived')+1, k:'late', icon:'⏱️', lvl:'amber', title:'Late arrival — '+tag, text:lm+' min after the planned '+sc.arrive}); }
    ['qc1','qc2'].forEach(k=>{ const q = x[k]; if (q && q.ts && q.ok===false) ev.push({id:k+':'+sid, ts:q.ts, k:'qc', icon:'⚠️', lvl:'red', title:'Quality check failed — '+tag+(k==='qc1'?' (kitchen)':' (arrival)'), text:(q.temp!=null?q.temp+'°C · ':'')+(q.note||'Action being taken')}); });
    if (t('closed')){ const c = sessionCalc(x); let load=0, w=0; Object.entries(c).forEach(([id,r])=>{ const it=items[id]; if (it && it.unit!=='nos'){ load+=r.loaded; w+=r.waste; } });
      ev.push({id:'ws:'+sid, ts:t('closed'), k:'waste', icon:'♻️', lvl:w>0?'amber':'', title:'Wastage update — '+tag, text:'Loaded '+fmt(Math.round(load*10)/10)+' · wasted '+fmt(Math.round(w*10)/10)+' ('+(load>0?r1(w/load*100):0)+'%)'}); }
  });
  onRoad().forEach(v=>{ if (!vs.has(v.x.siteId)) return; v.alerts.forEach(a=>ev.push({id:'gps:'+v.sid+':'+a, ts:Date.now(), k:'gps', icon:'📡', lvl:'red', title:'Tracking alert — '+v.site+' '+v.x.meal, text:a})); });
  Object.entries(escs).forEach(([id,e])=>{
    if (isAgg()){ if (e.siteId && !vs.has(e.siteId) && e.siteId!=='all') return; if ((e.upd||0) > e.ts) ev.push({id:'es:'+id+':'+e.status+':'+e.upd, ts:e.upd, k:'esc', icon:'🚨', lvl:e.status==='resolved'?'':'amber', title:'Escalation #'+e.n+' — '+(e.status==='resolved'?'resolved':e.status==='ack'?'acknowledged':e.status==='progress'?'being handled':e.status), text:e.cat}); }
    else if (isStaffClient()){ ev.push({id:'en:'+id+':'+(e.level||1), ts:e.ts+((e.level||1)-1), k:'esc', icon:'🚨', lvl:'red', title:'Client escalation #'+e.n+' — '+e.sev+(e.level>1?' (level '+e.level+')':''), text:e.cat+' · '+(e.text||'').slice(0,80)}); } });
  Object.entries(feedbacks).forEach(([id,f])=>{
    if (isAgg()){ if (f.reply && f.rts) ev.push({id:'fr:'+id+':'+f.rts, ts:f.rts, k:'esc', icon:'💬', title:'Reply to your '+f.type, text:f.reply.slice(0,90)}); }

/* ---------- small charts ---------- */
function miniBars(labels, vals, fmtv, color, maxV){
  const W=320,H=110,pad=18, mx = maxV || Math.max(1e-9,...vals), bw = (W-2*pad)/labels.length;

/* ---------- shared day facts ---------- */
function dayFacts(dateKey){
  const vs = new Set(visibleSites().map(([k])=>k));
  const list = Object.entries(sessions).filter(([,x])=>x.date===dateKey && vs.has(x.siteId));
  let load=0, waste=0, onT=0, onN=0, qcOk=0, qcN=0; const wd = {};
  list.forEach(([sid,x])=>{
    const c = sessionCalc(x);
    if (T(x,'closed')) Object.entries(c).forEach(([id,r])=>{ const it = items[id]; if (it && it.unit!=='nos'){ load+=r.loaded; waste+=r.waste; if (r.waste>0) wd[id]=(wd[id]||0)+r.waste; } });
    const sc = (((sites[x.siteId]||{}).sched||{})[x.meal])||{};
    if (sc.arrive && T(x,'arrived')){ onN++; if (lateMin(x.date, sc.arrive, T(x,'arrived').ts) <= 0) onT++; }
    ['qc1','qc2'].forEach(k=>{ if (x[k] && x[k].ts){ qcN++; if (x[k].ok) qcOk++; } });
  });
  const rts = Object.values(ratings).filter(r=>r.date===dateKey && vs.has(r.siteId) && r.r && r.r.overall);
  return { list, load, waste, wpct: load>0 ? waste/load*100 : null, onT, onN, qcOk, qcN, rating: rts.length ? rts.reduce((a,r)=>a+r.r.overall,0)/rts.length : null, wd };
}
function clientSummary(dateKey){
  const f = dayFacts(dateKey), nm = Object.values(sites).map(s=>s.name).join(' & ');
  let t = '*Kalyana Sapadu — Daily service update*\n'+dateKey+(nm?' · '+nm:'')+'\n\n';
  f.list.sort((a,b)=>MEALS.indexOf(a[1].meal)-MEALS.indexOf(b[1].meal)).forEach(([sid,x])=>{
    const c = sessionCalc(x), s = sites[x.siteId]||{}, sc = ((s.sched||{})[x.meal])||{};
    let l=0,w=0; Object.entries(c).forEach(([id,r])=>{ const it=items[id]; if (it&&it.unit!=='nos'){ l+=r.loaded; w+=r.waste; } });
    const arr = T(x,'arrived'), lm = arr&&sc.arrive ? lateMin(x.date,sc.arrive,arr.ts) : null;
    t += '*'+(s.name||x.siteId)+' — '+x.meal+'*\n'+(T(x,'departed')?'Left '+hm(T(x,'departed').ts):'Not dispatched')+(arr?' · arrived '+hm(arr.ts)+(lm>0?' ('+lm+' min late)':lm!=null?' (on time)':''):'')+'\n';
    ['qc1','qc2'].forEach(k=>{ const q=x[k]; if (q&&q.ts) t += (k==='qc1'?'Kitchen':'Arrival')+' QC: '+(q.ok?'passed':'FAILED')+(q.temp!=null?' ('+q.temp+'°C)':'')+'\n'; });
    if (T(x,'closed')) t += 'Food '+fmt(Math.round(l*10)/10)+' · wastage '+fmt(Math.round(w*10)/10)+' ('+(l>0?r1(w/l*100):0)+'%)\n';
    t += '\n'; });
  if (f.wpct!=null) t += '*Day wastage:* '+r1(f.wpct)+'%\n';
  if (f.rating) t += '*Your rating today:* '+r1(f.rating)+'/5\n';
  return t + '\n— OneByte Production, Kalyana Sapadu';
}

  el.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{ const key = b.dataset.save, [date,siteId,meal] = key.split('_'); const saved = ratings[key]||{}; const r = Object.assign({}, saved.r||{}, rateDraft[key]||{}); delete r.comment;
    if (!r.overall){ alert('Please give an Overall rating (tap the stars).'); return; }
    db.ref(P+'ratings/'+key).set({ date, siteId, meal, r, comment: (rateDraft[key]&&rateDraft[key].comment!=null)?rateDraft[key].comment:(saved.comment||''), by:me.name, ts:Date.now() }).then(()=>{ delete rateDraft[key]; toast('Thank you — rating saved'); }); });
  $('fb_type').onchange = ()=>fbDraft.type = $('fb_type').value; $('fb_site').onchange = ()=>fbDraft.siteId = $('fb_site').value; $('fb_text').oninput = ()=>fbDraft.text = $('fb_text').value;
  $('fb_send').onclick = ()=>{ const text = $('fb_text').value.trim(); if (!text){ alert('Please type your message.'); return; }
    db.ref(P+'feedback').push({ type:$('fb_type').value, siteId:$('fb_site').value||null, text, by:me.name, ts:Date.now(), status:'new' }).then(()=>{ fbDraft = {type:'feedback', siteId:'', text:''}; toast('Sent — we will reply soon'); renderAgRate(); }); };
}

/* ================= AGGREGATOR: ESCALATE ================= */
let escDraft = { siteId:'', meal:'', cat:ESC_CATS[0], sev:'medium', text:'' };
function slaBadge(e){
  if (e.status==='resolved' || e.status==='closed') return `<span class="badge">${e.status==='closed'?'Closed':'Resolved'}</span>`;
  const left = (e.due||0) - Date.now(), m = Math.abs(Math.round(left/60000)), txt = m>=60 ? Math.floor(m/60)+'h '+(m%60)+'m' : m+'m';
  return left>=0 ? `<span class="badge amber">Respond within ${txt}</span>` : `<span class="badge red">OVERDUE ${txt}</span>`;
}
const stLabel = s => ({open:'Open', ack:'Acknowledged', progress:'In progress', resolved:'Resolved', closed:'Closed'})[s] || s;
function escCard(id, e, staff){
  const hist = Object.values(e.hist||{}).sort((a,b)=>a.ts-b.ts), lv = (settings.esc||[])[Math.min((e.level||1),3)-1] || {};
  return `<div class="card" style="${(e.sev==='critical'||e.sev==='high')&&e.status!=='closed'&&e.status!=='resolved'?'border-left:5px solid var(--red)':''}"><div class="row"><div class="grow"><b>#${e.n} · ${esc(e.cat)}</b><div class="sub">${esc((sites[e.siteId]||{}).name||'All counters')}${e.meal?' · '+esc(e.meal):''} · ${esc(e.sev)} · Level ${e.level||1} · by ${esc(e.by)} · ${ago(e.ts)}</div></div>${slaBadge(e)}</div>
    <div style="font-size:13.5px;margin-top:6px">${esc(e.text)}</div><div style="margin-top:6px"><span class="badge ${e.status==='open'?'red':e.status==='resolved'||e.status==='closed'?'':'blue'}">${stLabel(e.status)}</span></div>
    ${hist.length?`<div class="tl">${hist.map(h=>`<div><b>${esc(h.by)}</b> · ${hm(h.ts)} ${new Date(h.ts).toLocaleDateString([], {day:'numeric',month:'short'})} — ${esc(h.text)}</div>`).join('')}</div>`:''}
    <div class="actions">${staff ? (e.status==='open'?`<button data-ea="ack" data-id="${id}">Acknowledge</button>`:'')+(e.status==='open'||e.status==='ack'?`<button data-ea="progress" data-id="${id}">Working on it</button>`:'')+(e.status!=='resolved'&&e.status!=='closed'?`<button data-ea="resolve" data-id="${id}">Resolve</button>`:'')
      : (e.status==='resolved'?`<button data-ea="close" data-id="${id}">✔ Confirm fixed</button><button data-ea="reopen" data-id="${id}">Not fixed</button>`:'')+((e.status!=='resolved'&&e.status!=='closed'&&(e.level||1)<3)?`<button data-ea="up" data-id="${id}">⬆ Escalate to level ${(e.level||1)+1}</button>`:'')}</div>
    ${!staff&&lv.phone&&e.status!=='closed'&&e.status!=='resolved'?`<div class="callrow"><a href="${telHref(lv.phone)}">📞 Call ${esc(lv.name||'level '+(e.level||1))}</a><a class="wa" href="${waHref(lv.phone,'Escalation #'+e.n+': '+e.cat)}" target="_blank">WhatsApp</a></div>`:''}</div>`;
}
function escAction(id, a){
  const e = escs[id]; if (!e) return; const ref = db.ref(P+'escalations/'+id), now = Date.now(), h = (txt)=>db.ref(P+'escalations/'+id+'/hist').push({ ts:now, by:me.name, text:txt });
  if (a==='ack') ref.update({status:'ack', upd:now}).then(()=>h('Acknowledged'));
  else if (a==='progress') ref.update({status:'progress', upd:now}).then(()=>h('Working on it'));
  else if (a==='resolve'){ const note = prompt('What was done to fix it? (shown to the client)'); if (note==null) return; ref.update({status:'resolved', upd:now, resolution:note}).then(()=>h('Resolved — '+(note||'fixed'))); }
  else if (a==='close') ref.update({status:'closed', upd:now}).then(()=>h('Client confirmed fixed'));
  else if (a==='reopen') ref.update({status:'open', upd:now, due: now+slaHrs(e.sev)*1800000}).then(()=>h('Client says not fixed — reopened'));
  else if (a==='up'){ const lv = (e.level||1)+1; ref.update({level:lv, status:'open', upd:now, due: now+slaHrs(e.sev)*1800000}).then(()=>h('Escalated to level '+lv+((settings.esc||[])[lv-1]&&(settings.esc||[])[lv-1].name?' — '+(settings.esc||[])[lv-1].name:''))); }
}
function renderAgEsc(){
  const el = $('p-agesc'); if (!el) return;
  if (el.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const mine = Object.entries(escs).sort((a,b)=>b[1].ts-a[1].ts);
  const lvls = [0,1,2].map(i=>(settings.esc||[])[i]||{});
  el.innerHTML = `<div class="sos"><i>🚨</i><div><b>Something wrong with the food?</b><span>Raise an escalation — it reaches the kitchen team instantly and is tracked until fixed.</span></div></div>
  <div class="card"><label>Counter</label><select id="es_site"><option value="all">All / general</option>${visibleSites().map(([k,s])=>`<option value="${k}" ${escDraft.siteId===k?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
    <div class="two"><div><label>Meal</label><select id="es_meal"><option value="">—</option>${MEALS.map(m=>`<option ${escDraft.meal===m?'selected':''}>${m}</option>`).join('')}</select></div>
    <div><label>What happened</label><select id="es_cat">${ESC_CATS.map(c=>`<option ${escDraft.cat===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <label>How serious</label><select id="es_sev">${SEVS.map(([v,l])=>`<option value="${v}" ${escDraft.sev===v?'selected':''}>${l}</option>`).join('')}</select>
    <label>Details</label><textarea id="es_text" rows="3" placeholder="Describe the issue — what, where, how many people affected">${esc(escDraft.text)}</textarea>
    <div class="sub" id="es_sla"></div>
    <button class="btn save" id="es_go" style="background:linear-gradient(135deg,#ff6b6b,#d6453a)">Raise escalation</button></div>
  <h2>Escalation ladder</h2>
  <div class="card">${lvls.map((l,i)=>`<div class="rrow"><span><b>Level ${i+1}</b> · ${esc(l.role||['Production Manager','Operations Head','Owner'][i])}<div class="sub">${esc(l.name||'')}</div></span>${l.phone?`<a class="badge" href="${telHref(l.phone)}" style="text-decoration:none">📞 ${esc(l.phone)}</a>`:'<span class="sub">number not set</span>'}</div>`).join('')}
    <div class="sub" style="margin-top:6px">Response targets: Critical ${slaHrs('critical')}h · High ${slaHrs('high')}h · Medium ${slaHrs('medium')}h · Low ${slaHrs('low')}h. If there is no reply in time, move it up a level.</div></div>
  <h2>Your escalations</h2>${mine.length ? mine.map(([id,e])=>escCard(id,e,false)).join('') : '<div class="empty">No escalations raised.</div>'}`;
  const slaTxt = ()=>{ $('es_sla').textContent = 'We will respond within '+slaHrs($('es_sev').value)+' hour(s) for this severity.'; }; slaTxt();
  ['es_site:siteId','es_meal:meal','es_cat:cat','es_sev:sev'].forEach(p=>{ const [i,k]=p.split(':'); $(i).onchange = ()=>{ escDraft[k] = $(i).value; slaTxt(); }; });
  $('es_text').oninput = ()=>escDraft.text = $('es_text').value;
  $('es_go').onclick = ()=>{ const text = $('es_text').value.trim(); if (!text){ alert('Please describe the issue.'); return; }
    const n = Object.values(escs).reduce((a,e)=>Math.max(a,e.n||0),0)+1, now = Date.now(), sev = $('es_sev').value;
    db.ref(P+'escalations').push({ n, siteId:$('es_site').value, meal:$('es_meal').value||null, cat:$('es_cat').value, sev, text, by:me.name, ts:now, upd:now, status:'open', level:1, due: now+slaHrs(sev)*3600000 })
      .then(()=>{ escDraft = {siteId:'',meal:'',cat:ESC_CATS[0],sev:'medium',text:''}; toast('Escalation #'+n+' raised'); renderAgEsc(); }); };
  el.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>escAction(b.dataset.id, b.dataset.ea));
}

/* ================= STAFF: CLIENT INBOX ================= */
let clTab = 'esc';
function renderClient(){
  const el = $('p-client'); if (!el) return;
  if (el.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const openE = Object.entries(escs).filter(([,e])=>e.status!=='closed'&&e.status!=='resolved').length, newF = Object.values(feedbacks).filter(f=>!f.reply).length;
  const tabs = [['esc','🚨 Escalations'+(openE?' ('+openE+')':'')],['fb','💬 Feedback'+(newF?' ('+newF+')':'')],['rt','⭐ Ratings'],['send','📤 Send update']];
  let body = '';
  if (clTab==='esc'){ const l = Object.entries(escs).sort((a,b)=>(a[1].status==='closed'||a[1].status==='resolved')-(b[1].status==='closed'||b[1].status==='resolved') || b[1].ts-a[1].ts); body = l.length ? l.map(([id,e])=>escCard(id,e,true)).join('') : '<div class="empty">No escalations from the client.</div>'; }
  else if (clTab==='fb'){ const l = Object.entries(feedbacks).sort((a,b)=>!!a[1].reply-!!b[1].reply || b[1].ts-a[1].ts).slice(0,60); body = l.length ? l.map(([id,f])=>`<div class="card"><div class="row"><b class="grow">${(FB_TYPES.find(x=>x[0]===f.type)||[0,'✉️ '+f.type])[1]}</b><span class="badge ${f.reply?'':'amber'}">${f.reply?'replied':'new'}</span></div><div class="sub">${esc(f.by)} · ${esc((sites[f.siteId]||{}).name||'general')} · ${ago(f.ts)}</div><div style="font-size:13.5px;margin-top:6px">${esc(f.text)}</div>
      ${f.reply?`<div class="notice info" style="margin:8px 0 0"><div><b>${esc(f.repBy||'')}:</b> ${esc(f.reply)}</div></div>`:`<div class="row" style="margin-top:8px"><input class="fr grow" data-id="${id}" placeholder="Type a reply"><button class="btn" data-fr="${id}" style="padding:10px 14px">Reply</button></div>`}</div>`).join('') : '<div class="empty">No feedback yet.</div>'; }
  else if (clTab==='rt'){ const days = ownDay(14).reverse(); body = days.map(d=>{ const rs = Object.values(ratings).filter(r=>r.date===d); if (!rs.length) return '';
      return `<div class="card"><b>${dayShort(d)}</b>${rs.map(r=>`<div class="rrow"><span>${esc((sites[r.siteId]||{}).name||'')} · ${esc(r.meal)}<div class="sub">${DIMS.filter(([k])=>r.r[k]).map(([k,l])=>l.split(' ')[0]+' '+r.r[k]).join(' · ')}${r.comment?'<br>“'+esc(r.comment)+'”':''}</div></span><b style="font-size:18px">${r.r.overall||'—'} ⭐</b></div>`).join('')}</div>`; }).join('') || '<div class="empty">No ratings yet.</div>'; }
  else body = `<div class="card"><div class="sub">Send the client today's service update — dispatch times, quality checks and wastage.</div><textarea id="cl_text" rows="12" style="margin-top:8px">${esc(clientSummary(todayKey()))}</textarea><div class="two" style="margin-top:10px"><button class="btn" id="cl_wa">WhatsApp</button><button class="btn sec" id="cl_mail">Email</button></div></div>`;
  el.innerHTML = `<div class="chips">${tabs.map(([k,l])=>`<div class="chip ${clTab===k?'active':''}" data-ct="${k}">${l}</div>`).join('')}</div>${body}`;
  el.querySelectorAll('[data-ct]').forEach(c=>c.onclick=()=>{ clTab = c.dataset.ct; renderClient(); });
  el.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>escAction(b.dataset.id, b.dataset.ea));
  el.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{ const id = b.dataset.fr, inp = el.querySelector('.fr[data-id="'+id+'"]'), t = inp.value.trim(); if (!t) return; db.ref(P+'feedback/'+id).update({ reply:t, repBy:me.name, rts:Date.now(), status:'replied' }).then(()=>toast('Reply sent')); });
  const w = $('cl_wa'); if (w) w.onclick = ()=>shareWhatsApp($('cl_text').value);
  const m = $('cl_mail'); if (m) m.onclick = ()=>{ location.href = 'mailto:?subject='+encodeURIComponent('Daily service update '+todayKey())+'&body='+encodeURIComponent($('cl_text').value.replace(/\*/g,'')); };
}
