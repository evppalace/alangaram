function renderTrends(){
  const el = $('p-trends');
  if (el.contains(document.activeElement) && /SELECT/.test(document.activeElement.tagName)) { skippedRender = true; return; }
  const allDays = dayKeys(tr.days), first = allDays[0], last = allDays[allDays.length-1];
  const sel = tr.item && items[tr.item] ? items[tr.item] : null;
  const dishOk = id => { const it = items[id]; if (!it) return false; if (tr.item) return id===tr.item; return it.unit!=='nos'; };
  const unit = sel ? sel.unit : 'kg / L';
  const list = Object.values(sessions).filter(x=>x.date && x.date>=first && x.date<=last && (!tr.site||x.siteId===tr.site) && (!tr.meal||x.meal===tr.meal));
  const have = new Set(list.map(x=>x.date)); const days = allDays.filter(d=>have.has(d)); // days with no meals (e.g. Sat/Sun off) are skipped
  const idx = {}; days.forEach((d,i)=>idx[d]=i);
  const zero = () => days.map(()=>0);
  const loaded = zero(), sold = zero(), waste = zero(), made = zero();
  const perItem = {}, byReason = {}, byDish = {}, byWd = {};
  let sess = 0, closedN = 0;
  list.forEach(x=>{
    sess++; if (T(x,'closed')) closedN++;
    const calc = sessionCalc(x);
    Object.entries(calc).forEach(([id,k])=>{
      if (!dishOk(id)) return; const i = idx[x.date];
      made[i]+=k.prepared; loaded[i]+=k.loaded; sold[i]+=k.sold; waste[i]+=k.waste;
      (perItem[id] = perItem[id]||{name:items[id].name, vals:zero(), tot:0}).vals[i]+=k.sold; perItem[id].tot+=k.sold;
      if (k.waste>0){ const r = k.reason||'No reason'; byReason[r]=(byReason[r]||0)+k.waste; byDish[items[id].name]=(byDish[items[id].name]||0)+k.waste; }
      const wd = new Date(x.date+'T00:00:00').getDay(); const o = (byWd[id]=byWd[id]||{}); (o[wd]=o[wd]||[]).push(k.sold);
    });
  });
  const sum = a => a.reduce((x,y)=>x+y,0);
  const topItems = Object.entries(perItem).filter(([,v])=>v.tot>0).sort((a,b)=>b[1].tot-a[1].tot);
  const top = topItems.slice(0,4), rest = topItems.slice(4);
  const prodSeries = top.map(([,v],i)=>({name:v.name, color:SERIES_COL[i], vals:v.vals}));
  if (rest.length) prodSeries.push({name:'Other', color:SERIES_COL[4], vals:days.map((_,i)=>sum(rest.map(([,v])=>v.vals[i])))});
  const dish = o => Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const o = (arr,s)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v===s?'selected':''}>${esc(l)}</option>`).join('');
  const wpct = sum(loaded)>0 ? sum(waste)/sum(loaded)*100 : 0;

function importSeed(){
  const have = new Set(Object.values(items).map(i=>i.name.toLowerCase()));
  const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const upd = {};
  SEED.forEach(x=>{ if (!have.has(x.n.toLowerCase())) upd[slug(x.n)] = { name:x.n, ta:x.t, type:'raw', unit:x.u, category:x.c, minStock:0, active:true }; });
  SEED_DISHES.forEach(x=>{ if (!have.has(x.n.toLowerCase())) upd['dish-'+slug(x.n)] = { name:x.n, type:'food', unit:x.u, category:x.c, diet:x.d, meals:x.m, portionG:x.g||null, minStock:0, active:true }; });
  const n = Object.keys(upd).length; if (!n){ toast('Nothing new to add'); return; }
  db.ref(P+'items').update(upd).then(()=>toast(n+' items added — set minimum stock for the ones you track'));
}

/* ---------- kg <-> L switch on every quantity box ---------- */
const KGL = u => u==='kg' || u==='L';
const dens = it => it && it.density>0 ? it.density : 1;
function convQty(q, from, to, it){ if (from===to) return q; return from==='kg' ? q/dens(it) : q*dens(it); }
function altText(it, q){ if (!it || !KGL(it.unit) || !isFinite(q)) return ''; const to = it.unit==='kg'?'L':'kg'; return '≈ '+fmt(Math.round(convQty(q,it.unit,to,it)*100)/100)+' '+to; }
const UW_SPECS = [
  { sel:'#pu_qty',  item:()=>($('pu_item')||{}).value },
  { sel:'#ad_qty',  item:()=>($('ad_item')||{}).value },
  { sel:'.is_qty',  item:el=>(document.querySelector('.is_item[data-n="'+el.dataset.n+'"]')||{}).value },
  { sel:'.pq',      item:el=>el.dataset.id },
  { sel:'#addPlan', item:()=>($('addDish')||{}).value },
  { sel:'.cs',      item:el=>el.dataset.id, skip:it=>it.portionG>0 },
  { sel:'.cl',      item:el=>el.dataset.id },
  { sel:'.cw',      item:el=>el.dataset.id }
];
function uwItem(el){ const sp = el._sp; const id = sp.item(el); const it = items[id]; return it && KGL(it.unit) && !(sp.skip && sp.skip(it)) ? it : null; }
function uwPaint(el){
  const it = uwItem(el), box = el._uw; if (!box) return;
  if (!it){ box.style.display='none'; el._u = null; if (el._hint.textContent) el._hint.textContent=''; return; }
  box.style.display='';
  if (!el._u || !KGL(el._u)) el._u = it.unit;
  box.querySelectorAll('b').forEach(b=>b.classList.toggle('on', b.dataset.u===el._u));
  const v = num(el.value);
  const ht = el._u!==it.unit && isFinite(v) ? '= '+fmt(Math.round(convQty(v,el._u,it.unit,it)*1000)/1000)+' '+it.unit+' will be recorded' : ''; if (el._hint.textContent!==ht) el._hint.textContent = ht;
}
function uwAttach(){
  UW_SPECS.forEach(sp=>document.querySelectorAll(sp.sel).forEach(el=>{
    if (el._uw) { uwPaint(el); return; }
    el._sp = sp;
    const wrap = document.createElement('div'); wrap.className='uwf'; wrap.style.cssText = 'display:block;'+(el.style.width?'width:'+el.style.width+';flex:none':'');
    el.parentNode.insertBefore(wrap, el); wrap.appendChild(el); if (el.style.width) el.style.width='100%';
    const box = document.createElement('div'); box.className='uw'; box.style.marginLeft='0'; box.style.marginTop='5px';
    box.innerHTML = '<b data-u="kg">kg</b><b data-u="L">L</b>';
    const hint = document.createElement('div'); hint.className='uhint';
    wrap.appendChild(box); wrap.appendChild(hint); el._uw = box; el._hint = hint;
    box.onclick = e=>{ const b = e.target.closest('b'); if (!b) return; const it = uwItem(el); if (!it) return; const to = b.dataset.u; if (to===el._u) return;
      const v = num(el.value); if (isFinite(v)) el.value = Math.round(convQty(v, el._u, to, it)*1000)/1000; el._u = to; uwPaint(el); };
    el.addEventListener('input', ()=>uwPaint(el));
    uwPaint(el);
  }));
}
function uwNormalize(){ // before any action reads the boxes, bring every box back to the item's own unit
  UW_SPECS.forEach(sp=>document.querySelectorAll(sp.sel).forEach(el=>{
    if (!el._uw || !el._u) return; const it = uwItem(el); if (!it || el._u===it.unit) return;
    const v = num(el.value); if (isFinite(v)){ el.value = Math.round(convQty(v, el._u, it.unit, it)*1000)/1000; el.dispatchEvent(new Event('input',{bubbles:true})); }
    el._u = it.unit; uwPaint(el);
  }));
}

function dayFacts(dateKey){
  const vs = new Set(visibleSites().map(([k])=>k));
  const list = Object.entries(sessions).filter(([,x])=>x.date===dateKey && vs.has(x.siteId));
  let load=0, waste=0, onT=0, onN=0, qcOk=0, qcN=0; const wd = {};
  list.forEach(([sid,x])=>{
    const c = sessionCalc(x);
    if (T(x,'closed')) Object.entries(c).forEach(([id,r])=>{ const it = items[id]; if (it && it.unit!=='nos'){ load+=r.loaded; waste+=r.waste; if (r.waste>0) wd[id]=(wd[id]||0)+r.waste; } });
    const sc = (((sites[x.siteId]||{}).sched||{})[x.meal])||{};
    if (sc.arrive && T(x,'arrived')){ onN++; if (lateMin(x.date, sc.arrive, T(x,'arrived').ts) <= 0) onT++; }

function slaBadge(e){
  if (e.status==='resolved' || e.status==='closed') return `<span class="badge">${e.status==='closed'?'Closed':'Resolved'}</span>`;
  const left = (e.due||0) - Date.now(), m = Math.abs(Math.round(left/60000)), txt = m>=60 ? Math.floor(m/60)+'h '+(m%60)+'m' : m+'m';
  return left>=0 ? `<span class="badge amber">Respond within ${txt}</span>` : `<span class="badge red">OVERDUE ${txt}</span>`;
}
const nextFb = () => Object.values(feedbacks).reduce((a,f)=>Math.max(a,f.n||0),0)+1;
const stLabel = s => ({open:'Open', ack:'Acknowledged', progress:'In progress', resolved:'Resolved', closed:'Closed'})[s] || s;
function escCard(id, e, staff){

    <div style="font-size:13.5px;margin-top:6px">${esc(e.text)}</div>${e.photoKey?photoBox(e.photoKey,'',{ro:true}):''}${(!staff&&e.status!=='closed')?photoBox('esc_'+id,'Add photo',{}):photoBox('esc_'+id,'',{ro:true})}<div style="margin-top:6px"><span class="badge ${e.status==='open'?'red':e.status==='resolved'||e.status==='closed'?'':'blue'}">${stLabel(e.status)}</span></div>
    ${hist.length?`<div class="tl">${hist.map(h=>`<div><b>${esc(h.by)}</b> · ${hm(h.ts)} ${new Date(h.ts).toLocaleDateString([], {day:'numeric',month:'short'})} — ${esc(h.text)}</div>`).join('')}</div>`:''}
    <div class="actions">${staff ? (e.status==='open'?`<button data-ea="ack" data-id="${id}">Acknowledge</button>`:'')+(e.status==='open'||e.status==='ack'?`<button data-ea="progress" data-id="${id}">Working on it</button>`:'')+(e.status!=='resolved'&&e.status!=='closed'?`<button data-ea="resolve" data-id="${id}">Resolve</button>`:'')
      : (e.status==='resolved'?`<button data-ea="close" data-id="${id}">✔ Confirm fixed</button><button data-ea="reopen" data-id="${id}">Not fixed</button>`:'')+((e.status!=='resolved'&&e.status!=='closed'&&(e.level||1)<3)?`<button data-ea="up" data-id="${id}">⬆ Escalate to level ${(e.level||1)+1}</button>`:'')}</div>
    ${!staff&&lv.phone&&e.status!=='closed'&&e.status!=='resolved'?`<div class="callrow"><a href="${telHref(lv.phone)}">📞 Call ${esc(lv.name||lv.role||'level '+(e.level||1))}</a><a class="wa" href="${waHref(lv.phone,escRef(e)+': '+e.cat)}" target="_blank">WhatsApp</a></div>`:''}</div>`;
}
function escAction(id, a){
  const e = escs[id]; if (!e) return; const ref = db.ref(P+'escalations/'+id), now = Date.now(), h = (txt)=>db.ref(P+'escalations/'+id+'/hist').push({ ts:now, by:me.name, text:txt });
  if (a==='ack') ref.update({status:'ack', upd:now}).then(()=>h('Acknowledged'));
  else if (a==='progress') ref.update({status:'progress', upd:now}).then(()=>h('Working on it'));
  else if (a==='resolve'){ const note = prompt('What was done to fix it? (shown to the client)'); if (note==null) return; ref.update({status:'resolved', upd:now, resolution:note}).then(()=>h('Resolved — '+(note||'fixed'))); }
  else if (a==='close') ref.update({status:'closed', upd:now}).then(()=>h('Client confirmed fixed'));
  else if (a==='reopen') ref.update({status:'open', upd:now, due: now+slaHrs(e.sev)*1800000}).then(()=>h('Client says not fixed — reopened'));
  else if (a==='up'){ const lv = (e.level||1)+1; ref.update({level:lv, status:'open', upd:now, due: now+slaHrs(e.sev)*1800000}).then(()=>h('Escalated to level '+lv+(' — '+(escList()[lv-1].name||escList()[lv-1].role)))); }
}

  if (clTab==='esc'){ const l = Object.entries(escs).sort((a,b)=>(a[1].status==='closed'||a[1].status==='resolved')-(b[1].status==='closed'||b[1].status==='resolved') || b[1].ts-a[1].ts); body = l.length ? l.map(([id,e])=>escCard(id,e,true)).join('') : '<div class="empty">No escalations from the client.</div>'; }
  else if (clTab==='fb'){ const l = Object.entries(feedbacks).sort((a,b)=>!!a[1].reply-!!b[1].reply || b[1].ts-a[1].ts).slice(0,60); body = l.length ? l.map(([id,f])=>`<div class="card"><div class="row"><b class="grow">${(FB_TYPES.find(x=>x[0]===f.type)||[0,'✉️ '+f.type])[1]}</b><span class="badge ${f.reply?'':'amber'}">${f.reply?'replied':'new'}</span></div><div class="sub">${f.n?fbRef(f)+' · ':''}${esc(f.by)} · ${esc((sites[f.siteId]||{}).name||'general')} · ${ago(f.ts)}</div><div style="font-size:13.5px;margin-top:6px">${esc(f.text)}</div>${f.photoKey?photoBox(f.photoKey,'',{ro:true}):''}${f.photoKey?photoBox(f.photoKey,'',{ro:true}):''}
      ${f.reply?`<div class="notice info" style="margin:8px 0 0"><div><b>${esc(f.repBy||'')}:</b> ${esc(f.reply)}</div></div>`:`<div class="row" style="margin-top:8px"><input class="fr grow" data-id="${id}" placeholder="Type a reply"><button class="btn" data-fr="${id}" style="padding:10px 14px">Reply</button></div>`}</div>`).join('') : '<div class="empty">No feedback yet.</div>'; }
  else if (clTab==='rt'){ const days = ownDay(14).reverse(); body = days.map(d=>{ const rs = Object.values(ratings).filter(r=>r.date===d); if (!rs.length) return '';
      return `<div class="card"><b>${dayShort(d)}</b>${rs.map(r=>`<div class="rrow"><span>${esc((sites[r.siteId]||{}).name||'')} · ${esc(r.meal)}<div class="sub">${DIMS.filter(([k])=>r.r[k]).map(([k,l])=>l.split(' ')[0]+' '+r.r[k]).join(' · ')}${r.comment?'<br>“'+esc(r.comment)+'”':''}</div>${photoBox('rt_'+r.date+'_'+r.siteId+'_'+r.meal,'',{ro:true})}</span><b style="font-size:18px">${r.r.overall||'—'} ⭐</b></div>`).join('')}</div>`; }).join('') || '<div class="empty">No ratings yet.</div>'; }
  else body = `<div class="card"><div class="sub">Send the client today's service update — dispatch times, quality checks and wastage.</div><textarea id="cl_text" rows="12" style="margin-top:8px">${esc(clientSummary(todayKey()))}</textarea><div class="two" style="margin-top:10px"><button class="btn" id="cl_wa">WhatsApp</button><button class="btn sec" id="cl_mail">Email</button></div></div>`;
  el.innerHTML = `<div class="chips">${tabs.map(([k,l])=>`<div class="chip ${clTab===k?'active':''}" data-ct="${k}">${l}</div>`).join('')}</div>${body}`;
  el.querySelectorAll('[data-ct]').forEach(c=>c.onclick=()=>{ clTab = c.dataset.ct; renderClient(); });
  el.querySelectorAll('[data-ea]').forEach(b=>b.onclick=()=>escAction(b.dataset.id, b.dataset.ea));
  el.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{ const id = b.dataset.fr, inp = el.querySelector('.fr[data-id="'+id+'"]'), t = inp.value.trim(); if (!t) return; db.ref(P+'feedback/'+id).update({ reply:t, repBy:me.name, rts:Date.now(), status:'replied' }).then(()=>toast('Reply sent')); });
  const w = $('cl_wa'); if (w) w.onclick = ()=>shareWhatsApp($('cl_text').value);
  const m = $('cl_mail'); if (m) m.onclick = ()=>{ location.href = 'mailto:?subject='+encodeURIComponent('Daily service update '+todayKey())+'&body='+encodeURIComponent($('cl_text').value.replace(/\*/g,'')); };
}

/* ================= MASTERS: CONTACTS & ESCALATION ================= */
function mContacts(){
  const st = settings, cts = contactsList(), esl = escList(), sla = st.sla||{};
  const rows = [0,1,2,3,4].map(i=>cts[i]||{});
  $('mBody').innerHTML = formShell('Client contacts, escalation & emergency', `
    <div class="sub">Shown to the aggregator in Contact, Escalate and the chatbot. Pre-filled: Site Supervisor → Operations Head → Director (escalation levels 1-3).</div>
    <label>Aggregator email-us address</label><input id="ct_mail" value="${esc(st.aggEmail||'')}" placeholder="${OWNER_EMAIL_DEFAULT}">
    <label>Director WhatsApp / phone</label><input id="ct_wa" inputmode="tel" value="${esc(st.waNumber||'')}" placeholder="${OWNER_PHONE_DEFAULT}">
    <h2>Team contacts (up to 5)</h2>
    ${rows.map((c,i)=>`<div class="two"><div><input class="ct_n" data-i="${i}" value="${esc(c.name||'')}" placeholder="Name"></div><div><input class="ct_p" data-i="${i}" inputmode="tel" value="${esc(c.phone||'')}" placeholder="Phone"></div></div><input class="ct_l" data-i="${i}" value="${esc(c.label||'')}" placeholder="Role e.g. Kitchen head (first contact is used for live-tracking calls)" style="margin:6px 0 10px">`).join('')}
    <h2>Escalation ladder</h2>
    ${[0,1,2].map(i=>`<div class="two"><div><input class="es_n" data-i="${i}" value="${esc((esl[i]||{}).name||'')}" placeholder="Level ${i+1} name"></div><div><input class="es_p" data-i="${i}" inputmode="tel" value="${esc((esl[i]||{}).phone||'')}" placeholder="Phone"></div></div><input class="es_r" data-i="${i}" value="${esc((esl[i]||{}).role||'')}" style="margin:6px 0 10px">`).join('')}
    <h2>Response targets (hours)</h2>
    <div class="two"><div><label>Critical</label><input id="sl_c" type="number" step="any" value="${slaHrs('critical')}"></div><div><label>High</label><input id="sl_h" type="number" step="any" value="${slaHrs('high')}"></div></div>
    <div class="two"><div><label>Medium</label><input id="sl_m" type="number" step="any" value="${slaHrs('medium')}"></div><div><label>Low</label><input id="sl_l" type="number" step="any" value="${slaHrs('low')}"></div></div>`, 'ct_save');
  $('ct_save').onclick = ()=>{
    const q = (c,i)=>document.querySelector(c+'[data-i="'+i+'"]').value.trim();
    db.ref(P+'settings').update({ aggEmail:$('ct_mail').value.trim(), waNumber:$('ct_wa').value.trim(),
      contacts:[0,1,2,3,4].map(i=>({name:q('.ct_n',i), phone:q('.ct_p',i), label:q('.ct_l',i)})).filter(c=>c.name||c.phone),
      esc:[0,1,2].map(i=>({name:q('.es_n',i), phone:q('.es_p',i), role:q('.es_r',i)})),
      sla:{ critical:num($('sl_c').value)||1, high:num($('sl_h').value)||4, medium:num($('sl_m').value)||8, low:num($('sl_l').value)||24 } }).then(()=>toast('Saved'));
  };
}

function phCompress(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = ()=>{ URL.revokeObjectURL(url); let max = 1000;
      const run = ()=>{
        const sc = Math.min(1, max/Math.max(im.width, im.height)), c = document.createElement('canvas');
        c.width = Math.max(1,Math.round(im.width*sc)); c.height = Math.max(1,Math.round(im.height*sc));
        const x = c.getContext('2d'); x.drawImage(im,0,0,c.width,c.height);
        const lab = new Date().toLocaleString()+' · '+(me?me.name:''), fs = Math.max(11, Math.round(c.width/42)), h = fs+10;
        x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0,c.height-h,c.width,h); x.fillStyle = '#fff'; x.font = 'bold '+fs+'px sans-serif'; x.textBaseline = 'middle'; x.fillText(lab,8,c.height-h/2);
        let q = .72, d = c.toDataURL('image/jpeg',q);
        while (d.length>190000 && q>.38){ q -= .08; d = c.toDataURL('image/jpeg',q); }
        if (d.length>190000 && max>500){ max = Math.round(max*.75); return run(); }
        res(d);
      }; run(); };
    im.onerror = ()=>rej(new Error('Not an image')); im.src = url;
  });
}

  if (!me || pushDone===me.id) return; pushDone = me.id;
  const C = CAP(), PN = C.PushNotifications, LN = C.LocalNotifications;
  try{ if (LN){ LN.requestPermissions(); if (LN.createChannel) LN.createChannel({ id:'urgent', name:'Urgent kitchen & production alerts', description:'Loud alarm when material is issued or the plan is sent', importance:5, visibility:1, vibration:true, lights:true }); } }catch(e){}

      PN.addListener('pushNotificationReceived', n=>{ notify((n&&n.title)||'OneByte', (n&&n.body)||'', n&&n.data&&n.data.ref, {urgent:!!(n&&n.data&&n.data.loud)}); if (n&&n.data&&n.data.loud){ try{ alarmRing([{icon:'🔔', title:(n.title||'Urgent update'), text:(n.body||''), go:n.data.tab||'prod'}]); }catch(e){} } });

      PN.requestPermissions().then(r=>{ if (r.receive==='granted') PN.register(); else pushState = 'denied'; }).catch(()=>{ pushState = 'error'; });
    }catch(e){ pushState = 'error'; }
  } else if (window.Notification && Notification.permission==='default'){

            const text = (/^same as above$/i.test(d) ? s0.text : (s0.text? s0.text+' — '+d : d)) || s0.cat, n = Object.values(escs).reduce((x,e)=>Math.max(x,e.n||0),0)+1, now = Date.now();

function stagesOf(x, siteId, meal){

  const t = k => x.times && x.times[k] && x.times[k].ts || 0, q = k => x[k] && x[k].ts ? x[k] : null;

  const qn = (o)=>o ? (o.ok?'Passed':'FAILED')+(o.temp!=null?' · '+o.temp+'°C':'')+(o.by?' · '+o.by:'') : '';
  const km = x.odo && x.odo.start!=null && x.odo.end!=null ? Math.round((x.odo.end-x.odo.start)*10)/10 : null;
  let w = 0, ld = 0; if (t('closed')){ const c = sessionCalc(x); Object.entries(c).forEach(([id,r])=>{ const it=items[id]; if (it&&it.unit!=='nos'){ ld+=r.loaded; w+=r.waste; } }); }
  return [
    { k:'cook',  ico:'🍳', label:'Cooked in central kitchen', ts:t('prodDone'), note:by('prodDone') },
    { k:'qc1',   ico:'🌡️', label:'Kitchen quality check', ts:q('qc1')&&q('qc1').ts, bad:q('qc1')&&!q('qc1').ok, note:qn(q('qc1')) },
    { k:'pack',  ico:'📦', label:'Packed & sealed', ts:t('packed'), note:by('packed') },

    { k:'dep',   ico:'🚚', label:'Left the kitchen', ts:t('departed'), note:[x.vehicle,x.driver,(x.odo&&x.odo.start!=null?'meter '+fmt(x.odo.start)+' km':'')].filter(Boolean).join(' · ')+lateTxt(t('departed'),sc.depart), plan:sc.depart },
    { k:'arr',   ico:'📍', label:'Reached the counter', ts:t('arrived'), note:(t('departed')&&t('arrived')?'trip '+dur(t('departed'),t('arrived')):'')+(km!=null?' · '+fmt(km)+' km':'')+lateTxt(t('arrived'),sc.arrive), plan:sc.arrive, late:t('arrived')&&sc.arrive&&lateMin(date,sc.arrive,t('arrived'))>0 },
    { k:'qc2',   ico:'✅', label:'Arrival quality check', ts:q('qc2')&&q('qc2').ts, bad:q('qc2')&&!q('qc2').ok, note:qn(q('qc2')) },
    { k:'xfer',  ico:'🍲', label:'Moved to serving basins', ts:t('counterLoaded'), note:by('counterLoaded') },
    { k:'serve', ico:'🍽️', label:'Served & meal closed', ts:t('closed'), note:t('closed') ? 'Wastage '+fmt(Math.round(w*10)/10)+(ld>0?' of '+fmt(Math.round(ld*10)/10)+' ('+r1(w/ld*100)+'%)':'') : '' }
  ];
}
function journeyPct(x, st){
  const done = st.filter(s=>s.ts).length, d = k => st.find(s=>s.k===k).ts;
  if (!done) return 0;
  if (d('serve')) return 100;
  if (d('arr')) return 76 + (st.filter(s=>['qc2','xfer'].includes(s.k)&&s.ts).length)*8;
  if (d('dep')){ const sc = (((sites[x.siteId]||{}).sched||{})[x.meal])||{}; let f = .5, el = Date.now()-d('dep');
    if (sc.depart && sc.arrive && x.date){ const a = new Date(x.date+'T'+sc.depart).getTime(), b = new Date(x.date+'T'+sc.arrive).getTime(); f = b>a ? el/(b-a) : .5; }
    else f = el/(45*60000);
    return 28 + Math.max(.08, Math.min(.92, f))*44; }
  return Math.min(24, done*6);
}

  const st = stagesOf(x), pct = journeyPct(x, st), moving = st.find(s=>s.k==='dep').ts && !st.find(s=>s.k==='arr').ts;
  const stations = [[0,'🍳','Kitchen'],[28,'📦','Loaded'],[50,'🛣️','On road'],[76,'🏢','Counter'],[100,'🍽️','Served']];
  return `<div class="jstrip ${moving?'moving':''}"><div class="jroad"><i style="width:${pct}%"></i></div>${stations.map(([p,i,l])=>`<div class="jst ${pct>=p?'on':''}" style="left:${p}%"><b>${i}</b><small>${l}</small></div>`).join('')}<div class="jvan" style="--p:${Math.max(3,Math.min(94,pct))}%"><div class="vbody">${VAN_SVG}<span class="vlogo"></span></div></div></div>`;
}
function journeyCard(sid, x, o){
  o = o || {}; const q = String(sid).split('_'), siteId = q[1], meal = q[2], s = sites[siteId]||{name:siteId};
  x = x || {}; const st = stagesOf(Object.assign({date:q[0],siteId,meal}, x), siteId, meal);
  const done = st.filter(z=>z.ts).length, cur = done<st.length ? done : -1, started = done>0;
  const lastTs = Math.max.apply(null, st.map(z=>z.ts||0));
  const head = `<div class="row"><div class="grow"><b>${MEAL_ICON[meal]||'🍽️'} ${esc(s.name)} — ${esc(meal)}</b><div class="sub">${started?(done===st.length?'Completed':st[cur].label+' next')+' · '+done+'/'+st.length+' steps':'Not started yet'}${lastTs?' · updated '+hm(lastTs):''}</div></div><span class="badge ${done===st.length?'':started?'blue':'grey'}">${done===st.length?'Done':started?'In progress':'Waiting'}</span></div>`;
  if (!o.full || !started) return `<div class="card jcard">${head}${jStrip(Object.assign({date:q[0],siteId,meal},x))}</div>`;
  return `<div class="card jcard">${head}${jStrip(Object.assign({date:q[0],siteId,meal},x))}
    <div class="jtl">${st.map((z,i)=>`<div class="jrow ${z.ts?(z.bad?'bad':'done'):(i===cur&&started?'now':'todo')}" style="--i:${i}"><div class="jdot">${z.ts?(z.bad?'!':'✓'):z.ico}</div><div class="jbody"><div class="jl"><b>${z.ico} ${esc(z.label)}</b><span>${z.ts?hm(z.ts):(z.plan?'plan '+esc(z.plan):'')}</span></div>${z.note?`<div class="sub ${z.late||z.bad?'jbad':''}">${esc(z.note)}</div>`:''}${!z.ts&&z.plan?`<div class="sub">Planned ${esc(z.plan)}</div>`:''}</div></div>`).join('')}</div></div>`;
}
function journeysHtml(full){
  const t = todayKey(), vs = new Set(visibleSites().map(([k])=>k)), list = [];
  visibleSites().forEach(([k,s])=>(s.meals&&s.meals.length?s.meals:MEALS).forEach(m=>{ const sid = sidOf(t,k,m), x = sessions[sid]; if (x || full) list.push([sid,x]); }));
  list.sort((a,b)=>MEALS.indexOf(a[0].split('_')[2])-MEALS.indexOf(b[0].split('_')[2]));

/* ---------- AGGREGATOR: reports ---------- */
let arp = { from:todayKey(), to:todayKey(), site:'', sec:'all' }, arpLast = null;
function aggReport(R){
  const days = []; for (let d = new Date(R.from+'T00:00:00'); keyOf(d)<=R.to && days.length<62; d.setDate(d.getDate()+1)) days.push(keyOf(d));
  const vsAll = visibleSites().filter(([k])=>!R.site || k===R.site), vs = new Set(vsAll.map(([k])=>k));
  const inR = d => d>=R.from && d<=R.to;
  const sc = [], tl = mealSections(Object.assign({}, R, {type:'meals'}));
  days.forEach(d=>{ const f = dayFacts(d); const list = f.list.filter(([,x])=>vs.has(x.siteId)); if (!list.length) return;
    sc.push([d, String(list.length), f.onN?Math.round(f.onT/f.onN*100)+'%':'—', f.qcN?f.qcOk+'/'+f.qcN:'—', f.wpct==null?'—':r1(f.wpct)+'%', f.rating?r1(f.rating)+' ⭐':'—']); });
  const rt = Object.values(ratings).filter(r=>inR(r.date) && vs.has(r.siteId)).sort((a,b)=>a.date.localeCompare(b.date)).map(r=>[r.date, (sites[r.siteId]||{}).name||'', r.meal, ...['food','qty','hyg','time','serv','overall'].map(k=>r.r&&r.r[k]?String(r.r[k]):'—'), r.comment||'']);
  const es = Object.values(escs).filter(e=>inR(keyOf(new Date(e.ts))) && (!e.siteId || e.siteId==='all' || vs.has(e.siteId))).sort((a,b)=>a.ts-b.ts).map(e=>[escRef(e), keyOf(new Date(e.ts)), e.cat, e.sev, stLabel(e.status), e.resolution||'—']);
  const secs = [
    sectionTable('Daily service scorecard', ['Date','Meals','On-time','QC passed','Wastage','Rating'], sc, 'No meals in this period.'),
    tl[0] || sectionTable('Meal timeline',[],[],'No meals in this period.'), tl[1] || sectionTable('Dish-wise',[],[],''),
    sectionTable('Ratings given', ['Date','Counter','Meal','Food','Qty','Hygiene','Time','Service','Overall','Comment'], rt, 'No ratings in this period.'),
    sectionTable('Escalations', ['Ref','Date','Issue','Severity','Status','Resolution'], es, 'No escalations in this period.')
  ];
  const shown = R.sec==='all' ? secs : secs.filter(s=>({score:'Daily service scorecard',time:'Meal timeline',dish:'Dish-wise production, sales & wastage',rate:'Ratings given',esc:'Escalations'})[R.sec]===s.h);
  const period = R.from===R.to ? R.from : R.from+' to '+R.to;
  const L = ['*Kalyana Sapadu — Service report*','📅 '+period+(R.site&&sites[R.site]?' · '+sites[R.site].name:'')];
  shown.forEach(sec=>{ L.push('','*'+sec.h+'*'); if (!sec.rows.length){ L.push('_'+sec.note+'_'); return; } sec.rows.forEach(r=>L.push(sec.line?sec.line(r):'• '+r.filter(v=>v!==''&&v!=null).join(' · '))); });
  L.push('','_Generated by '+(me?me.name:'')+' · '+new Date().toLocaleString()+'_');
  return { title:'Service report', period, filt:'', sections:shown, text:L.join('\n') };
}

/* ============ v5: PRODUCTION AREA, HAND-OFFS, LOUD ALERTS ============ */
const wfBy = () => me ? me.name : '';
function stampT(sid, k, extra){
  const [date, siteId, meal] = sid.split('_');
  return db.ref(P+'sessions/'+sid).update({ date, siteId, meal, ['times/'+k]: Object.assign({ ts:Date.now(), by:wfBy() }, extra||{}) });
}
function issuedFor(date, siteId, meal){
  const agg = {}; let by = '', ts = 0, n = 0;
  Object.entries(ledger).forEach(([id,e])=>{
    if (e.type!=='issue' || e.reversed || (e.forDate||e.date)!==date || e.siteId!==siteId || e.meal!==meal) return;
    const a = agg[e.itemId] = agg[e.itemId] || { itemId:e.itemId, qty:0 }; a.qty += -e.qty; n++; if ((e.ts||0)>ts){ ts = e.ts; by = e.by||''; }
  });
  return { lines:Object.values(agg), by, ts, n };
}
function generalIssued(date){
  let n = 0, ts = 0; Object.values(ledger).forEach(e=>{ if (e.type==='issue' && !e.reversed && !e.siteId && (e.forDate||e.date)===date){ n++; if ((e.ts||0)>ts) ts = e.ts; } });
  return { n, ts };
}
const issueTxt = lines => lines.map(l=>{ const it = items[l.itemId]||{name:'(deleted)',unit:''}; return esc(it.name)+' '+fmt(Math.round(l.qty*1000)/1000)+' '+esc(it.unit); }).join(' · ');
function wfState(sid, s){
  const [date, siteId, meal] = sid.split('_'); s = s || sessions[sid] || {};
  const iss = issuedFor(date, siteId, meal), pl = T(s,'planned'), cs = T(s,'cookStart'), pd = T(s,'prodDone');
  const planned = Object.entries(s.items||{}).filter(([,i])=>i.planned>0);
  return { date, siteId, meal, s, iss, pl, cs, pd, planned, gen:generalIssued(date) };
}
function wfLine(sid, s){
  const w = wfState(sid, s); const c = (ok,l)=>`<span style="color:${ok?'var(--green)':'var(--muted)'}">${ok?'✓':'○'} ${l}</span>`;
  return `<div class="sub" style="margin-top:3px">${c(w.iss.n>0,'Issued')} · ${c(w.pl&&w.pl.ts,'Plan sent')} · ${c(w.cs&&w.cs.ts,'Cooking started')}</div>`;
}
function wfDishEdit(sid, w, edit){
  const foods = Object.entries(items).filter(([,i])=>i.type==='food' && i.active!==false).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const av = foods.filter(([id])=>!(w.s.items||{})[id]);
  return `${Object.entries(w.s.items||{}).map(([id,it])=>{ const d = items[id]||{name:'(deleted)',unit:''};
    return `<div class="row" style="margin-bottom:6px"><div class="grow"><b>${esc(d.name)}</b><div class="sub">${it.prepared>0?'Made '+fmt(it.prepared)+' '+esc(d.unit):''}</div></div>
      ${edit?`<input class="wfpl" data-sid="${sid}" data-id="${id}" type="number" inputmode="decimal" step="any" value="${it.planned||''}" placeholder="plan" style="width:84px"><span class="sub" style="margin:0">${esc(d.unit)}</span><button class="btn danger" data-wfrm="${sid}|${id}" style="padding:6px 9px">✕</button>`:`<div class="qty">${it.planned?fmt(it.planned):'—'} <small>${esc(d.unit)} planned</small></div>`}</div>`; }).join('') || '<div class="sub">No dishes planned yet.</div>'}
    ${edit?`<div class="row" style="margin-top:6px"><select class="grow wfadd" data-sid="${sid}"><option value="">+ Add dish…</option>${av.map(([id,i])=>`<option value="${id}">${i.diet==='nonveg'?'🔴 ':i.diet==='veg'?'🟢 ':''}${esc(i.name)} (${esc(i.unit)})</option>`).join('')}</select><input class="wfaddq" data-sid="${sid}" type="number" inputmode="decimal" step="any" placeholder="plan qty" style="width:92px"></div>
      <button class="btn sec save" data-wf="suggest" data-sid="${sid}" style="margin-top:6px">✨ Fill suggested quantities</button>`:''}`;
}
function wfActions(sid, w){
  const out = [];
  const canPlan = canStep('plan'), canStart = canStep('cookstart');
  if (canPlan) out.push(`<button class="btn save" data-wf="plan" data-sid="${sid}">${w.pl&&w.pl.ts?'🔁 Send updated plan to kitchen':'📣 Send plan to kitchen'}</button>`);
  if (canStart && !(w.cs&&w.cs.ts) && !(w.pd&&w.pd.ts)) out.push(`<button class="btn save" data-wf="start" data-sid="${sid}">🍳 Start cooking</button>`);
  return out.join('');
}
function wfCardHtml(sid, s){
  const w = wfState(sid, s), step = (n,t,ok,det)=>`<div class="row" style="margin-bottom:6px;align-items:flex-start"><div style="width:24px;height:24px;border-radius:99px;flex:none;background:${ok?'var(--green)':'var(--line)'};color:${ok?'#fff':'var(--muted)'};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px">${ok?'✓':n}</div><div class="grow"><b>${t}</b><div class="sub" style="margin:0">${det}</div></div></div>`;
  const edit = canStep('plan') && !(w.pd&&w.pd.ts);
  return `<div class="card" style="border-left:4px solid var(--amber)"><b>Before cooking — hand-offs</b>
    ${step(1,'Raw material issued (Store Keeper)', w.iss.n>0, w.iss.n>0 ? issueTxt(w.iss.lines)+'<br>by '+esc(w.iss.by)+' · '+hm(w.iss.ts) : (w.gen.n? 'Only a <b>general</b> kitchen issue was made today ('+hm(w.gen.ts)+') — not linked to this meal.' : 'Waiting for the Store Keeper'))}
    ${step(2,'Plan sent to kitchen (Production Manager)', !!(w.pl&&w.pl.ts), w.pl&&w.pl.ts ? 'by '+esc(w.pl.by||'')+' · '+hm(w.pl.ts)+' · '+w.planned.length+' dish'+(w.planned.length===1?'':'es') : 'Waiting for the Production Manager')}
    ${step(3,'Cooking started (Kitchen / Cook)', !!(w.cs&&w.cs.ts), w.cs&&w.cs.ts ? 'by '+esc(w.cs.by||'')+' · '+hm(w.cs.ts) : 'Not started')}
    ${wfActions(sid,w)}</div>`;
}

function wfNext(sid, s){
  const q1 = s.qc1&&s.qc1.ts, pk = T(s,'packed'), ld = T(s,'loaded'), dp = T(s,'departed'), ar = T(s,'arrived');
  const chip = (ok,l)=>`<span style="color:${ok?'var(--green)':'var(--muted)'}">${ok?'✓':'○'} ${l}</span>`;
  let next = '', act = '';
  if (!q1){ next = 'Production QC (taste, hygiene, temperature)'; }
  else if (!(pk&&pk.ts)){ next = 'Packing'; if (canStep('dispatch')) act = `<button class="btn save" data-wf="packed" data-sid="${sid}">📦 Mark packed</button>`; }
  else if (!(ld&&ld.ts)){ next = 'Loading in vehicle'; if (canStep('dispatch')) act = `<button class="btn save" data-wf="loaded" data-sid="${sid}">🚛 Mark loaded in vehicle</button>`; }
  else if (!(dp&&dp.ts)){ next = 'Vehicle departure (driver: meter reading, then start trip)'; }
  else if (!(ar&&ar.ts)){ next = 'On the road to the counter'; }
  else next = 'At the counter — arrival QC, weighing and sales';
  return `<div class="card" style="margin:8px 0 0;border-left:4px solid var(--green)"><b>Next: dispatch</b>
    <div class="sub" style="margin-top:4px">${chip(q1,'QC')} → ${chip(pk&&pk.ts,'Packed')} → ${chip(ld&&ld.ts,'Loaded')} → ${chip(dp&&dp.ts,'Driving')} → ${chip(ar&&ar.ts,'Arrived')}</div>
    <div class="sub">Now: <b style="color:var(--ink)">${next}</b></div>${act}
    <button class="btn sec save" data-wf="open" data-sid="${sid}">Open full sheet to continue ›</button></div>`;
}

    ${hello?`<div class="notice info" style="margin-bottom:10px">ℹ️ <div>${hello}</div></div>`:''}
    ${cards.join('') || '<div class="empty">No counters/meals set up yet. Admin: Masters → Counters.</div>'}`;
  const shift = n => { const d = new Date(mDate+'T00:00:00'); d.setDate(d.getDate()+n); mDate = keyOf(d); renderProd(); };
  $('prPrev').onclick = ()=>shift(-1); $('prNext').onclick = ()=>shift(1); $('prPick').onchange = ()=>{ if ($('prPick').value){ mDate = $('prPick').value; renderProd(); } };
}

document.addEventListener('change', e=>{
  const t = e.target; if (!t || !me) return;
  if (t.classList && t.classList.contains('wfadd') && t.value){
    const sid = t.dataset.sid, id = t.value, q = document.querySelector('.wfaddq[data-sid="'+sid+'"]'), pl = q ? num(q.value) : NaN; t.blur();
    stampBase(sid).then(()=>db.ref(P+'sessions/'+sid+'/items/'+id).set({ planned: pl>0?pl:null, prepared:0 })).then(()=>{ toast('Dish added'); renderAll(); }).catch(()=>alert('Could not add the dish. Check the internet and try again.'));
  }
  else if (t.classList && t.classList.contains('wfpl')){ const v = num(t.value); db.ref(P+'sessions/'+t.dataset.sid+'/items/'+t.dataset.id+'/planned').set(v>0?v:null).then(()=>toast('Saved')); }
  else if (t.classList && t.classList.contains('wfmade')){ const v = num(t.value); if (v>=0) db.ref(P+'sessions/'+t.dataset.sid+'/items/'+t.dataset.id).update({ prepared:v, preparedAt:Date.now() }).then(()=>toast('Saved')); }
});
function stampBase(sid){ const [date,siteId,meal] = sid.split('_'); return db.ref(P+'sessions/'+sid).update({ date, siteId, meal }); }
document.addEventListener('click', e=>{
  const rm = e.target.closest && e.target.closest('[data-wfrm]');
  if (rm){ const [sid,id] = rm.dataset.wfrm.split('|'); db.ref(P+'sessions/'+sid+'/items/'+id).remove().then(()=>renderAll()); return; }
  const b = e.target.closest && e.target.closest('[data-wf]'); if (!b || !me) return;
  const sid = b.dataset.sid, act = b.dataset.wf, w = wfState(sid);
  if (act==='open'){ openSid = sid; go('meals'); return; }
  if (act==='suggest'){
    const keep = { d:planSt.date, s:planSt.site, m:planSt.meal }; planSt.date = w.date; planSt.site = w.siteId; planSt.meal = w.meal;
    let r; try{ r = planModel().rows[0]; }catch(err){} planSt.date = keep.d; planSt.site = keep.s; planSt.meal = keep.m;
    const ds = r ? r.dishes.filter(d=>d.qty>0) : []; if (!ds.length){ alert('No past sales history for this counter and meal yet — add dishes and quantities by hand.'); return; }
    const ups = { date:w.date, siteId:w.siteId, meal:w.meal }; ds.forEach(d=>{ ups['items/'+d.id+'/planned'] = d.qty; if (!(w.s.items||{})[d.id]) ups['items/'+d.id+'/prepared'] = 0; });
    db.ref(P+'sessions/'+sid).update(ups).then(()=>{ toast('Suggested quantities filled'); renderAll(); }); return;
  }
  if (act==='plan'){
    if (!w.planned.length){ alert('Add at least one dish with a planned quantity first.'); return; }
    if (!(w.iss.n>0) && !confirm('No raw material has been issued for this meal yet.\nSend the plan to the kitchen anyway?')) return;
    b.disabled = true; stampT(sid,'planned').then(()=>{ toast('📣 Plan sent — kitchen alerted'); renderAll(); }); return;
  }
  if (act==='start'){
    if (!(w.pl&&w.pl.ts) && !confirm('The Production Manager has not sent the plan yet.\nStart cooking anyway?')) return;
    if (!(w.iss.n>0) && !confirm('No raw material has been issued for this meal yet.\nStart cooking anyway?')) return;
    b.disabled = true; stampT(sid,'cookStart').then(()=>{ toast('🍳 Cooking started'); renderAll(); }); return;
  }
  if (act==='packed' || act==='loaded'){ b.disabled = true; stampT(sid,act).then(()=>{ toast(act==='packed'?'📦 Packed':'🚛 Loaded'); renderAll(); }); return; }
  if (act==='done'){
    const s = sessions[sid]||{}; const any = Object.values(s.items||{}).some(i=>i.prepared>0);
    if (!any){ alert('Enter the quantity made for at least one dish.'); return; }
    b.disabled = true; stampT(sid,'prodDone').then(()=>{ toast('✅ Cooking complete'); renderAll(); }); return;
  }
});

/* ---------- hand-off alerts to the people above & below ---------- */
const WF_DEF = {
  planned:{ ic:'🗓️', t:'Plan sent to kitchen', to:['kitchen','cook','store','prodmanager','admin'], loud:['kitchen','cook'] },
  cookStart:{ ic:'🍳', t:'Cooking started', to:['prodmanager','store','admin','driver','supervisor','counter'], loud:[] },
  prodDone:{ ic:'✅', t:'Cooking complete — ready for QC', to:['prodmanager','driver','supervisor','counter','admin','kitchen','cook'], loud:['prodmanager','driver'] },
  packed:{ ic:'📦', t:'Packed', to:['driver','prodmanager','kitchen','cook','admin'], loud:['driver'] },
  loaded:{ ic:'🚛', t:'Loaded in vehicle', to:['driver','prodmanager','supervisor','counter','admin','kitchen','cook'], loud:['driver'] },
  counterLoaded:{ ic:'🍽️', t:'Loaded into food counter', to:['prodmanager','kitchen','cook','admin','supervisor','counter','store'], loud:[] }
};
function wfEvents(){
  const out = [], days = [todayKey(), keyOf(new Date(Date.now()-864e5)), keyOf(new Date(Date.now()+864e5))], vs = new Set(visibleSites().map(([k])=>k)), role = me.role;
  Object.entries(sessions).forEach(([sid,x])=>{
    if (!x.date || !days.includes(x.date) || !vs.has(x.siteId)) return;
    const nm = (sites[x.siteId]||{}).name || x.siteId, tag = nm+' · '+x.meal;
    Object.entries(WF_DEF).forEach(([k,d])=>{ const t = T(x,k); if (t && t.ts && d.to.includes(role)) out.push({ id:'wf:'+k+':'+sid+':'+t.ts, ts:t.ts, k:'wf', icon:d.ic, lvl:d.loud.includes(role)?'amber':'', loud:d.loud.includes(role), by:t.by, title:d.t+' — '+tag, text:'by '+(t.by||'—'), go:'prod' }); });
    [['qc1','Production QC',['kitchen','cook','driver','prodmanager','admin']],['qc2','Arrival QC',['prodmanager','kitchen','cook','admin','driver','supervisor','counter']]].forEach(([k,l,to])=>{ const q = x[k]; if (q && q.ts && q.ok!==false && to.includes(role)) out.push({ id:'wf:'+k+':'+sid+':'+q.ts, ts:q.ts, k:'wf', icon:'🧪', by:q.by, title:l+' passed — '+tag, text:(q.temp!=null?q.temp+'°C · ':'')+'by '+(q.by||'—'), go:'meals' }); });
  });
  if (['kitchen','cook','prodmanager','admin'].includes(role)){
    const batches = {};
    Object.entries(ledger).forEach(([id,e])=>{ if (e.type!=='issue' || e.reversed) return; const k = e.batch || id; const b = batches[k] = batches[k] || { ts:0, by:'', n:0, siteId:e.siteId, meal:e.meal, d:e.forDate||e.date }; b.n++; if ((e.ts||0)>b.ts){ b.ts = e.ts; b.by = e.by||''; } });
    Object.entries(batches).forEach(([k,b])=>{ if (!b.ts || !days.includes(b.d) || (b.siteId && !vs.has(b.siteId))) return; const tgt = b.siteId && sites[b.siteId] ? sites[b.siteId].name+' · '+b.meal : 'general kitchen use';
      out.push({ id:'wf:issue:'+k, ts:b.ts, k:'wf', icon:'📤', lvl:'amber', loud:true, by:b.by, title:'Raw material issued — '+tgt, text:b.n+' item'+(b.n>1?'s':'')+' by '+(b.by||'Store Keeper')+' · check the Production tab', go:'prod' }); });
  }
  return out.filter(e=>e.by!==me.name || false);
}

/* ---------- loud alarm: siren + vibration + "Got it" screen ---------- */
let actx = null, alarmTimer = null, alarmItems = [], alarmStart = 0;
function audioCtx(){ try{ if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); if (actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
['click','touchstart','keydown'].forEach(n=>document.addEventListener(n, ()=>audioCtx(), {capture:true, passive:true}));
function sirenOnce(){
  const c = audioCtx(); try{ if (navigator.vibrate) navigator.vibrate([700,150,700,150,700,150,700,150,700]); }catch(e){}
  if (!c) return;
  const t0 = c.currentTime, g = c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.95,t0+0.05); g.gain.setValueAtTime(0.95,t0+3.4); g.gain.exponentialRampToValueAtTime(0.0001,t0+3.6);
  const comp = c.createDynamicsCompressor(); g.connect(comp); comp.connect(c.destination);
  [['square',0],['sawtooth',0]].forEach(([type,off])=>{ const o = c.createOscillator(); o.type = type; for (let i=0;i<9;i++) o.frequency.setValueAtTime(i%2?740:1180, t0+i*0.4); o.connect(g); o.start(t0); o.stop(t0+3.6); });
}
function alarmBox(){ let b = document.getElementById('alarmBox'); if (!b){ b = document.createElement('div'); b.id = 'alarmBox'; document.body.appendChild(b); } return b; }
function alarmStop(){ if (alarmTimer){ clearInterval(alarmTimer); alarmTimer = null; } alarmItems = []; const b = document.getElementById('alarmBox'); if (b) b.classList.remove('show'); try{ if (navigator.vibrate) navigator.vibrate(0); }catch(e){} }
function alarmPaint(){
  const b = alarmBox(); const it = alarmItems.slice(0,4);
  b.innerHTML = `<div class="ab-card"><div class="ab-ic">🔔</div><h3>${alarmItems.length>1?alarmItems.length+' urgent updates':'Urgent update'}</h3>
    ${it.map(x=>`<div class="ab-row"><b>${esc(x.icon)} ${esc(x.title)}</b><div>${esc(x.text||'')}</div></div>`).join('')}
    <div class="two" style="margin-top:12px"><button class="btn" id="abOpen">Open</button><button class="btn sec" id="abOk">✔ Got it</button></div></div>`;
  b.classList.add('show');
  $('abOk').onclick = alarmStop;
  $('abOpen').onclick = ()=>{ const g = alarmItems[0] && alarmItems[0].go; alarmStop(); if (g && can(g)) go(g); };
}
function alarmRing(items){
  alarmItems = items.concat(alarmItems).slice(0,10); alarmPaint(); sirenOnce(); alarmStart = Date.now();
  if (!alarmTimer) alarmTimer = setInterval(()=>{ if (Date.now()-alarmStart > 90000){ alarmStop(); return; } sirenOnce(); }, 7000);
}
document.addEventListener('visibilitychange', ()=>{ if (!document.hidden && me) { try{ updateBell(); }catch(e){} } });

/* ---------- never leave a screen stale after typing finishes ---------- */
let ptrDown = false;
document.addEventListener('pointerdown', ()=>{ ptrDown = true; }, true);
document.addEventListener('pointerup', ()=>{ ptrDown = false; }, true);
document.addEventListener('pointercancel', ()=>{ ptrDown = false; }, true);
document.addEventListener('focusout', ()=>{
  if (!skippedRender) return;
  setTimeout(()=>{ if (!skippedRender || ptrDown || !me) return; const a = document.activeElement; if (a && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return; skippedRender = false; try{ renderAll(); }catch(e){} }, 700);
});
setInterval(()=>{ if (me && skippedRender && !ptrDown){ const a = document.activeElement; if (!(a && /INPUT|SELECT|TEXTAREA/.test(a.tagName))){ skippedRender = false; try{ renderAll(); }catch(e){} } } }, 4000);

const saved = (function(){ try{ return JSON.parse(store.getItem('prod_user')||'null'); }catch(e){ return null; } })();
if (saved && ROLES[saved.role]){ me = saved; enter(); }
</script>
