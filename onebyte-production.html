<title>OneByte Production</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --brand:#015B36; --brand-dark:#014228; --gold:#F59E0B; --ink:#0F2A1B; --paper:#FAFAF7; --card:#FFFFFF;
    --green:#1B6B34; --green-dark:#0B3D20; --orange:#F4791E;
    --line:#E4E7E1; --muted:#7C8579; --red:#A23B2E; --amber:#B9822E; --amber-soft:#FBEFDD; --ok-soft:#E4F2E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Segoe UI','Noto Sans',system-ui,sans-serif;}
  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;background:radial-gradient(circle at 50% 0%,#02764a 0,var(--brand) 45%,var(--brand-dark) 100%);color:#fff;}
  #lock .wide{width:min(320px,82vw);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.28);}
  #lock h1{font-size:20px;margin:6px 0 0;letter-spacing:.3px;} #lock p{color:#CFE8D8;font-size:13.5px;margin:0;text-align:center;}
  .ksbadge{background:#fff;border-radius:16px;padding:8px 18px;box-shadow:0 6px 20px rgba(0,0,0,.22);} .ksbadge img{display:block;width:150px;height:auto;}
  .ksfoot{text-align:center;margin:22px 0 4px;color:var(--muted);font-size:11.5px;} .ksfoot img{width:110px;display:block;margin:0 auto 4px;opacity:.95;}
  .internal{display:flex;gap:9px;align-items:flex-start;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;max-width:320px;font-size:12px;line-height:1.45;color:#EAF6EE;}
  .internal b{color:var(--gold);}
  #lock .btn{background:var(--gold);color:#1b1200;}
  #pinErr{color:#FFB4A8!important;}
  #pin,#uname{font-size:17px;text-align:center;padding:13px;width:240px;max-width:80vw;border:1.5px solid rgba(255,255,255,.3);border-radius:12px;outline:none;background:rgba(255,255,255,.95);}
  #pin:focus,#uname:focus{border-color:var(--gold);}
  .btn{background:var(--green);color:#fff;border:none;padding:13px 28px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;}
  .btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
  .btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--line);}
  #pinErr{color:var(--red);font-size:13px;min-height:16px;}
  #app{display:none;max-width:680px;margin:0 auto;padding-bottom:84px;}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--brand);color:#fff;position:sticky;top:0;z-index:10;}
  header img{width:40px;height:40px;border-radius:10px;}
  header .t{display:flex;flex-direction:column;line-height:1.2;} header .t b{font-size:16px;} header .t span{font-size:12px;color:#CFE8D8;}
  header .out{margin-left:auto;background:rgba(255,255,255,.14);border:none;color:#fff;font-size:12.5px;cursor:pointer;padding:7px 12px;border-radius:99px;}
  .strip{background:var(--amber-soft);color:#7A5516;font-size:11.5px;text-align:center;padding:5px 10px;border-bottom:1px solid #EBD6AE;}
  .hero{border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--brand);}
  .hero svg{display:block;width:100%;height:auto;}
  .hero .cap{padding:8px 12px 10px;color:#CFE8D8;font-size:12px;display:flex;justify-content:space-between;gap:8px;}
  .steam{animation:rise 2.6s ease-in infinite;} .steam.b{animation-delay:1.1s;}
  @keyframes rise{0%{transform:translateY(5px);opacity:0}30%{opacity:.95}100%{transform:translateY(-13px);opacity:0}}
  .truck{animation:drive 9s ease-in-out infinite;}
  @keyframes drive{0%{transform:translateX(0);opacity:0}8%{opacity:1}82%{transform:translateX(150px);opacity:1}100%{transform:translateX(150px);opacity:0}}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .road{stroke-dasharray:8 8;animation:dash 1s linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-16}}
  @media (prefers-reduced-motion:reduce){.steam,.truck,.wheel,.road{animation:none!important}.truck{opacity:1;transform:translateX(70px)}}
  .flow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;}
  .stg{flex:0 0 auto;text-align:center;font-size:11px;padding:8px 9px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);background:#fff;min-width:66px;}
  .stg i{display:block;font-style:normal;font-size:19px;margin-bottom:2px;filter:grayscale(1);opacity:.6;}
  .stg.live{border:1.5px solid var(--green);color:var(--green);background:var(--ok-soft);font-weight:700;} .stg.live i{filter:none;opacity:1;}
  .notice{border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;}
  .notice.alert{background:#FBE6E3;border:1px solid #EBB9B2;} .notice.note{background:var(--amber-soft);border:1px solid #EBD6AE;} .notice.info{background:var(--ok-soft);border:1px solid #BFDCC8;}
  .notice .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;} .kpi .card{margin:0;} .kpi .n{font-size:26px;font-weight:800;line-height:1.1;}
  .page{display:none;padding:14px 18px;} .page.active{display:block;}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom);}
  nav button{flex:1;border:none;background:none;padding:9px 2px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
  nav button .i{font-size:19px;} nav button.active{color:var(--green);font-weight:700;}
  h2{font-size:15px;margin:18px 0 8px;} h2:first-child{margin-top:0;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px;}
  .row{display:flex;align-items:center;gap:10px;} .grow{flex:1;min-width:0;}
  .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .qty{font-weight:800;font-size:17px;text-align:right;white-space:nowrap;} .qty small{font-weight:600;color:var(--muted);font-size:11px;}
  .low{background:var(--amber-soft);border-color:#E9CFA0;} .low .qty{color:var(--amber);}
  .neg .qty{color:var(--red);}
  label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--green);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .save{width:100%;margin-top:14px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
  .chip{padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);font-size:12.5px;font-weight:600;color:var(--muted);background:#fff;cursor:pointer;}
  .chip.active{background:var(--green);border-color:var(--green);color:#fff;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 8px;}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--ok-soft);color:var(--green);margin-left:6px;vertical-align:middle;}
  .actions{display:flex;gap:8px;margin-top:10px;} .actions button{flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:13px;cursor:pointer;}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;}
  .toast.show{opacity:1;}
  .soon{background:#fff;border:1.5px dashed var(--line);border-radius:13px;padding:16px;color:var(--muted);font-size:13px;margin-bottom:10px;}
  @media print{ header,nav,.toast,#r_out~*,.card:has(#r_type),.two,.sub{display:none!important} .page{display:none!important} #p-reports{display:block!important} #p-reports .two,#p-reports>.card:first-child{display:none!important} }
</style>
</head>

<script>
/* ============ CONFIG ============ */
const FIREBASE_CONFIG = {

};
const SETUP_PIN = "1234"; // works only until the first Admin user is created
const P = 'prod_'; // all data of this module lives under prod_* in Firebase, separate from the old sales data

const ROLES = {
  admin:       { label:'Admin',              desc:'Everything, all counters', tabs:['home','stock','purchase','issue','plan','meals','reports','trends','masters','users'] },
  prodmanager: { label:'Production Manager', desc:'Stock, purchase, masters, QC',  tabs:['home','stock','purchase','issue','plan','meals','masters'] },
  store:       { label:'Store Keeper',       desc:'Purchase, daily issue & stock', tabs:['home','stock','purchase','issue','plan'] },
  kitchen:     { label:'Kitchen',            desc:'Daily issue & stock',         tabs:['home','stock','issue','plan','meals'] },
  driver:      { label:'Driver',             desc:'Trips',                         tabs:['home','meals'] },
  supervisor:  { label:'Site Supervisor',    desc:'Trips & receiving, own counter',tabs:['home','meals'], site:true },
  counter:     { label:'Counter Staff',      desc:'Loading & weighing, own counter',tabs:['home','meals'], site:true }

const NAV = { home:['🏠','Home'], stock:['📦','Stock'], purchase:['🛒','Purchase'], issue:['📤','Issue'], plan:['🗓️','Plan'], meals:['🍳','Meals'], reports:['📄','Reports'], trends:['📈','Trends'], masters:['⚙️','Masters'], users:['👥','Users'] };

const UNITS = ['kg','g','L','ml','nos','pack','box','bunch','pkt'];

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function num(v){ const n = parseFloat(v); return isFinite(n) ? n : NaN; }
function fmt(n){ return (Math.round(n*1000)/1000).toString(); }
function todayKey(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const store = (function(){ try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return localStorage; }catch(e){ return sessionStorage; } })();

/* ============ STATE ============ */
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
let me = null;
let users = {}, sites = {}, items = {}, basins = {}, ledger = {}, notices = {}, sessions = {}, settings = {}, recipes = {};
let stockFilter = 'all', stockSearch = '';

function can(tab){
  if (!me || !ROLES[me.role]) return false;
  if (tab==='reports' || tab==='trends') return me.role==='admin' || !!(me.perms && me.perms.reports);
  return ROLES[me.role].tabs.includes(tab);
}
function tabsFor(){
  const t = ROLES[me.role].tabs.filter(x=>can(x));
  ['reports','trends'].forEach(k=>{
    if (can(k) && !t.includes(k)){ let i = Math.max(t.indexOf('meals'), t.indexOf('reports'), t.indexOf('issue')); t.splice(i>=0?i+1:t.length, 0, k); }
  });
  return t;
}
function isAdmin(){ return me && me.role==='admin'; }

/* ============ LOGIN ============ */
function login(){
  const uname = ($('uname').value||'').trim().toLowerCase(), entered = $('pin').value.trim();
  db.ref(P+'users').once('value').then(snap=>{
    const u = snap.val() || {};
    let m = null;
    Object.entries(u).forEach(([id,x])=>{
      if (!ROLES[x.role]) return;
      const pw = x.password || x.pin;
      if (pw===entered && ((x.username||'').toLowerCase()===uname || (!uname && !x.username))) m = Object.assign({id},x);
    });
    if (!m && Object.keys(u).length===0 && entered===SETUP_PIN && (!uname || uname==='admin')) m = { id:'setup', name:'Setup Admin', role:'admin', siteId:'all' };
    if (m){ me = m; try{ store.setItem('prod_user', JSON.stringify(m)); }catch(e){} enter(); }
    else { $('pinErr').textContent = 'Wrong username or password'; $('pin').value=''; }
  }).catch(()=>{ $('pinErr').textContent = 'No internet — try again'; });
}
function logout(){ try{ store.removeItem('prod_user'); }catch(e){} location.reload(); }
$('unlockBtn').onclick = login;
$('uname').addEventListener('keydown', e=>{ if(e.key==='Enter') $('pin').focus(); });
$('pin').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
$('lockBtn').onclick = logout;

function enter(){
  $('lock').style.display='none'; $('app').style.display='block'; $('nav').style.display='flex';
  buildNav();
  listen();
  go(tabsFor()[0]);
  // revoked users get signed out on next open
  if (me.id!=='setup') db.ref(P+'users/'+me.id).once('value').then(s=>{ if(!s.exists()){ toast('Login removed'); setTimeout(logout,800);} });
}
let navKey = '';
function buildNav(active){
  const r = ROLES[me.role], tabs = tabsFor();
  $('who').textContent = me.name + ' · ' + r.label;
  navKey = tabs.join(',');
  const cur = active || tabs[0];
  $('nav').innerHTML = tabs.map(t=>`<button data-t="${t}" class="${t===cur?'active':''}"><span class="i">${NAV[t][0]}</span>${NAV[t][1]}</button>`).join('');
  $('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
}
function go(t){
  if (!can(t)) return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('p-'+t).classList.add('active');
  $('nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active', b.dataset.t===t));
  renderAll();
}
const saved = (function(){ try{ return JSON.parse(store.getItem('prod_user')||'null'); }catch(e){ return null; } })();
if (saved && ROLES[saved.role]){ me = saved; enter(); }

/* ============ LIVE DATA ============ */
function listen(){
  const bind = (path, assign) => db.ref(P+path).on('value', s=>{ assign(s.val()||{}); renderAll(); });
  bind('users',  v=>{ users=v;
    if (me && me.id!=='setup' && users[me.id]){
      const u = users[me.id];
      me = Object.assign({id:me.id}, u);
      try{ store.setItem('prod_user', JSON.stringify(me)); }catch(e){}
      if (tabsFor().join(',')!==navKey){ const a=document.querySelector('.page.active'); buildNav(a && a.id.slice(2)); }
    }
  });
  bind('sites',  v=>sites=v);
  bind('items',  v=>items=v);
  bind('basins', v=>basins=v);
  bind('notices', v=>notices=v);
  bind('settings', v=>settings=v);
  bind('recipes', v=>recipes=v);
  db.ref(P+'sessions').limitToLast(600).on('value', s=>{ sessions = s.val()||{}; renderAll(); });
  db.ref(P+'ledger').limitToLast(30000).on('value', s=>{ ledger = s.val()||{}; renderAll(); });
}
function stockOf(itemId){
  let t = 0; Object.values(ledger).forEach(e=>{ if (e.itemId===itemId) t += (e.qty||0); });
  return t;
}
function renderAll(){
  if (!me) return;
  if (can('home'))     renderHome();
  if (can('stock'))    renderStock();
  if (can('purchase')) renderPurchase();
  if (can('issue'))    renderIssue();
  if (can('plan'))     renderPlan();
  if (can('meals'))    renderMeals();
  resumeTracking();
  if (can('reports'))  renderReports();
  if (can('trends'))   renderTrends();
  if (can('masters'))  renderMasters();
  if (can('users'))    renderUsers();
}

/* ============ STOCK ============ */
function usedOn(itemId, date){
  let t = 0; Object.values(ledger).forEach(e=>{ if (e.itemId===itemId && e.date===date && e.type==='issue' && !e.reversed) t += -(e.qty||0); });
  return t;
}
function renderStock(){
  const types = [['all','All'],['raw','Raw materials'],['food','Cooked food']];
  const q = stockSearch.toLowerCase();
  const rows = Object.entries(items)
    .filter(([,i])=>i.active!==false && (stockFilter==='all'||i.type===stockFilter) && (!q || i.name.toLowerCase().includes(q)))
    .sort((a,b)=>a[1].name.localeCompare(b[1].name));
  $('p-stock').innerHTML = `
    <div class="chips">${types.map(([k,l])=>`<div class="chip ${stockFilter===k?'active':''}" data-f="${k}">${l}</div>`).join('')}</div>
    <input id="stockSearch" placeholder="Search item…" value="${esc(stockSearch)}" style="margin-bottom:10px;">
    ${rows.length ? rows.map(([id,i])=>{
      const s = stockOf(id), low = i.type==='raw' && i.minStock>0 && s<=i.minStock, neg = s<0;
      const used = usedOn(id, todayKey());
      return `<div class="card row ${neg?'neg':low?'low':''}"><div class="grow"><b>${esc(i.name)}</b><div class="sub">${esc(i.category||'')}${used>0?' · used today '+fmt(used)+' '+esc(i.unit):''}${low?' · below minimum':''}${neg?' · negative — check entries':''}</div></div><div class="qty">${fmt(s)} <small>${esc(i.unit)}</small></div></div>`;
    }).join('') : `<div class="empty">No items yet. ${can('masters')?'Add them in Masters.':'Ask the Production Manager to add items.'}</div>`}
    ${can('reports') ? `<div class="two" style="margin-top:6px"><button class="btn" id="stShare">Share stock on WhatsApp</button><button class="btn sec" id="stRep">Open reports</button></div>` : ''}
    ${can('purchase') ? `<h2>Recent stock movements</h2>` + recentLedger() : ''}`;
  const sh=$('stShare'); if (sh) sh.onclick=()=>{ const r=buildReport(Object.assign({}, rep0(), {type:'stock', from:todayKey(), to:todayKey()})); shareWhatsApp(r.text); };
  const sr=$('stRep'); if (sr) sr.onclick=()=>go('reports');
  $('p-stock').querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{ stockFilter=c.dataset.f; renderStock(); });
  const ss = $('stockSearch'); ss.oninput = ()=>{ stockSearch=ss.value; const pos=ss.selectionStart; renderStock(); const n=$('stockSearch'); n.focus(); n.setSelectionRange(pos,pos); };
}
function recentLedger(n){
  const e = Object.entries(ledger).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0)).slice(0,n||15);
  if (!e.length) return '<div class="empty">No movements yet.</div>';
  return e.map(([,x])=>{
    const it = items[x.itemId]||{name:'(deleted item)',unit:''};
    const d = new Date(x.ts||0);
    return `<div class="card row"><div class="grow"><b>${esc(it.name)}</b><div class="sub">${esc(x.type)}${x.supplier?' · '+esc(x.supplier):''}${x.expiry?' · exp '+esc(x.expiry):''}${x.lot?' · lot '+esc(x.lot):''} · ${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${esc(x.by||'')}</div></div><div class="qty" style="color:${x.qty<0?'var(--red)':'var(--green)'}">${x.qty>0?'+':''}${fmt(x.qty)} <small>${esc(it.unit)}</small></div></div>`;
  }).join('');
}

/* ============ PURCHASE ============ */
function renderPurchase(){
  const raws = Object.entries(items).filter(([,i])=>i.active!==false && i.type==='raw').sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const el = $('p-purchase');
  const keep = { item: el.querySelector('#pu_item') && el.querySelector('#pu_item').value };
  if (el.querySelector('#pu_qty') && document.activeElement && el.contains(document.activeElement)) return; // don't wipe a form being typed in
  el.innerHTML = `
    <h2>Record purchase (goods received)</h2>
    ${raws.length ? `<div class="card">
      <label>Item</label>

function addLedger(e){
  e.ts = Date.now(); e.date = todayKey(); e.by = me.name; e.byId = me.id;
  return db.ref(P+'ledger').push(e);
}
function savePurchase(){
  const itemId = $('pu_item').value, qty = num($('pu_qty').value), rate = num($('pu_rate').value);
  if (!(qty>0)) { alert('Enter a quantity greater than 0.'); return; }
  addLedger({ itemId, type:'purchase', qty, rate: isFinite(rate)?rate:null, supplier:$('pu_sup').value.trim(), expiry:$('pu_exp').value||null, lot:$('pu_batch').value.trim()||null, note:$('pu_note').value.trim() })
    .then(()=>{ toast('Added to stock'); $('pu_qty').value=''; $('pu_rate').value=''; $('pu_note').value=''; });

function saveAdjust(){
  const itemId = $('ad_item').value, counted = num($('ad_qty').value);
  if (!(counted>=0)) { alert('Enter the counted quantity.'); return; }
  const diff = counted - stockOf(itemId);
  if (Math.abs(diff) < 0.0005) { toast('Already matches'); return; }
  addLedger({ itemId, type:'adjust', qty:diff, note:$('ad_note').value.trim() || 'stock count' })
    .then(()=>{ toast('Stock corrected'); $('ad_qty').value=''; });
}

    ${todays.length ? todays.map(([id,e])=>{ const it=items[e.itemId]||{name:'(deleted)',unit:''}; const d=new Date(e.ts||0);
      const tgt = e.siteId && sites[e.siteId] ? sites[e.siteId].name+' '+e.meal : 'General';
      return `<div class="card row"><div class="grow"><b>${esc(it.name)}</b><div class="sub">${esc(tgt)} · ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${esc(e.by||'')}${e.note?' · '+esc(e.note):''}</div></div>
      <div class="qty">${fmt(-e.qty)} <small>${esc(it.unit)}</small></div>${e.reversed?'<span class="tag" style="background:#eee;color:#777">reversed</span>':(can('masters')||me.role==='store')?`<button class="btn danger" data-rev="${id}" style="padding:7px 10px;font-size:12px">Undo</button>`:''}</div>`;
    }).join('') : '<div class="empty">Nothing issued yet today.</div>'}`;

  sel('.is_qty', x=>x.oninput=()=>{ issueRows[+x.dataset.n].qty = x.value; });
  sel('[data-rm]', b=>b.onclick=()=>{ issueRows.splice(+b.dataset.rm,1); renderIssue(); });
  sel('[data-rev]', b=>b.onclick=()=>reverseIssue(b.dataset.rev));
  const add=$('is_add'); if (add) add.onclick=()=>{ issueFor=$('is_for').value; issueNote=$('is_note').value; issueRows.push({itemId:'',qty:''}); renderIssue(); };
  const sv=$('is_save'); if (sv) sv.onclick=saveIssue;

function saveIssue(){
  issueFor = $('is_for').value; issueNote = $('is_note').value.trim();
  const lines = issueRows.filter(r=>r.itemId || r.qty!=='');
  if (!lines.length){ alert('Add at least one item.'); return; }
  const need = {};
  for (const r of lines){
    const q = num(r.qty);
    if (!r.itemId || !(q>0)){ alert('Each line needs an item and a quantity above 0.'); return; }
    need[r.itemId] = (need[r.itemId]||0) + q;
  }
  const short = Object.entries(need).filter(([id,q])=>q > stockOf(id)+0.0005);
  if (short.length && !confirm('Not enough stock for: ' + short.map(([id,q])=>items[id].name+' (have '+fmt(stockOf(id))+' '+items[id].unit+', issuing '+fmt(q)+')').join(', ') + '.\n\nIssue anyway?')) return;
  const [siteId, meal] = issueFor ? issueFor.split('|') : ['',''];
  const batch = db.ref(P+'ledger').push().key;
  Promise.all(Object.entries(need).map(([itemId,q])=>
    addLedger({ itemId, type:'issue', qty:-q, siteId:siteId||null, meal:meal||null, note:issueNote, batch })
  )).then(()=>{ toast('Issued to kitchen'); issueRows=[{itemId:'',qty:''}]; issueNote=''; renderIssue(); });
}
function reverseIssue(id){
  const e = ledger[id]; if (!e || e.reversed) return;
  if (!confirm('Undo this issue and put '+fmt(-e.qty)+' '+(items[e.itemId]||{}).unit+' '+(items[e.itemId]||{}).name+' back in stock?')) return;
  addLedger({ itemId:e.itemId, type:'issue-reversal', qty:-e.qty, siteId:e.siteId||null, meal:e.meal||null, note:'undo of issue', ref:id })
    .then(()=>db.ref(P+'ledger/'+id+'/reversed').set(true)).then(()=>toast('Issue reversed'));
}

/* ============ MEAL SESSIONS (production → dispatch → arrival → counter → sales/waste) ============ */
const REASONS = ['Unsold leftover','Spoilage','Spill / damage','Quality reject','Over-production','Other'];
const STEP_ROLES = {
  prod:['admin','prodmanager','kitchen'], qc1:['admin','prodmanager'],
  dispatch:['admin','prodmanager','kitchen'], depart:['admin','prodmanager','kitchen','driver'],
  arrive:['admin','prodmanager','driver','supervisor','counter'],
  qc2:['admin','prodmanager','supervisor','counter'], weigh:['admin','prodmanager','supervisor','counter'],
  close:['admin','prodmanager','supervisor','counter'], send:['admin','prodmanager','kitchen','driver','supervisor','counter']
};
const canStep = k => me && STEP_ROLES[k].includes(me.role);
let mDate = todayKey(), openSid = null, tracker = null;

const sidOf = (d,site,meal) => d+'_'+site+'_'+meal;
const hm = ts => ts ? new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '—';
function dur(a,b){ if(!a||!b) return '—'; const m = Math.round((b-a)/60000); return m>=60 ? Math.floor(m/60)+'h '+(m%60)+'m' : m+' min'; }
function visibleSites(){
  const all = Object.entries(sites);
  const r = ROLES[me.role];
  return r && r.site ? all.filter(([k])=>k===me.siteId) : all;
}
const T = (s,k) => s && s.times && s.times[k];
const MEAL_STAGES = [['prodDone','Cooked'],['qc1','QC'],['packed','Packed'],['loaded','Loaded'],['departed','Departed'],['arrived','Arrived'],['qc2','Arrival QC'],['counterLoaded','At counter'],['closed','Closed']];
function stageOf(s){
  if (!s) return { n:0, label:'Not started' };
  let n = 0, label = 'Not started';
  MEAL_STAGES.forEach(([k,l],i)=>{ const v = k==='qc1' ? (s.qc1&&s.qc1.ts) : k==='qc2' ? (s.qc2&&s.qc2.ts) : T(s,k); if (v){ n=i+1; label=l; } });
  return { n, label };
}
function sessionCalc(s){
  const tol = (settings.tolerance||3);
  const out = {}; const ids = new Set();
  Object.keys((s&&s.items)||{}).forEach(k=>ids.add(k));
  Object.keys((s&&s.weights)||{}).forEach(k=>ids.add(k));
  Object.keys((s&&s.close)||{}).forEach(k=>ids.add(k));
  ids.forEach(id=>{
    const it = (s.items||{})[id]||{}, c = (s.close||{})[id]||{};
    const loaded = Object.values((s.weights||{})[id]||{}).reduce((a,w)=>a+(w.net||0),0);
    const prepared = it.prepared||0, sold = c.sold||0, left = c.leftover||0, waste = c.waste||0;
    const hasClose = (s.close||{})[id]!=null;
    const variance = hasClose ? loaded - sold - left - waste : null;
    const pct = hasClose && loaded>0 ? variance/loaded*100 : null;
    out[id] = { prepared, loaded, sold, left, waste, reason:c.reason||'', soldPlates:c.soldPlates||null, variance, pct, flag: pct!=null && Math.abs(pct)>tol, transit: prepared>0 && loaded>0 ? prepared-loaded : null };
  });
  return out;
}

function lastStamp(s){

    };

  });

  // 3 dispatch
  const bp = $('btnPacked'); if (bp) bp.onclick = ()=>{ if (!(s.qc1&&s.qc1.ok) && !confirm('Production QC has not passed yet. Mark packed anyway?')) return; stamp('packed'); };
  const bl = $('btnLoaded'); if (bl) bl.onclick = ()=>stamp('loaded');

  // 4 trip
  const withLoc = cb => { if (!navigator.geolocation) return cb(null); navigator.geolocation.getCurrentPosition(p=>cb({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6)}), ()=>cb(null), {timeout:6000, maximumAge:30000}); };
  const bd = $('btnDepart'); if (bd) bd.onclick = ()=>{ withLoc(loc=>{ db.ref(P+'sessions/'+sid).update({ date, siteId, meal, vehicle:$('veh').value.trim(), driver:$('drv').value.trim(), ['times/departed']: {ts:Date.now(), by:me.name, loc:loc||null} }).then(()=>{ if (loc) startTracking(sid); }); }); };

  q('[data-addw]', b=>b.onclick=()=>{ const id=b.dataset.addw; const isN = (items[id]||{}).unit==='nos'; const wbEl = el.querySelector('.wb[data-id="'+id+'"]'); const bs = isN ? 'count' : wbEl.value, g = num(el.querySelector('.wg[data-id="'+id+'"]').value);

    if (!bs){ alert('Choose the basin.'); return; } if (!(g>0)){ alert('Enter the scale reading in kg.'); return; }
    const tare = basins[bs].tare||0, net = Math.round((g-tare)*1000)/1000; if (net<=0){ alert('Scale reading is not more than the basin weight ('+fmt(tare)+' kg).'); return; }
    base().then(()=>db.ref(P+'sessions/'+sid+'/weights/'+id).push({ basinId:bs, basinName:basins[bs].name, gross:g, tare, net, ts:Date.now(), by:me.name })); });
  q('[data-rmw]', a=>a.onclick=e=>{ e.preventDefault(); const [id,wid]=a.dataset.rmw.split('|'); db.ref(P+'sessions/'+sid+'/weights/'+id+'/'+wid).remove(); });
  const bc = $('btnCounter'); if (bc) bc.onclick = ()=>{ if (!Object.keys(s.weights||{}).length){ alert('Weigh at least one dish into the counter first.'); return; } if (!(s.qc2&&s.qc2.ts) && !confirm('Arrival QC is not recorded. Continue?')) return; stamp('counterLoaded'); };

  // 7 close
  const collect = () => { const ups = {}; dishIds.forEach(id=>{ const d = items[id]||{}; const plate = d.portionG>0;
      const sv = num(el.querySelector('.cs[data-id="'+id+'"]').value), lv = num(el.querySelector('.cl[data-id="'+id+'"]').value), wv = num(el.querySelector('.cw[data-id="'+id+'"]').value);

  const bcl = $('btnClose'); if (bcl) bcl.onclick = ()=>{ const ups = collect(); const bad = Object.entries(ups).filter(([,v])=>v.waste>0&&!v.reason); if (bad.length){ alert('Add a reason for every wastage entry.'); return; }

  // report
  const rp = () => buildReport({ type:'meals', from:date, to:date, site:siteId, meal, cat:'', item:'' });
  const logSend = () => db.ref(P+'sessions/'+sid).update({ sentAt:Date.now(), sentBy:me.name });
  const w = $('rWA'); if (w) w.onclick = ()=>{ const t = rp().text; logSend(); const url='https://wa.me/?text='+encodeURIComponent(t); const x=window.open(url,'_blank'); if(!x) location.href=url; };
  const m = $('rMail'); if (m) m.onclick = ()=>{ const r = rp(); logSend(); location.href = 'mailto:'+encodeURIComponent((settings.reportEmails||'').replace(/\s/g,''))+'?subject='+encodeURIComponent('OneByte '+r.title+' '+site.name+' '+meal+' '+date)+'&body='+encodeURIComponent(r.text.replace(/\*/g,'')); };
  const cp = $('rCopy'); if (cp) cp.onclick = ()=>copyText(rp().text);
  const cv = $('rCsv'); if (cv) cv.onclick = ()=>downloadCsv(rp());

/* live location: native background service when the Android plugin exists, else the browser (screen must stay open) */
let nativeWatcher = null, trackSid = null;
function startTracking(sid){
  if (tracker) return;
  const BG = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BackgroundGeolocation;
  let last = 0; trackSid = sid;
  const post = (lat,lng) => { const now = Date.now(); if (now-last < 30000) return; last = now;
    const pt = { lat:+lat.toFixed(6), lng:+lng.toFixed(6), ts:now, bg:!!BG };
    db.ref(P+'sessions/'+sid+'/trackLast').set(pt); db.ref(P+'trips/'+sid).push(pt); };
  if (BG && BG.addWatcher){
    tracker = 'native';
    BG.addWatcher({ backgroundTitle:'Trip in progress', backgroundMessage:'OneByte is sharing this trip with the kitchen team', requestPermissions:true, stale:false, distanceFilter:25 },
      (loc, err) => { if (err){ if (err.code==='NOT_AUTHORIZED' && BG.openSettings) BG.openSettings(); return; } post(loc.latitude, loc.longitude); })
      .then(id => { nativeWatcher = id; });
    toast('Live tracking on (works with screen off)'); return;
  }
  if (!navigator.geolocation) return;
  tracker = navigator.geolocation.watchPosition(p=>post(p.coords.latitude, p.coords.longitude), ()=>{}, {enableHighAccuracy:true, maximumAge:10000});
  toast('Sharing live location (keep this screen open)');
}
function stopTracking(){
  if (tracker==='native'){ const BG = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.BackgroundGeolocation; if (BG && nativeWatcher!=null) BG.removeWatcher({id:nativeWatcher}); nativeWatcher = null; }
  else if (tracker!=null && navigator.geolocation){ navigator.geolocation.clearWatch(tracker); }
  tracker = null; trackSid = null;
}
/* a driver who re-opens the app during a trip gets tracking switched back on automatically */
function resumeTracking(){
  if (!me || me.role!=='driver' || tracker) return;
  const t = todayKey();
  const e = Object.entries(sessions).find(([,x])=>x.date===t && T(x,'departed') && !T(x,'arrived') && (!x.driver || x.driver===me.name));
  if (e) startTracking(e[0]);
}
const lateMin = (date, hhmm, ts) => { if (!hhmm || !ts) return null; return Math.round((ts - new Date(date+'T'+hhmm+':00').getTime())/60000); };
/* vehicles currently on the road, with alerts */
function onRoad(){
  const t = todayKey(), now = Date.now(), stale = settings.staleMin||10, maxM = settings.tripMaxMin||90;
  return Object.entries(sessions).filter(([,x])=>x.date===t && T(x,'departed') && !T(x,'arrived')).map(([sid,x])=>{
    const dep = T(x,'departed').ts, en = Math.round((now-dep)/60000), ping = x.trackLast ? Math.round((now-x.trackLast.ts)/60000) : null;
    const alerts = [];
    if ((ping==null && en>stale) || (ping!=null && ping>stale)) alerts.push(ping==null ? 'No GPS signal received' : 'No GPS for '+ping+' min');
    if (en>maxM) alerts.push('Trip longer than '+maxM+' min');
    return { sid, x, en, ping, alerts, site:(sites[x.siteId]||{}).name||x.siteId };
  });
}
function roadHtml(){
  const r = onRoad(); if (!r.length) return '';
  return `<h2>🚚 Vehicles on the road</h2>` + r.map(v=>`<div class="card" data-trip="${v.sid}" style="cursor:pointer;${v.alerts.length?'border-color:#EBB9B2;background:#FDF3F1':''}">
    <div class="row"><div class="grow"><b>${esc(v.site)} — ${esc(v.x.meal)}</b><div class="sub">${esc(v.x.vehicle||'vehicle ?')} · ${esc(v.x.driver||'driver ?')} · left ${hm(T(v.x,'departed').ts)} · ${v.en} min on the road</div></div>

    ${v.alerts.map(a=>`<div style="color:var(--red);font-size:12.5px;font-weight:700;margin-top:5px">⚠ ${esc(a)}</div>`).join('')}</div>`).join('');
}

/* ============ PLAN (tomorrow's menu & quantities, kitchen requirement) ============ */
const keyOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function tomorrowKey(){ const d = new Date(); d.setDate(d.getDate()+1); return keyOf(d); }
let planSt = { date: tomorrowKey(), site:'', meal:'' }, planOv = {};
const roundQty = (v,unit) => unit==='nos' ? Math.ceil(v/5)*5 : Math.ceil(v*2)/2;
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;

function suggestFor(siteId, meal, dateKey){
  const w = new Date(dateKey+'T00:00:00').getDay();
  const nSamp = settings.samples || 6, buf = (settings.buffer!=null ? settings.buffer : 5)/100;
  const hist = Object.values(sessions).filter(x=>x.siteId===siteId && x.meal===meal && x.date && x.date<dateKey && x.close);
  const desc = (a,b) => b.date.localeCompare(a.date);
  const same = hist.filter(x=>new Date(x.date+'T00:00:00').getDay()===w).sort(desc).slice(0,nSamp);
  const use = same.length ? same : hist.slice().sort(desc).slice(0,nSamp);
  const per = {};
  use.forEach(x=>{ const calc = sessionCalc(x);
    Object.entries(calc).forEach(([id,k])=>{ if (!items[id] || !x.close[id]) return; const o = (per[id] = per[id]||{sold:[],waste:[],loaded:[],dates:[]}); o.sold.push(k.sold); o.waste.push(k.waste); o.loaded.push(k.loaded); o.dates.push(x.date); }); });
  const dishes = Object.entries(per).filter(([,o])=>o.sold.length/use.length >= 0.5).map(([id,o])=>{
    const a = avg(o.sold); const it = items[id];
    const trend = o.sold.length>=4 ? (()=>{ const r = avg(o.sold.slice(0,2)), p = avg(o.sold.slice(2)); return p>0 ? (r-p)/p*100 : 0; })() : null;
    const lw = sum0(o.loaded), wp = lw>0 ? sum0(o.waste)/lw*100 : 0;
    return { id, avg:a, sug: roundQty(a*(1+buf), it.unit), n:o.sold.length, trend, wastePct:wp };
  }).sort((a,b)=>b.avg-a.avg);
  return { dishes, n:use.length, basis: same.length ? 'same weekday' : (use.length?'all days (no '+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][w]+' history yet)':'') };
}
const sum0 = a => a.reduce((x,y)=>x+y,0);

function planModel(){
  const rows = [];   // {siteId, meal, label, sug, dishes:[{...,qty}]}
  visibleSites().forEach(([siteId,site])=>{
    MEALS.filter(m=>(site.meals||[]).includes(m) && (!planSt.site||planSt.site===siteId) && (!planSt.meal||planSt.meal===m)).forEach(meal=>{
      const sg = suggestFor(siteId, meal, planSt.date);
      const dishes = sg.dishes.map(d=>({ ...d, qty: planOv[siteId+'|'+meal+'|'+d.id] != null ? planOv[siteId+'|'+meal+'|'+d.id] : d.sug }));
      rows.push({ siteId, meal, label: site.name+' — '+meal, sg, dishes });
    });
  });
  // raw-material requirement
  const need = {}, missing = new Set();
  rows.forEach(r=>r.dishes.forEach(d=>{ const rc = recipes[d.id]; if (!rc || !rc.lines || !Object.keys(rc.lines).length){ if (d.qty>0) missing.add(items[d.id].name); return; }
    Object.entries(rc.lines).forEach(([raw,q])=>{ if (items[raw]) need[raw] = (need[raw]||0) + q*d.qty; }); }));
  const req = Object.entries(need).map(([id,n])=>({ id, item:items[id], need:n, stock:stockOf(id), buy:Math.max(0, n-stockOf(id)) })).sort((a,b)=>b.buy-a.buy||a.item.name.localeCompare(b.item.name));
  return { rows, req, missing:[...missing] };
}

function planReport(m){
  const wd = new Date(planSt.date+'T00:00:00').toLocaleDateString([], {weekday:'long', day:'numeric', month:'short'});
  const sections = m.rows.map(r=>({ h:r.label, cols:['Dish','Make','Unit','Avg sold','Based on'], rows:r.dishes.filter(d=>d.qty>0).map(d=>[items[d.id].name, fmt(d.qty), items[d.id].unit, fmt1(d.avg), d.n+' meals']),
    note:'No history yet.', line:x=>'• '+x[0]+': *'+x[1]+' '+x[2]+'*  (avg sold '+x[3]+')' }));
  sections.push({ h:'Raw material needed (from recipes)', cols:['Item','Need','In stock','To buy','Unit'], rows:m.req.map(q=>[q.item.name, fmt1(q.need), fmt1(q.stock), q.buy>0?fmt1(q.buy):'OK', q.item.unit]),
    note:'No recipes set up yet — add them in Masters → Recipes.', line:x=>'• '+x[0]+': need '+x[1]+' '+x[4]+' | stock '+x[2]+' | '+(x[3]==='OK'?'OK':'*BUY '+x[3]+'*') });
  if (m.missing.length) sections.push({ h:'Recipe missing for', cols:['Dish'], rows:m.missing.map(n=>[n]), line:x=>'• '+x[0] });
  const L = ['*OneByte Production — Plan for '+wd+'*'];
  sections.forEach(sec=>{ L.push('', '*'+sec.h+'*'); if (!sec.rows.length) L.push('_'+(sec.note||'—')+'_'); else sec.rows.forEach(r=>L.push(sec.line(r))); });
  L.push('', '_Suggested from past sales + '+(settings.buffer!=null?settings.buffer:5)+'% buffer · Internal — Kalyana Sapadu Production Unit_');
  return { title:'Production plan', period:planSt.date, filt:'', sections, text:L.join('\n') };
}

/* ============ REPORTS ============ */
const REPORT_TYPES = [['master','Daily master (lifecycle)'],['meals','Meal sheets — per meal / day / week'],['stock','Stock & usage'],['purchase','Purchases'],['issue','Kitchen issue']];
const rep0 = ()=>({ type:'master', from:todayKey(), to:todayKey(), site:'', meal:'', cat:'', item:'' });
let rep = rep0();
let lastReport = null;

function inRange(e){ return e.date && e.date>=rep.from && e.date<=rep.to; }
function sectionTable(h, cols, rows, note){ return { h, cols, rows, note }; }

function mealSections(R){
  const order = m => MEALS.indexOf(m);
  const list = Object.entries(sessions).map(([id,x])=>Object.assign({id},x)).filter(x=>x.date && x.date>=R.from && x.date<=R.to && (!R.site||x.siteId===R.site) && (!R.meal||x.meal===R.meal))
    .sort((a,b)=>a.date.localeCompare(b.date)||String(a.siteId).localeCompare(String(b.siteId))||order(a.meal)-order(b.meal));
  const sn = x => (sites[x.siteId]||{name:x.siteId}).name;
  const qcs = q => q&&q.ts ? (q.ok?'Pass':'FAIL') : '—';
  const hmL = (x,k,pk)=>{ const t = T(x,k)&&T(x,k).ts; if (!t) return '—'; const sc = (((sites[x.siteId]||{}).sched||{})[x.meal]||{})[pk]; const l = sc ? lateMin(x.date, sc, t) : null; return hm(t)+(l>0?' (+'+l+'m late)':''); };
  const pend = (h)=>({ h, cols:[], rows:[], note:'No meal sheets recorded for this period / filter yet.' });
  if (!list.length) return [pend('Meal timeline'), pend('Dish-wise production, sales & wastage')];
  const timeline = { h:'Meal timeline', cols:['Date','Counter','Meal','Cooked','QC','Packed','Loaded','Departed','Arrived','Trip','Arr. QC','At counter','Closed'],
    rows:list.map(x=>[x.date, sn(x), x.meal, hm(T(x,'prodDone')&&T(x,'prodDone').ts), qcs(x.qc1), hm(T(x,'packed')&&T(x,'packed').ts), hm(T(x,'loaded')&&T(x,'loaded').ts), hmL(x,'departed','depart'), hmL(x,'arrived','arrive'), dur(T(x,'departed')&&T(x,'departed').ts, T(x,'arrived')&&T(x,'arrived').ts), qcs(x.qc2), hm(T(x,'counterLoaded')&&T(x,'counterLoaded').ts), hm(T(x,'closed')&&T(x,'closed').ts)]),
    line:r=>'• '+r[1]+' '+r[2]+(r[0]!==R.from||R.from!==R.to?' ('+r[0]+')':'')+': cooked '+r[3]+' · QC '+r[4]+' · packed '+r[5]+' · loaded '+r[6]+' · departed '+r[7]+' · arrived '+r[8]+(r[9]!=='—'?' ('+r[9]+')':'')+' · arrival QC '+r[10]+' · at counter '+r[11]+' · closed '+r[12] };
  const vtxt = v => v==null ? '—' : Math.abs(v)<0.0005 ? '0' : v>0 ? fmt(v)+' short' : fmt(-v)+' excess';
  const dishRows = [], tot = {}, daily = {}, waste = {};
  list.forEach(x=>{
    const calc = sessionCalc(x);
    Object.entries(calc).forEach(([id,k])=>{
      if (R.item && R.item!==id) return;
      const it = items[id]||{name:'(deleted)',unit:''};
      dishRows.push({ r:[x.date, sn(x), x.meal, it.name, fmt(k.prepared), fmt(k.loaded), fmt(k.sold), fmt(k.left), fmt(k.waste), vtxt(k.variance)+(k.flag?' ⚠':''), it.unit], k });
      const t = tot[id] = tot[id]||{name:it.name,unit:it.unit,p:0,l:0,s:0,le:0,w:0,v:0,hasV:false}; t.p+=k.prepared; t.l+=k.loaded; t.s+=k.sold; t.le+=k.left; t.w+=k.waste; if (k.variance!=null){ t.v+=k.variance; t.hasV=true; }
      if (it.unit!=='nos'){ const d = daily[x.date] = daily[x.date]||{p:0,l:0,s:0,w:0,v:0}; d.p+=k.prepared; d.l+=k.loaded; d.s+=k.sold; d.w+=k.waste; if (k.variance!=null) d.v+=k.variance; }
      if (k.waste>0){ const key = (k.reason||'No reason')+'||'+it.name+'||'+it.unit; waste[key]=(waste[key]||0)+k.waste; }
    });
  });
  const dish = { h:'Dish-wise production, sales & wastage', cols:['Date','Counter','Meal','Dish','Made','At counter','Sold','Leftover','Wastage','Variance','Unit'], rows:dishRows.map(d=>d.r),
    line:r=>'• '+r[1]+' '+r[2]+(R.from!==R.to?' ('+r[0]+')':'')+' — '+r[3]+': made '+r[4]+' | counter '+r[5]+' | sold '+r[6]+' | left '+r[7]+' | waste '+r[8]+' | '+r[9]+' '+r[10] };
  const out = [timeline, dish];
  if (R.from!==R.to){
    out.push({ h:'Daily totals (kg / L — counted pieces excluded)', cols:['Date','Made','At counter','Sold','Wastage','Variance'], rows:Object.entries(daily).sort().map(([d,v])=>[d,fmt(v.p),fmt(v.l),fmt(v.s),fmt(v.w),vtxt(v.v)]),
      line:r=>'• '+r[0]+': made '+r[1]+' | counter '+r[2]+' | sold '+r[3]+' | waste '+r[4]+' | '+r[5] });
    out.push({ h:'Dish totals for the period', cols:['Dish','Unit','Made','At counter','Sold','Leftover','Wastage','Waste %','Variance'],
      rows:Object.values(tot).sort((a,b)=>b.s-a.s).map(t=>[t.name,t.unit,fmt(t.p),fmt(t.l),fmt(t.s),fmt(t.le),fmt(t.w), t.l>0?fmt(Math.round(t.w/t.l*1000)/10)+'%':'—', t.hasV?vtxt(t.v):'—']),
      line:r=>'• '+r[0]+': made '+r[2]+' | counter '+r[3]+' | sold '+r[4]+' | left '+r[5]+' | waste '+r[6]+' ('+r[7]+') '+r[1]+' | '+r[8] });
  }
  const wr = Object.entries(waste).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{ const [reason,name,unit]=k.split('||'); return [reason,name,fmt(v)+' '+unit]; });
  out.push({ h:'Wastage by reason', cols:['Reason','Dish','Quantity'], rows:wr, note:wr.length?'':'No wastage recorded.', line:r=>'• '+r[0]+' — '+r[1]+': '+r[2] });
  return out;
}
function buildReport(f){
  const R = f;
  const inR = e => e.date && e.date>=R.from && e.date<=R.to;
  const itemOk = ([id,i]) => i.type==='raw' && i.active!==false && (!R.cat || (i.category||'')===R.cat) && (!R.item || R.item===id);
  const rawItems = Object.entries(items).filter(itemOk).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const entries = Object.entries(ledger).map(([id,e])=>Object.assign({id},e));
  const sections = [];

  // 1. Stock & usage
  const stockRows = rawItems.map(([id,i])=>{
    let open=0, pur=0, used=0, adj=0;
    entries.forEach(e=>{
      if (e.itemId!==id) return;
      if (e.date < R.from) open += e.qty||0;
      else if (e.date <= R.to){
        if (e.type==='purchase') pur += e.qty;
        else if (e.type==='issue' || e.type==='issue-reversal') used += -e.qty;
        else adj += e.qty;
      }
    });
    const close = open + pur - used + adj;
    return [i.name, i.unit, fmt(open), fmt(pur), fmt(used), fmt(adj), fmt(close)+((i.minStock>0&&close<=i.minStock)?' ⚠ LOW':'')];
  });
  const stockSec = sectionTable('Raw material stock & usage', ['Item','Unit','Opening','Purchased','Used','Adjust','Closing'], stockRows, stockRows.length?'':'No raw materials match the filters.');

  // 2. Purchases
  const purEntries = entries.filter(e=>e.type==='purchase' && inR(e) && rawItems.some(([id])=>id===e.itemId)).sort((a,b)=>(a.ts||0)-(b.ts||0));
  let total = 0;
  const purRows = purEntries.map(e=>{ const it=items[e.itemId]; const amt = e.rate!=null ? e.qty*e.rate : null; if (amt!=null) total+=amt;
    return [e.date, it.name, fmt(e.qty)+' '+it.unit, e.rate!=null?'₹'+fmt(e.rate):'—', amt!=null?'₹'+fmt(amt):'—', e.supplier||'—', e.expiry||'—']; });
  if (purRows.length && purEntries.some(e=>e.rate!=null)) purRows.push(['','TOTAL','','','₹'+fmt(total),'','']);
  const purSec = sectionTable('Purchases (goods received)', ['Date','Item','Qty','Rate','Amount','Supplier','Expiry'], purRows, purRows.length?'':'No purchases in this period.');

  // 3. Kitchen issue by counter/meal
  const agg = {};
  entries.filter(e=>(e.type==='issue'||e.type==='issue-reversal') && inR(e) && rawItems.some(([id])=>id===e.itemId)
      && (!R.site || e.siteId===R.site) && (!R.meal || e.meal===R.meal)).forEach(e=>{
    const tgt = e.siteId && sites[e.siteId] ? sites[e.siteId].name+' — '+(e.meal||'') : 'General kitchen use';
    const k = tgt+'||'+e.itemId; agg[k] = (agg[k]||0) + (-e.qty);
  });
  const issRows = Object.entries(agg).filter(([,v])=>Math.abs(v)>0.0005).map(([k,v])=>{ const [t,id]=k.split('||'); return [t, items[id].name, fmt(v)+' '+items[id].unit]; }).sort((a,b)=>a[0].localeCompare(b[0])||a[1].localeCompare(b[1]));
  const issSec = sectionTable('Issued to kitchen', ['Counter / meal','Item','Quantity'], issRows, issRows.length?'':'Nothing issued in this period / filter.');

  const later = mealSections(R);

  let title, secs;
  if (R.type==='stock') { title='Stock & usage report'; secs=[stockSec]; }
  else if (R.type==='purchase') { title='Purchase report'; secs=[purSec]; }
  else if (R.type==='issue') { title='Kitchen issue report'; secs=[issSec]; }
  else if (R.type==='meals') { title = R.from===R.to ? 'Meal sheet' : 'Meal report'; secs = later; }
  else { title='Daily master report'; secs=[stockSec, purSec, issSec].concat(later); }

  const period = R.from===R.to ? R.from : R.from+' to '+R.to;
  const filt = [R.site&&sites[R.site]?'Counter: '+sites[R.site].name:'', R.meal?'Meal: '+R.meal:'', R.cat?'Category: '+R.cat:'', R.item&&items[R.item]?'Item: '+items[R.item].name:''].filter(Boolean).join(' · ');

  // WhatsApp / copy text
  const L = ['*OneByte Production — '+title+'*', '📅 '+period];
  if (filt) L.push(filt);
  secs.forEach(sec=>{
    L.push('', '*'+sec.h+'*');
    if (!sec.rows.length){ L.push('_'+sec.note+'_'); return; }
    sec.rows.forEach(r=>{
      if (sec.line) L.push(sec.line(r));
      else if (sec.cols[0]==='Item') L.push('• '+r[0]+': open '+r[2]+' | +'+r[3]+' | used '+r[4]+(r[5]!=='0'?' | adj '+r[5]:'')+' | *close '+r[6]+'* '+r[1]);
      else L.push('• '+r.filter(x=>x!=='').join(' · '));
    });
  });
  L.push('', '_Internal — Kalyana Sapadu Production Unit_', '_Generated by '+(me?me.name:'')+' · '+new Date().toLocaleString()+'_');
  return { title, period, filt, sections:secs, text:L.join('\n') };
}

function renderReports(){
  const el = $('p-reports');

function shareWhatsApp(text){
  if (!can('reports')) return;
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  const w = window.open(url, '_blank');
  if (!w) location.href = url;
}
function copyText(text){
  const done = ()=>toast('Report copied — paste it in WhatsApp');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, ()=>fallbackCopy(text,done));
  else fallbackCopy(text,done);
}
function fallbackCopy(text, done){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); done(); }catch(e){ alert(text); } t.remove(); }
function downloadCsv(r){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const out = [[r.title, r.period, r.filt].map(q).join(',')];
  r.sections.forEach(sec=>{ if (!sec.rows.length) return; out.push('', q(sec.h), sec.cols.map(q).join(',')); sec.rows.forEach(row=>out.push(row.map(q).join(','))); });
  const blob = new Blob(['\ufeff'+out.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'onebyte-'+r.title.toLowerCase().replace(/[^a-z]+/g,'-')+'-'+rep.from+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

const SERIES_COL = ['#2a78d6','#eb6834','#1baf7a','#eda100','#8a8f87'];
const fmt1 = n => (Math.round(n*10)/10).toString();
let tr = { days:14, site:'', meal:'', item:'' };

function dayKeys(n){
  const out = [], d = new Date();
  for (let i=n-1;i>=0;i--){ const x = new Date(d); x.setDate(x.getDate()-i); out.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')); }
  return out;
}
const shortDay = k => { const d = new Date(k+'T00:00:00'); return d.toLocaleDateString([], {day:'numeric', month:'short'}); };

function chartFrame(id, labels, maxV, inner, W, H, ml, mb, mt){
  const iw = W-ml-10, ih = H-mt-mb;
  const ticks = [0,1,2,3,4].map(i=>maxV*i/4);
  const grid = ticks.map(v=>{ const y = mt+ih-(v/maxV)*ih; return `<line x1="${ml}" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${fmt1(v)}</text>`; }).join('');
  const step = Math.max(1, Math.ceil(labels.length/7));
  const xl = labels.map((l,i)=> i%step===0 || i===labels.length-1 ? `<text x="${ml+(labels.length===1?iw/2:i*iw/(labels.length-1))}" y="${H-6}" text-anchor="${i===labels.length-1&&labels.length>1?'end':'middle'}" font-size="10.5" fill="var(--muted)">${esc(shortDay(l))}</text>` : '').join('');
  return { iw, ih, svgOpen:`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:pan-y" role="img">${grid}${xl}`, svgClose:'</svg>' };
}
const chartData = {};
function niceMax(v){ if (v<=0) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v/p; const n = f<=1?1:f<=2?2:f<=4?4:f<=5?5:10; return n*p; }

function lineChart(id, labels, series, unit){
  const W = 640, H = 230, ml = 42, mb = 24, mt = 12;
  const maxV = niceMax(Math.max(0, ...series.flatMap(s=>s.vals)));
  const f = chartFrame(id, labels, maxV, '', W, H, ml, mb, mt);
  const X = i => ml + (labels.length===1 ? f.iw/2 : i*f.iw/(labels.length-1)), Y = v => mt + f.ih - (v/maxV)*f.ih;
  let body = '';
  series.forEach(s=>{
    const pts = s.vals.map((v,i)=>X(i)+','+Y(v)).join(' ');
    body += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (labels.length<=16) body += s.vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`).join('');
  });
  // direct labels at the right end (de-collided)
  const ends = series.map(s=>({s, y:Y(s.vals[s.vals.length-1])})).sort((a,b)=>a.y-b.y);
  for (let i=1;i<ends.length;i++) if (ends[i].y-ends[i-1].y<12) ends[i].y = ends[i-1].y+12;
  const lab = ends.map(e=>`<text x="${W-10}" y="${e.y-6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--ink)">${esc(e.s.name)}</text>`).join('');
  // hover columns
  const colw = labels.length===1 ? f.iw : f.iw/(labels.length-1);
  const hits = labels.map((l,i)=>`<rect class="hit" data-ch="${id}" data-i="${i}" x="${X(i)-colw/2}" y="${mt}" width="${colw}" height="${f.ih}" fill="transparent"/>`).join('');
  chartData[id] = { labels, series, unit };
  return `<div class="chart">${f.svgOpen}${body}${lab}${hits}${f.svgClose}${legend(series)}</div>`;
}
function barChart(id, labels, series, unit){
  const W = 640, H = 210, ml = 42, mb = 24, mt = 12; const s = series[0];
  const maxV = niceMax(Math.max(0, ...s.vals));
  const f = chartFrame(id, labels, maxV, '', W, H, ml, mb, mt);
  const slot = f.iw/labels.length, bw = Math.min(26, slot*0.62);
  let body = '', hits = '';
  s.vals.forEach((v,i)=>{ const x = ml + slot*i + (slot-bw)/2, h = (v/maxV)*f.ih, y = mt+f.ih-h;
    if (h>0.5) body += `<path d="M${x},${mt+f.ih} V${y+Math.min(4,h)} Q${x},${y} ${x+Math.min(4,bw/2)},${y} H${x+bw-Math.min(4,bw/2)} Q${x+bw},${y} ${x+bw},${y+Math.min(4,h)} V${mt+f.ih} Z" fill="${s.color}"/>`;
    hits += `<rect class="hit" data-ch="${id}" data-i="${i}" x="${ml+slot*i}" y="${mt}" width="${slot}" height="${f.ih}" fill="transparent"/>`; });
  chartData[id] = { labels, series, unit };
  return `<div class="chart">${f.svgOpen}${body}${hits}${f.svgClose}</div>`;
}
function legend(series){
  return series.length>1 ? `<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:4px">${series.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px"><i style="width:10px;height:3px;border-radius:2px;background:${s.color};display:inline-block"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
}
function hbar(rows, unit){
  const mx = Math.max(...rows.map(r=>r[1]), 0.0001);
  return rows.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px"><div style="width:120px;flex:none">${esc(r[0])}</div><div style="flex:1;background:var(--line);border-radius:6px;height:10px"><div style="width:${Math.max(2,r[1]/mx*100)}%;height:10px;border-radius:0 4px 4px 0;background:#eb6834"></div></div><b style="width:64px;text-align:right">${fmt1(r[1])}</b></div>`).join('');
}
function dataTable(labels, series, unit){
  return `<details style="margin-top:6px"><summary style="font-size:12px;color:var(--muted);cursor:pointer">Show data table</summary><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr><th style="text-align:left;padding:5px">Date</th>${series.map(s=>`<th style="text-align:right;padding:5px">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${labels.map((l,i)=>`<tr><td style="padding:4px 5px;border-top:1px solid var(--line)">${esc(shortDay(l))}</td>${series.map(s=>`<td style="text-align:right;padding:4px 5px;border-top:1px solid var(--line)">${fmt1(s.vals[i])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
}

function renderTrends(){
  const el = $('p-trends');
  if (el.contains(document.activeElement) && /SELECT/.test(document.activeElement.tagName)) return;
  const allDays = dayKeys(tr.days), first = allDays[0], last = allDays[allDays.length-1];
  const sel = tr.item && items[tr.item] ? items[tr.item] : null;
  const dishOk = id => { const it = items[id]; if (!it) return false; if (tr.item) return id===tr.item; return it.unit!=='nos'; };
  const unit = sel ? sel.unit : 'kg / L';
  const list = Object.values(sessions).filter(x=>x.date && x.date>=first && x.date<=last && (!tr.site||x.siteId===tr.site) && (!tr.meal||x.meal===tr.meal));
  const have = new Set(list.map(x=>x.date)); const days = allDays.filter(d=>have.has(d)); // days with no meals (e.g. Sat/Sun off) are skipped
  const idx = {}; days.forEach((d,i)=>idx[d]=i);
  const zero = () => days.map(()=>0);
  const loaded = zero(), sold = zero(), waste = zero(), made = zero();
  const perItem = {}, byReason = {}, byDish = {}, byWd = {};
  let sess = 0, closedN = 0;
  list.forEach(x=>{
    sess++; if (T(x,'closed')) closedN++;
    const calc = sessionCalc(x);
    Object.entries(calc).forEach(([id,k])=>{
      if (!dishOk(id)) return; const i = idx[x.date];
      made[i]+=k.prepared; loaded[i]+=k.loaded; sold[i]+=k.sold; waste[i]+=k.waste;
      (perItem[id] = perItem[id]||{name:items[id].name, vals:zero(), tot:0}).vals[i]+=k.sold; perItem[id].tot+=k.sold;
      if (k.waste>0){ const r = k.reason||'No reason'; byReason[r]=(byReason[r]||0)+k.waste; byDish[items[id].name]=(byDish[items[id].name]||0)+k.waste; }
      const wd = new Date(x.date+'T00:00:00').getDay(); const o = (byWd[id]=byWd[id]||{}); (o[wd]=o[wd]||[]).push(k.sold);
    });
  });
  const sum = a => a.reduce((x,y)=>x+y,0);
  const topItems = Object.entries(perItem).filter(([,v])=>v.tot>0).sort((a,b)=>b[1].tot-a[1].tot);
  const top = topItems.slice(0,4), rest = topItems.slice(4);
  const prodSeries = top.map(([,v],i)=>({name:v.name, color:SERIES_COL[i], vals:v.vals}));
  if (rest.length) prodSeries.push({name:'Other', color:SERIES_COL[4], vals:days.map((_,i)=>sum(rest.map(([,v])=>v.vals[i])))});
  const dish = o => Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const o = (arr,s)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${v===s?'selected':''}>${esc(l)}</option>`).join('');
  const wpct = sum(loaded)>0 ? sum(waste)/sum(loaded)*100 : 0;
  const foods = Object.entries(items).filter(([,i])=>i.type==='food').sort((a,b)=>a[1].name.localeCompare(b[1].name));
  const wdNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const wdRows = topItems.slice(0,6).map(([id,v])=>{ const o2 = byWd[id]||{}; return `<tr><td style="padding:5px;border-top:1px solid var(--line)">${esc(v.name)}</td>${[1,2,3,4,5].map(w=>`<td style="text-align:right;padding:5px;border-top:1px solid var(--line)">${o2[w]?fmt1(sum(o2[w])/o2[w].length):'—'}</td>`).join('')}</tr>`; }).join('');
  el.innerHTML = `
    <div class="card"><div class="two"><div><label>Period</label><select id="t_days">${o([[7,'Last 7 days'],[14,'Last 14 days'],[30,'Last 30 days']].map(([a,b])=>[String(a),b]), String(tr.days))}</select></div>
      <div><label>Dish</label><select id="t_item">${o([['','All dishes (kg / L)']].concat(foods.map(([k,i])=>[k,i.name+' ('+i.unit+')'])), tr.item)}</select></div></div>
      <div class="two"><div><label>Counter</label><select id="t_site">${o([['','All counters']].concat(Object.entries(sites).map(([k,s])=>[k,s.name])), tr.site)}</select></div>
      <div><label>Meal</label><select id="t_meal">${o([['','All meals']].concat(MEALS.map(m=>[m,m])), tr.meal)}</select></div></div></div>
    <div class="kpi"><div class="card"><div class="sub">Meals recorded</div><div class="n">${sess}</div><div class="sub">${closedN} closed</div></div>
      <div class="card"><div class="sub">Sold (${esc(unit)})</div><div class="n">${fmt1(sum(sold))}</div></div>
      <div class="card"><div class="sub">Wastage (${esc(unit)})</div><div class="n" style="${wpct>3?'color:var(--red)':''}">${fmt1(sum(waste))}</div><div class="sub">${fmt1(wpct)}% of food at counter</div></div>
      <div class="card"><div class="sub">At counter (${esc(unit)})</div><div class="n">${fmt1(sum(loaded))}</div><div class="sub">made ${fmt1(sum(made))}</div></div></div>
    ${sess ? `
    <h2>Food at counter vs sold vs wasted (${esc(unit)})</h2><div class="card">${lineChart('c1', days, [{name:'At counter',color:SERIES_COL[0],vals:loaded},{name:'Sold',color:SERIES_COL[1],vals:sold},{name:'Wastage',color:SERIES_COL[2],vals:waste}], unit)}${dataTable(days,[{name:'At counter',vals:loaded},{name:'Sold',vals:sold},{name:'Wastage',vals:waste}],unit)}</div>
    <h2>Daily wastage (${esc(unit)})</h2><div class="card">${barChart('c2', days, [{name:'Wastage',color:'#eb6834',vals:waste}], unit)}</div>
    ${prodSeries.length ? `<h2>Sales by product (${esc(unit)})</h2><div class="card">${lineChart('c3', days, prodSeries, unit)}${dataTable(days, prodSeries, unit)}</div>` : ''}
    ${Object.keys(byReason).length ? `<h2>Wastage by reason</h2><div class="card">${hbar(dish(byReason), unit)}</div><h2>Most wasted dishes</h2><div class="card">${hbar(dish(byDish), unit)}</div>` : '<div class="soon" style="margin-top:12px">No wastage recorded in this period.</div>'}
    ${wdRows ? `<h2>Average sold by weekday</h2><div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px"><thead><tr><th style="text-align:left;padding:5px">Dish</th>${[1,2,3,4,5].map(w=>`<th style="text-align:right;padding:5px">${wdNames[w]}</th>`).join('')}</tr></thead><tbody>${wdRows}</tbody></table><div class="sub" style="margin-top:6px">This pattern drives the tomorrow's-quantity suggestions once a few weeks of data exist.</div></div>` : ''}
    ` : '<div class="empty">No meal sheets recorded in this period yet. Graphs appear once meals are closed with sales and wastage.</div>'}`;
  const bind = (id,key,num_) => $(id).onchange = ()=>{ tr[key] = num_ ? +$(id).value : $(id).value; renderTrends(); };
  bind('t_days','days',true); bind('t_item','item'); bind('t_site','site'); bind('t_meal','meal');
  el.querySelectorAll('.hit').forEach(h=>{
    const show = e => { const c = chartData[h.dataset.ch], i = +h.dataset.i; const tt = $('tt'); const r = h.getBoundingClientRect(); const pt = e.touches ? e.touches[0] : e;
      tt.innerHTML = '<b>'+esc(shortDay(c.labels[i]))+'</b>'+c.series.map(s=>'<div><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+s.color+';margin-right:5px"></i>'+esc(s.name)+': <b>'+fmt1(s.vals[i])+'</b> '+esc(c.unit)+'</div>').join('');
      tt.style.display='block'; tt.style.left = Math.min(window.innerWidth-170, Math.max(8, pt.clientX+10))+'px'; tt.style.top = Math.max(8, pt.clientY-60)+'px'; };
    h.addEventListener('mousemove', show); h.addEventListener('touchstart', show, {passive:true}); h.addEventListener('mouseleave', ()=>{ $('tt').style.display='none'; });
  });
}

function importSeed(){
  const have = new Set(Object.values(items).map(i=>i.name.toLowerCase()));
  const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const upd = {};
  SEED.forEach(x=>{ if (!have.has(x.n.toLowerCase())) upd[slug(x.n)] = { name:x.n, ta:x.t, type:'raw', unit:x.u, category:x.c, minStock:0, active:true }; });
  SEED_DISHES.forEach(x=>{ if (!have.has(x.n.toLowerCase())) upd['dish-'+slug(x.n)] = { name:x.n, type:'food', unit:x.u, category:x.c, diet:x.d, meals:x.m, portionG:x.g||null, minStock:0, active:true }; });
  const n = Object.keys(upd).length; if (!n){ toast('Nothing new to add'); return; }
  db.ref(P+'items').update(upd).then(()=>toast(n+' items added — set minimum stock for the ones you track'));
}
function itemForm(id){
  const i = id ? items[id] : { name:'', type:'raw', unit:'kg', category:'', minStock:0 };
  $('mf').innerHTML = formShell(id?'Edit item':'New item', `
    <label>Name</label><input id="i_name" value="${esc(i.name)}" placeholder="e.g. Ponni rice / Veg biryani">
    <div class="two"><div><label>Type</label><select id="i_type"><option value="raw" ${i.type==='raw'?'selected':''}>Raw material</option><option value="food" ${i.type==='food'?'selected':''}>Cooked food</option></select></div>
    <div><label>Unit</label><select id="i_unit">${unitOpts(i.unit)}</select></div></div>
    <div class="two"><div><label>Category</label><input id="i_cat" value="${esc(i.category||'')}" placeholder="Rice / Veg / Dal / Oil…"></div>
    <div><label>Minimum stock (raw only)</label><input id="i_min" type="number" inputmode="decimal" step="any" value="${i.minStock||0}"></div></div>
    <div class="two"><div><label>Tamil name (optional)</label><input id="i_ta" value="${esc(i.ta||'')}"></div>
    <div><label>Plate size in grams (cooked, optional)</label><input id="i_portion" type="number" inputmode="decimal" step="any" value="${i.portionG||''}" placeholder="to enter sales as plates"></div></div>`, 'i_save');
  $('i_save').onclick = ()=>{
    const name = $('i_name').value.trim(); if (!name){ alert('Enter a name.'); return; }
    const dup = Object.entries(items).some(([k,x])=>k!==id && x.name.toLowerCase()===name.toLowerCase());
    if (dup){ alert('An item with this name already exists.'); return; }
    const rec = { name, type:$('i_type').value, unit:$('i_unit').value, category:$('i_cat').value.trim(), minStock:Math.max(0,num($('i_min').value)||0), ta:$('i_ta').value.trim()||null, portionG:num($('i_portion').value)>0?num($('i_portion').value):null, active:true };
    const ref = id ? db.ref(P+'items/'+id) : db.ref(P+'items').push();
    ref.update(rec).then(()=>{ toast('Saved'); $('mf').innerHTML=''; });
  };
}

  };
}

/* ============ USERS (admin) ============ */
const STARTER_USERS = [
  {name:'Owner (Admin)',      username:'admin',         password:'EVP@admin26',   role:'admin'},
  {name:'Production Manager', username:'manager',       password:'Mgr@2026',      role:'prodmanager', rep:true},
  {name:'Store Keeper',       username:'store',         password:'Store@2026',    role:'store'},
  {name:'Purchase',           username:'purchase',      password:'Buy@2026',      role:'store'},
  {name:'Kitchen Head',       username:'kitchen',       password:'Cook@2026',     role:'kitchen'},
  {name:'Driver 1',           username:'driver1',       password:'Drive@2026-1',  role:'driver'},
  {name:'Driver 2',           username:'driver2',       password:'Drive@2026-2',  role:'driver'},
  {name:'Teleperformance Supervisor', username:'tp.supervisor',   password:'TpSup@2026',   role:'supervisor', site:'tele'},
  {name:'Teleperformance Counter',    username:'tp.counter',      password:'TpCtr@2026',   role:'counter',    site:'tele'},
  {name:'HDFC Supervisor',            username:'hdfc.supervisor', password:'HdfcSup@2026', role:'supervisor', site:'hdfc'},
  {name:'HDFC Counter',               username:'hdfc.counter',    password:'HdfcCtr@2026', role:'counter',    site:'hdfc'}
];
function genPw(){ const w=['Kitchen','Spice','Idli','Sambar','Rasam','Pongal','Vada','Dosa'][Math.floor(Math.random()*8)]; return w+'@'+(1000+Math.floor(Math.random()*9000)); }
function credsText(){
  return '*OneByte Production — logins*\nApp: https://evppalace.github.io/alangaram/onebyte-production.html\n\n' +
    Object.values(users).map(u=>`${u.name} (${(ROLES[u.role]||{}).label||u.role}${ROLES[u.role]&&ROLES[u.role].site&&sites[u.siteId]?' – '+sites[u.siteId].name:''})\nUsername: ${u.username||'—'}\nPassword: ${u.password||u.pin||'—'}`).join('\n\n') +
    '\n\nInternal use only. Do not share. Change your password after first login.';
}
function renderUsers(){
  const el = $('p-users');
  if (el.querySelector('input:focus, select:focus')) return;
  const rows = Object.entries(users);
  el.innerHTML = `<div class="sub" style="margin-bottom:10px">Each person logs in with their own username and password. Counter Staff and Site Supervisors are locked to one counter.</div>
    <button class="btn save" id="addUser" style="margin:0 0 8px">+ Add user</button>
    <button class="btn" id="starterUsers" style="margin:0 0 8px;background:var(--ok-soft);color:var(--brand)">⚡ Create starter team logins</button>
    <button class="btn" id="credSheet" style="margin:0 0 12px;background:#eef2ee;color:#222">📋 Login list — share / print</button><div id="uf"></div>` +
    (rows.length ? rows.map(([id,u])=>`<div class="card"><b>${esc(u.name)}</b><span class="tag">${esc((ROLES[u.role]||{}).label||u.role)}</span>
      <div class="sub">👤 <b>${esc(u.username||'(no username)')}</b> · 🔑 <b>${esc(u.password||u.pin||'')}</b></div>
      <div class="sub">${u.role==='admin'||(u.perms&&u.perms.reports)?'📄 Reports · ':''}${ROLES[u.role]&&ROLES[u.role].site ? esc((sites[u.siteId]||{}).name||'— no counter —') : 'All counters'}</div>
      <div class="actions"><button data-e="${id}">Edit</button><button class="danger" data-d="${id}">Delete</button></div></div>`).join('') : '<div class="empty">No users yet. Tap “Create starter team logins”, or sign in as admin / 1234 and add your own.</div>');
  $('addUser').onclick = ()=>userForm(null);
  $('starterUsers').onclick = ()=>{
    const have = new Set(Object.values(users).map(x=>(x.username||'').toLowerCase()));
    const find = k=>Object.entries(sites).find(([i,x])=>(x.name||'').toLowerCase().includes(k));
    const add = STARTER_USERS.filter(x=>!have.has(x.username));
    if (!add.length){ toast('Starter logins already exist'); return; }
    if (!confirm('Create '+add.length+' logins? Change the passwords afterwards.')) return;
    const upd = {};
    add.forEach(x=>{ const k = db.ref(P+'users').push().key; const st = x.site ? find(x.site) : null;
      upd[k] = { name:x.name, username:x.username, password:x.password, role:x.role, siteId: st?st[0]:'all', perms:{ reports: x.role==='admin' || !!x.rep } }; });
    db.ref(P+'users').update(upd).then(()=>toast('Logins created'));
  };
  $('credSheet').onclick = ()=>{
    const t = credsText();
    $('uf').innerHTML = formShell('Login list', `<textarea id="cs" readonly style="width:100%;height:260px;font-size:13px">${esc(t)}</textarea>
      <div class="actions"><button id="cs_wa">WhatsApp</button><button id="cs_cp">Copy</button><button id="cs_pr">Print</button></div>`, null);
    $('cs_wa').onclick = ()=>window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
    $('cs_cp').onclick = ()=>{ $('cs').select(); try{ document.execCommand('copy'); toast('Copied'); }catch(e){} };
    $('cs_pr').onclick = ()=>{ const w=window.open('','_blank'); if(w){ w.document.write('<pre style="font:15px/1.6 sans-serif;white-space:pre-wrap">'+esc(t)+'</pre>'); w.print(); } };
  };
  el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>userForm(b.dataset.e));
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    const u = users[b.dataset.d];
    if (u.role==='admin' && Object.values(users).filter(x=>x.role==='admin').length===1){ alert('You cannot delete the only Admin.'); return; }
    if (confirm('Delete login for '+u.name+'?')) db.ref(P+'users/'+b.dataset.d).remove();
  });
}
function userForm(id){
  const u = id ? users[id] : { name:'', username:'', password:'', role:'counter', siteId:'' };
  $('uf').innerHTML = formShell(id?'Edit user':'New user', `
    <label>Name</label><input id="u_name" value="${esc(u.name)}" placeholder="e.g. Ravi">
    <label>Username (no spaces, unique)</label><input id="u_user" autocapitalize="none" value="${esc(u.username||'')}" placeholder="e.g. ravi.store">
    <label>Password (min 4 characters)</label><div style="display:flex;gap:6px"><input id="u_pass" value="${esc(u.password||u.pin||'')}"><button type="button" id="u_gen" style="white-space:nowrap">Generate</button></div>
    <label>Role</label><select id="u_role">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${u.role===k?'selected':''}>${r.label} — ${r.desc}</option>`).join('')}</select>
    <div id="u_repWrap"><label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="u_rep" ${u.perms&&u.perms.reports?'checked':''} style="width:auto"> Can view &amp; share reports</label><div class="sub">Admin always has access.</div></div>
    <div id="u_siteWrap"><label>Counter</label><select id="u_site"><option value="">Select…</option>${Object.entries(sites).map(([k,s])=>`<option value="${k}" ${u.siteId===k?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`, 'u_save');
  const sync = ()=>{ $('u_repWrap').style.display = $('u_role').value==='admin' ? 'none' : 'block'; $('u_siteWrap').style.display = ROLES[$('u_role').value].site ? 'block' : 'none'; };
  $('u_role').onchange = sync; sync();
  $('u_gen').onclick = ()=>{ $('u_pass').value = genPw(); };
  $('u_save').onclick = ()=>{
    const name = $('u_name').value.trim(), username = $('u_user').value.trim().toLowerCase(), password = $('u_pass').value.trim(), role = $('u_role').value;
    const siteId = ROLES[role].site ? $('u_site').value : 'all';
    if (!name){ alert('Enter a name.'); return; }
    if (!/^[a-z0-9._-]{3,}$/.test(username)){ alert('Username: at least 3 letters/numbers, no spaces.'); return; }
    if (password.length<4){ alert('Password must be at least 4 characters.'); return; }
    if (ROLES[role].site && !siteId){ alert('Pick a counter for this role.'); return; }
    if (Object.entries(users).some(([k,x])=>(x.username||'').toLowerCase()===username && k!==id)){ alert('That username is already used.'); return; }
    const ref = id ? db.ref(P+'users/'+id) : db.ref(P+'users').push();
    ref.set({ name, username, password, role, siteId, perms:{ reports: role==='admin' || $('u_rep').checked } }).then(()=>{
      toast('Saved'); $('uf').innerHTML='';
      if (me.id==='setup' && role==='admin') toast('Admin created — setup login is now disabled');
    });
  };
}
</script>
